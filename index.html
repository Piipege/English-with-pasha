/* ---------------- PRESENT ---------------- */
{
id:'present', title:'Present Simple & Continuous', ru:'Настоящие времена', levels:['B1','B2'],
lead:'В русском одно настоящее время: «я работаю» значит и «вообще», и «сейчас». В английском это два разных времени, а глаголы состояния в Continuous обычно не ставятся.',
sections:[
{h:'Present Simple', lvl:'B1', html:`
<p>Привычки, регулярные действия, факты, постоянные состояния.</p>
<div class="formula">V / V<b>-s</b> (he, she, it) &nbsp;·&nbsp; do/does + not + V &nbsp;·&nbsp; Do/Does … + V?</div>
<div class="ex">
<div>I <mark>work</mark> in a bank. · She <mark>doesn’t eat</mark> meat.</div>
<div>Water <mark>boils</mark> at 100°C.</div>
</div>
<h4>Маркеры</h4>
<p>always, usually, often, sometimes, rarely, never, every day, on Mondays, twice a week</p>
`},
{h:'Present Continuous', lvl:'B1', html:`
<div class="formula"><b>am / is / are</b> + V-ing</div>
<ul class="use">
<li>Прямо сейчас: <i>Shh, the baby is sleeping.</i></li>
<li>Временная ситуация: <i>I’m living with my parents this month.</i></li>
<li>Изменения и тенденции: <i>Prices are going up. · Your English is getting better.</i></li>
<li>Раздражающая привычка с always (B2): <i>He’s always losing his keys!</i></li>
</ul>
<div class="ex">
<div><em>Сравните:</em> I <mark>live</mark> in Moscow. (постоянно) / I’<mark>m living</mark> in a hotel. (временно)</div>
</div>
`},
{h:'Глаголы состояния', lvl:'B2', html:`
<p>Глаголы, которые описывают состояние, а не действие, обычно не используются в Continuous.</p>
<table><tr><th>Группа</th><th>Глаголы</th></tr>
<tr><td>Мысли</td><td>know, understand, believe, think (= считать), remember, mean, agree</td></tr>
<tr><td>Чувства</td><td>like, love, hate, prefer, want, need, wish</td></tr>
<tr><td>Обладание</td><td>have (= иметь), own, belong, contain</td></tr>
<tr><td>Восприятие</td><td>see, hear, seem, look (= выглядеть), taste, smell</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ I am agree.</span> → <span style="color:var(--ok)">✓ I agree.</span> (agree: глагол, а не прилагательное)</p><p><span style="color:var(--bad)">✗ I am understanding you.</span> → <span style="color:var(--ok)">✓ I understand you.</span></p></div></div>
`},
{h:'Глаголы с двумя значениями', lvl:'B2', html:`
<table><tr><th>Глагол</th><th>Состояние (Simple)</th><th>Действие (Continuous)</th></tr>
<tr><td>think</td><td>I think it’s a good idea. (считаю)</td><td>I’m thinking about it. (обдумываю)</td></tr>
<tr><td>have</td><td>She has two cats. (имеет)</td><td>She’s having lunch. (обедает)</td></tr>
<tr><td>see</td><td>I see what you mean. (понимаю)</td><td>I’m seeing the doctor at 5. (встречаюсь)</td></tr>
<tr><td>taste</td><td>This soup tastes great.</td><td>He’s tasting the soup. (пробует)</td></tr>
<tr><td>be</td><td>He is rude. (по характеру)</td><td>He’s being rude. (ведёт себя сейчас)</td></tr></table>
`}
],
quiz:[
{t:'mc', q:'Look! It ___ outside.', o:['snows','is snowing','snowing','snowed'], a:1, e:'Look!: действие прямо сейчас → Present Continuous.', l:'B1'},
{t:'mc', q:'She ___ to work by bus every day.', o:['is going','go','goes','going'], a:2, e:'Привычка + he/she/it → goes.', l:'B1'},
{t:'mc', q:'Which sentence is correct?', o:['I am agree with you.','I agree with you.','I am agreeing with you.','I agreeing with you.'], a:1, e:'agree является глаголом: I agree. Не путайте с русским «я согласен».', l:'B1'},
{t:'gap', q:'Water ___ (boil) at 100 degrees Celsius.', a:['boils'], e:'Научный факт → Present Simple.', l:'B1'},
{t:'mc', q:'I ___ with my aunt until I find a flat.', o:['stay','am staying','stays','stayed'], a:1, e:'Временная ситуация → Present Continuous.', l:'B1'},
{t:'mc', q:'This cake ___ delicious!', o:['is tasting','tastes','taste','tasting'], a:1, e:'taste в значении «иметь вкус»: глагол состояния → tastes.', l:'B2'},
{t:'mc', q:'A: What are you doing? B: I ___ about my holiday plans.', o:['think','am thinking','thinks','thought'], a:1, e:'think = обдумывать (процесс) → Continuous.', l:'B2'},
{t:'gap', q:'I ___ (not / understand) this word. Can you explain it?', a:["don't understand",'do not understand'], e:'understand: глагол состояния → Present Simple.', l:'B1'},
{t:'mc', q:'The climate ___ warmer every year.', o:['gets','is getting','get','has get'], a:1, e:'Изменение, тенденция → Present Continuous.', l:'B2'},
{t:'mc', q:'He’s ___ his phone! It’s so annoying.', o:['always losing','losing always','always loses','always lose'], a:0, e:'Раздражающая привычка → always + Present Continuous.', l:'B2'},
{t:'mc', q:'Why ___ so rude today? You’re not usually like this.', o:['are you','are you being','do you be','you are'], a:1, e:'be в значении «вести себя сейчас» → are you being.', l:'B2'},
{t:'gap', q:'We ___ (have) dinner at the moment, can I call you back?', a:['are having',"'re having"], e:'have = есть, обедать (действие) → Continuous.', l:'B1'}
]

/* ---------------- QUESTIONS ---------------- */
{
id:'questions', title:'Question Forms', ru:'Вопросы', levels:['B1','B2'],
lead:'В русском вопрос часто отличается от утверждения только интонацией: «Ты пришёл?». В английском нужен вспомогательный глагол и особый порядок слов, иначе вопрос звучит как удивление или ошибка.',
sections:[
{h:'Порядок слов: QASI', lvl:'B1', html:`
<div class="formula"><b>Q</b>uestion word · <b>A</b>uxiliary · <b>S</b>ubject · <b>I</b>nfinitive</div>
<table><tr><th>Q</th><th>A</th><th>S</th><th>I</th></tr>
<tr><td>Where</td><td>do</td><td>you</td><td>live?</td></tr>
<tr><td>What</td><td>did</td><td>she</td><td>say?</td></tr>
<tr><td>How long</td><td>have</td><td>you</td><td>been waiting?</td></tr>
<tr><td></td><td>Can</td><td>you</td><td>swim?</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ What means this word?</span> → <span style="color:var(--ok)">✓ What does this word mean?</span></p><p><span style="color:var(--bad)">✗ You came yesterday?</span> (только как удивление) → <span style="color:var(--ok)">✓ Did you come yesterday?</span></p></div></div>
`},
{h:'Вопросы к подлежащему', lvl:'B2', html:`
<p>Если вопрос задаётся к подлежащему (Who? What? Which?), вспомогательный do/does/did <b>не нужен</b>.</p>
<div class="ex">
<div><mark>Who called</mark> you? (кто-то позвонил) · <mark>Who did you call</mark>? (ты позвонил кому-то)</div>
<div><mark>What happened</mark>? (<span class="no">✗ What did happen?</span>)</div>
<div><mark>Which team won</mark> the match?</div>
</div>
`},
{h:'Предлог в конце', lvl:'B1', html:`
<p>В разговорном английском предлог стоит в конце вопроса.</p>
<div class="ex">
<div><mark>Who</mark> are you talking <mark>to</mark>? · <mark>What</mark> are you looking <mark>at</mark>?</div>
<div><mark>Where</mark> are you <mark>from</mark>? · <mark>What</mark> is this <mark>for</mark>?</div>
<div><mark>What</mark> is she <mark>like</mark>? (какая она?) ≠ What does she <mark>like</mark>? (что ей нравится?)</div>
</div>
`},
{h:'Разделительные вопросы (tags)', lvl:'B2', html:`
<p>«…, не так ли?» Утверждение → отрицательный хвостик, отрицание → положительный.</p>
<div class="ex">
<div>You’re French, <mark>aren’t you</mark>? · She doesn’t smoke, <mark>does she</mark>?</div>
<div>They’ve finished, <mark>haven’t they</mark>? · He went home, <mark>didn’t he</mark>?</div>
</div>
<table><tr><th>Особый случай</th><th>Хвостик</th></tr>
<tr><td>I am late, …</td><td>aren’t I?</td></tr>
<tr><td>Let’s go, …</td><td>shall we?</td></tr>
<tr><td>Open the window, …</td><td>will you? / could you?</td></tr>
<tr><td>He never calls, … (отрицательное слово)</td><td>does he?</td></tr>
<tr><td>Nobody came, …</td><td>did they?</td></tr></table>
`},
{h:'Косвенные вопросы', lvl:'B2', html:`
<p>Вежливые вопросы: <i>Could you tell me…? Do you know…? I wonder…</i> После них: <b>прямой порядок слов</b>.</p>
<div class="ex">
<div>Where is the station? → Could you tell me <mark>where the station is</mark>?</div>
<div>Does the shop open on Sundays? → Do you know <mark>if the shop opens</mark> on Sundays?</div>
</div>
`}
],
quiz:[
{t:'mc', q:'What ___ this word ___?', o:['means / Ø','does / mean','is / mean','do / means'], a:1, e:'Нужен вспомогательный does: What does this word mean?', l:'B1'},
{t:'mc', q:'Who ___ the window?', o:['did break','broke','did broken','breaked'], a:1, e:'Вопрос к подлежащему (кто разбил?) → без did: Who broke…?', l:'B2'},
{t:'mc', q:'A: Who ___ to the party? B: I invited Anna and Tom.', o:['invited you','did you invite','you invited','did invite you'], a:1, e:'Вопрос к дополнению (кого пригласил ты) → did you invite.', l:'B2'},
{t:'gap', q:'Where ___ you from? (одно слово)', a:['are'], e:'Where are you from?: предлог в конце.', l:'B1'},
{t:'mc', q:'You’re coming tomorrow, ___?', o:['are you','aren’t you','don’t you','isn’t it'], a:1, e:'Утверждение с are → хвостик aren’t you.', l:'B2'},
{t:'mc', q:'She doesn’t eat meat, ___?', o:['does she','doesn’t she','is she','do she'], a:0, e:'Отрицание → положительный хвостик does she.', l:'B2'},
{t:'mc', q:'I’m late, ___?', o:['amn’t I','aren’t I','am I not','isn’t it'], a:1, e:'Особый случай: I am → aren’t I.', l:'B2'},
{t:'mc', q:'Let’s order a pizza, ___?', o:['will we','do we','shall we','let we'], a:2, e:'Let’s … → shall we?', l:'B2'},
{t:'mc', q:'Could you tell me where ___?', o:['is the bank','the bank is','does the bank','is bank'], a:1, e:'Косвенный вопрос → прямой порядок слов: where the bank is.', l:'B2'},
{t:'mc', q:'A: What’s your new boss ___? B: She’s friendly but strict.', o:['like','likes','liking','look'], a:0, e:'What is sb like? = какой он/она по характеру.', l:'B1'},
{t:'gap', q:'How long ___ you been learning English? (одно слово)', a:['have'], e:'Present Perfect Continuous: How long have you been…?', l:'B1'},
{t:'mc', q:'What ___ yesterday? You look upset.', o:['did happen','happened','was happen','happen'], a:1, e:'What: подлежащее → What happened? без did.', l:'B2'}
]
},

/* ---------------- COMPARATIVES ---------------- */
{
id:'comparatives', title:'Comparatives & Superlatives', ru:'Степени сравнения', levels:['B1','B2'],
lead:'Сравнивать умеют все с уровня A2, но на B2 важны детали: насколько больше (much, slightly, twice as), конструкции the more… the better и типичные кальки с русского.',
sections:[
{h:'Образование', lvl:'B1', html:`
<table><tr><th>Прилагательное</th><th>Сравнительная</th><th>Превосходная</th></tr>
<tr><td>Короткие: cheap, big</td><td>cheaper, bigger</td><td>the cheapest, the biggest</td></tr>
<tr><td>На -y: easy, happy</td><td>easier, happier</td><td>the easiest</td></tr>
<tr><td>Длинные: expensive</td><td>more expensive</td><td>the most expensive</td></tr>
<tr><td>good / bad</td><td>better / worse</td><td>the best / the worst</td></tr>
<tr><td>far</td><td>further / farther</td><td>the furthest</td></tr>
<tr><td>little / much, many</td><td>less / more</td><td>the least / the most</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ more better</span> · <span style="color:var(--bad)">✗ the most best</span> · <span style="color:var(--bad)">✗ more easy</span></p></div></div>
`},
{h:'Насколько больше', lvl:'B2', html:`
<table><tr><th>Разница</th><th>Слова</th><th>Пример</th></tr>
<tr><td>Большая</td><td>much, far, a lot, considerably</td><td>It’s much cheaper online.</td></tr>
<tr><td>Маленькая</td><td>a bit, a little, slightly</td><td>She’s slightly taller than me.</td></tr>
<tr><td>Усиление</td><td>even</td><td>Today is even hotter than yesterday.</td></tr>
<tr><td>С превосходной</td><td>by far, easily</td><td>It’s by far the best film this year.</td></tr></table>
<p><span style="color:var(--bad)">✗ very cheaper</span>: very со сравнительной степенью не используется.</p>
`},
{h:'as … as', lvl:'B1', html:`
<div class="ex">
<div>She’s <mark>as tall as</mark> her brother. (одинаково)</div>
<div>It’s <mark>not as / not so cold as</mark> yesterday. (меньше)</div>
<div>This phone is <mark>twice as expensive as</mark> that one. (в два раза дороже)</div>
<div>The new version is <mark>nowhere near as good as</mark> the old one. (B2, гораздо хуже)</div>
<div><mark>the same as</mark> · <mark>similar to</mark> · <mark>different from</mark></div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>«В два раза дороже» → <span style="color:var(--ok)">✓ twice as expensive as</span>, а не <span style="color:var(--bad)">✗ two times more expensive</span> (так говорят, но звучит менее естественно).</p></div></div>
`},
{h:'Особые конструкции', lvl:'B2', html:`
<div class="ex">
<div><mark>The more</mark> you read, <mark>the better</mark> your English gets.</div>
<div>It’s getting <mark>colder and colder</mark>. · <mark>more and more</mark> expensive</div>
<div>the tallest <mark>in</mark> the class (место) · the best <mark>of</mark> all (группа)</div>
<div>He’s taller <mark>than me</mark> (разговорно) = taller <mark>than I am</mark> (нейтрально)</div>
</div>
`}
],
quiz:[
{t:'mc', q:'This exercise is ___ than the last one.', o:['more easy','easier','more easier','easyer'], a:1, e:'easy → easier.', l:'B1'},
{t:'mc', q:'It was the ___ day of my life.', o:['most bad','worse','worst','baddest'], a:2, e:'bad → worse → the worst.', l:'B1'},
{t:'mc', q:'My new flat is ___ bigger than the old one.', o:['very','much','more','most'], a:1, e:'Большая разница → much + сравнительная степень. Very нельзя.', l:'B2'},
{t:'gap', q:'Train tickets are twice ___ expensive as bus tickets. (одно слово)', a:['as'], e:'twice as … as = в два раза.', l:'B2'},
{t:'mc', q:'The ___ you practise, the more confident you become.', o:['much','most','more','many'], a:2, e:'The more …, the more …', l:'B2'},
{t:'mc', q:'Today isn’t ___ warm as yesterday.', o:['so','such','than','more'], a:0, e:'not as / so … as.', l:'B1'},
{t:'mc', q:'She is the tallest girl ___ her class.', o:['of','in','from','at'], a:1, e:'После превосходной степени с местом/группой-коллективом → in.', l:'B1'},

/* ---------------- PREPOSITIONS ---------------- */
{
id:'prepositions', title:'Prepositions', ru:'Предлоги', levels:['B1','B2'],
lead:'Предлоги почти не переводятся напрямую: «зависеть от» = depend on, «жениться на» = marry (без предлога). Их нужно учить вместе со словами.',
sections:[
{h:'Предлоги времени', lvl:'B1', html:`
<table><tr><th>at</th><th>on</th><th>in</th></tr>
<tr><td>точное время: at 5 o’clock<br>at night, at the weekend (BrE)<br>at Christmas, at the moment</td><td>дни и даты: on Monday<br>on 5 May, on my birthday<br>on Monday morning</td><td>месяцы, годы, сезоны: in May, in 2024<br>in summer, in the 1990s<br>in the morning / evening</td></tr></table>
<p>Без предлога: <i>this / next / last / every</i> + время: <i>next week, last year, every Sunday</i>.</p>
<p><b>on time</b> (вовремя, по графику) · <b>in time</b> (заранее, успеть)</p>
`},
{h:'Предлоги места', lvl:'B1', html:`
<ul class="use">
<li><b>at</b>: точка, место события: <i>at the station, at work, at a party, at the door</i></li>
<li><b>in</b>: внутри, города и страны: <i>in the car, in London, in the kitchen</i></li>
<li><b>on</b>: поверхность, транспорт: <i>on the table, on the wall, on the bus / train / plane</i> (но <i>in a car / taxi</i>)</li>
</ul>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ arrive to London</span> → <span style="color:var(--ok)">✓ arrive in London · arrive at the airport</span></p></div></div>
`},
{h:'Прилагательное + предлог', lvl:'B2', html:`
<table><tr><th>Предлог</th><th>Прилагательные</th></tr>
<tr><td>at</td><td>good / bad at, surprised at</td></tr>
<tr><td>in</td><td>interested in</td></tr>
<tr><td>of</td><td>afraid of, proud of, tired of, aware of, full of, capable of</td></tr>
<tr><td>on</td><td>keen on</td></tr>
<tr><td>for</td><td>responsible for, famous for</td></tr>
<tr><td>to</td><td>married to, similar to, kind to</td></tr>
<tr><td>with / about</td><td>angry with sb · angry about sth</td></tr>
<tr><td>from</td><td>different from</td></tr></table>
`},
{h:'Глагол + предлог', lvl:'B2', html:`
<table><tr><th>С предлогом</th><th>Без предлога (в отличие от русского)</th></tr>
<tr><td>depend on, rely on, insist on</td><td>discuss sth (✗ discuss about)</td></tr>
<tr><td>listen to, belong to, apply for</td><td>marry sb (✗ marry with)</td></tr>
<tr><td>wait for, pay for, apologise for</td><td>enter the room (✗ enter into)</td></tr>
<tr><td>consist of, succeed in</td><td>answer the question, call sb</td></tr>
<tr><td>complain about, worry about</td><td>explain sth <b>to</b> sb (✗ explain me)</td></tr></table>
`}
],

/* ---------------- WORD ORDER ---------------- */
{
id:'wordorder', title:'Word Order & Adverbs', ru:'Порядок слов и наречия', levels:['B1','B2'],
lead:'В русском порядок слов свободный, а в английском он фиксированный: подлежащее, глагол, дополнение. Особенно важно, где стоят наречия: very much, always, also, enough.',
sections:[
{h:'S + V + O', lvl:'B1', html:`
<p>Между глаголом и дополнением ничего не вставляют.</p>
<div class="ex">
<div class="no">✗ I like very much tea. · ✗ She speaks very well English.</div>
<div class="yes">✓ I like tea very much. · ✓ She speaks English very well.</div>
</div>
<p>Порядок обстоятельств: <b>как → где → когда</b>: <i>She sang beautifully at the concert last night.</i></p>
`},
{h:'Наречия частотности', lvl:'B1', html:`
<table><tr><th>Позиция</th><th>Пример</th></tr>
<tr><td>Перед основным глаголом</td><td>I <b>often</b> go to the gym.</td></tr>
<tr><td>После be</td><td>She is <b>always</b> late.</td></tr>
<tr><td>После вспомогательного</td><td>I have <b>never</b> been there. · I can <b>usually</b> come.</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ Always I am late.</span> · <span style="color:var(--bad)">✗ I go often to the gym.</span></p></div></div>
`},
{h:'also, too, as well, either', lvl:'B1', html:`
<ul class="use">
<li><b>also</b>: в середине (как always): <i>I also speak French.</i></li>
<li><b>too / as well</b>: в конце: <i>I speak French too.</i></li>
<li><b>either</b>: в отрицаниях, в конце: <i>I don’t speak French either.</i> (✗ I don’t speak French too)</li>
</ul>
`},
{h:'enough, still, already, yet', lvl:'B1', html:`
<div class="ex">
<div>прилагательное + <mark>enough</mark>: <i>old enough, warm enough</i></div>
<div><mark>enough</mark> + существительное: <i>enough money, enough time</i></div>
<div><mark>still</mark>: в середине: <i>She still lives here.</i></div>
<div><mark>already</mark>: в середине: <i>I’ve already finished.</i> · <mark>yet</mark>: в конце: <i>Have you finished yet?</i></div>
</div>
`},
{h:'Порядок прилагательных', lvl:'B2', html:`
<div class="formula">мнение · размер · возраст · форма · цвет · происхождение · материал · назначение + сущ.</div>
<div class="ex">
<div>a <mark>lovely little old</mark> house</div>
<div>a <mark>big round wooden</mark> table</div>
<div>an <mark>expensive Italian leather</mark> bag</div>
</div>
<p>Обычно используют не больше трёх прилагательных подряд.</p>
`}
],
quiz:[

{t:'mc', q:'Choose the correct sentence.', o:['She always is late.','She is always late.','Always she is late.','She is late always.'], a:1, e:'Наречие частотности стоит после be.', l:'B1'},
{t:'mc', q:'I ___ to the cinema on Fridays.', o:['go usually','usually go','am usually go','go usual'], a:1, e:'Перед основным глаголом: usually go.', l:'B1'},

{t:'mc', q:'He isn’t ___ to drive.', o:['enough old','old enough','enough age','oldly enough'], a:1, e:'прилагательное + enough.', l:'B1'},
{t:'gap', q:'Have you finished your homework ___? (одно слово)', a:['yet'], e:'yet: в конце вопросов и отрицаний.', l:'B1'},
{t:'mc', q:'She speaks ___.', o:['very well English','English very well','well very English','English well very'], a:1, e:'speak + язык + наречие.', l:'B1'},
{t:'mc', q:'I have ___ been to Japan.', o:['never','ever not','not never','none'], a:0, e:'never: после вспомогательного have.', l:'B1'},
{t:'mc', q:'She bought ___ bag.', o:['a leather Italian expensive','an expensive Italian leather','an Italian expensive leather','a leather expensive Italian'], a:1, e:'Мнение → происхождение → материал.', l:'B2'},
{t:'mc', q:'We stayed in ___ cottage.', o:['a small lovely old','a lovely small old','an old lovely small','a small old lovely'], a:1, e:'Мнение → размер → возраст.', l:'B2'},
{t:'mc', q:'Which order is correct?', o:['She played well yesterday at the match.','She played well at the match yesterday.','She yesterday played well at the match.','She played at the match well yesterday.'], a:1, e:'Как → где → когда.', l:'B2'},
{t:'gap', q:'I ___ live with my parents, I haven’t moved out yet. (одно слово)', a:['still'], e:'still = всё ещё, стоит перед основным глаголом.', l:'B2'}

/* ---------------- ADJECTIVES ---------------- */
{
id:'adjectives', title:'Adjectives: -ed/-ing, so/such, too/enough', ru:'Прилагательные и усилители', levels:['B1','B2'],
lead:'Несколько небольших тем, без которых не обойтись на B2: bored и boring, so и such, too и enough, very cold и absolutely freezing.',
sections:[
{h:'-ed или -ing', lvl:'B1', html:`
<table><tr><th>-ed: что я чувствую</th><th>-ing: какой предмет / человек</th></tr>
<tr><td>I’m bored.</td><td>The film is boring.</td></tr>
<tr><td>She was interested.</td><td>The book is interesting.</td></tr>
<tr><td>We were tired.</td><td>The trip was tiring.</td></tr>
<tr><td>I’m confused.</td><td>The rules are confusing.</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ I am boring.</span> значит «я скучный человек». «Мне скучно» → <span style="color:var(--ok)">✓ I’m bored.</span></p></div></div>
`},
{h:'so или such', lvl:'B1', html:`
<table><tr><th>Форма</th><th>Пример</th></tr>
<tr><td>so + прил. / наречие</td><td>It’s so hot. · She speaks so fast.</td></tr>
<tr><td>such a + прил. + ед. ч.</td><td>It’s such a hot day.</td></tr>
<tr><td>such + прил. + мн. ч. / неисч.</td><td>such nice people · such good weather</td></tr>
<tr><td>so much / many + сущ.</td><td>so many problems · so much time</td></tr>
<tr><td>so / such … that</td><td>It was so cold that we stayed in.</td></tr></table>
`},
{h:'too или enough', lvl:'B1', html:`
<div class="ex">
<div><mark>too</mark> + прил. (слишком, плохо): <i>It’s too expensive.</i></div>
<div>not + прил. + <mark>enough</mark> (недостаточно): <i>It isn’t cheap enough.</i></div>
<div><mark>too much / too many</mark> + сущ.: <i>too much sugar, too many people</i></div>
<div>+ to do / for sb: <i>It’s too cold to swim. · The box is too heavy for me.</i></div>
</div>
<p><span style="color:var(--bad)">✗ It’s too beautiful!</span> (как комплимент) → <span style="color:var(--ok)">✓ It’s so / really beautiful!</span>, потому что too всегда означает «больше, чем нужно».</p>
`},
{h:'Обычные и «крайние» прилагательные', lvl:'B2', html:`
<table><tr><th>Обычное (very)</th><th>Крайнее (absolutely)</th></tr>
<tr><td>very cold · very hot</td><td>absolutely freezing · boiling</td></tr>
<tr><td>very big · very small</td><td>absolutely huge · tiny</td></tr>
<tr><td>very tired · very hungry</td><td>absolutely exhausted · starving</td></tr>
<tr><td>very angry · very scared</td><td>absolutely furious · terrified</td></tr>
<tr><td>very good · very bad</td><td>absolutely amazing · awful</td></tr></table>
<p><b>really</b> подходит к обоим. ✗ <i>absolutely cold</i>, ✗ <i>very exhausted</i> (в экзаменах).</p>
`},
{h:'Прилагательное или наречие', lvl:'B2', html:`
<ul class="use">
<li>good (прил.) / well (нареч.): <i>She’s a good singer. She sings well.</i></li>
<li>hard (усердно) ≠ hardly (едва): <i>He works hard. He hardly works.</i></li>
<li>late (поздно) ≠ lately (в последнее время)</li>
<li>После look, feel, sound, seem, smell, taste: прилагательное: <i>You look tired. I feel bad.</i> (✗ I feel badly)</li>
</ul>
`}
],

{
id:'pronouns', title:'Pronouns, There is & It', ru:'Местоимения, there is и it', levels:['B1','B2'],
lead:'В английском у каждого предложения должно быть подлежащее. Там, где в русском его нет («Холодно», «В комнате два окна»), нужны it и there. Здесь же: возвратные местоимения и someone / anyone.',
sections:[
{h:'There is или It is', lvl:'B1', html:`
<table><tr><th>There is / are</th><th>It is</th></tr>
<tr><td>Что-то существует, есть где-то</td><td>Описание, погода, время, расстояние</td></tr>
<tr><td>There’s a café near my house.</td><td>It’s cold today. · It’s 5 o’clock.</td></tr>
<tr><td>There are two windows in the room.</td><td>It’s 10 km to the station.</td></tr>
<tr><td>Is there a bank here?</td><td>It’s a nice café. (о том, что уже упомянули)</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p>«В комнате два окна» → <span style="color:var(--bad)">✗ In the room are two windows.</span> → <span style="color:var(--ok)">✓ There are two windows in the room.</span></p><p>«Холодно» → <span style="color:var(--bad)">✗ Is cold.</span> → <span style="color:var(--ok)">✓ It’s cold.</span></p></div></div>
`},
{h:'Возвратные местоимения', lvl:'B1', html:`
<p>myself, yourself, himself, herself, itself, ourselves, yourselves, themselves</p>
<div class="ex">
<div>I cut <mark>myself</mark>. · Enjoy <mark>yourself</mark>! · Help <mark>yourselves</mark>.</div>
<div>I did it (<mark>by</mark>) <mark>myself</mark>. (сам, без помощи)</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>Русские глаголы на «-ся» обычно <b>не</b> возвратные в английском: <i>feel, relax, wash, dress, meet, concentrate, worry</i>.</p><p><span style="color:var(--bad)">✗ I feel myself good.</span> → <span style="color:var(--ok)">✓ I feel good.</span> · <span style="color:var(--bad)">✗ We met ourselves.</span> → <span style="color:var(--ok)">✓ We met.</span></p></div></div>
`},
{h:'themselves или each other', lvl:'B2', html:`
<div class="ex">
<div>They looked at <mark>themselves</mark> in the mirror. (каждый на себя)</div>
<div>They looked at <mark>each other</mark>. (друг на друга)</div>
</div>
`},
{h:'someone, anyone, no one, everyone', lvl:'B1', html:`
<ul class="use">
<li>Глагол в единственном числе: <i>Everyone <b>is</b> here. · Nobody <b>knows</b>.</i></li>
<li>some- в утверждениях, any- в вопросах и отрицаниях: <i>I saw someone. Did you see anyone?</i></li>
<li>any- в утверждении = «кто угодно»: <i>Anyone can do it.</i></li>
<li>Одно отрицание: <span style="color:var(--bad)">✗ I don’t know nothing.</span> → <span style="color:var(--ok)">✓ I don’t know anything. / I know nothing.</span></li>
</ul>
`},
{h:'Притяжательные: трудные случаи', lvl:'B2', html:`
<ul class="use">
<li>a friend <b>of mine</b> = один из моих друзей (✗ a my friend)</li>
<li><b>its</b> (его/её: о предмете) ≠ <b>it’s</b> (= it is)</li>
<li><b>whose</b> (чей) ≠ <b>who’s</b> (= who is)</li>
<li><b>their</b> (их) ≠ <b>there</b> (там) ≠ <b>they’re</b> (= they are)</li>
</ul>
`}
],
quiz:[

{t:'mc', q:'___ very windy today.', o:['There is','It is','Is','This is'], a:1, e:'Погода → It is.', l:'B1'},

{t:'mc', q:'The kids made the cake by ___.', o:['themselves','theirselves','them','each other'], a:0, e:'by themselves = сами, без помощи.', l:'B1'},
{t:'mc', q:'Anna and Mark love ___ very much.', o:['themselves','each other','theirselves','them'], a:1, e:'Взаимное действие → each other.', l:'B2'},

{t:'mc', q:'I didn’t say ___.', o:['nothing','anything','something','none'], a:1, e:'В отрицании → anything (одно отрицание).', l:'B1'},
{t:'mc', q:'She’s a friend of ___.', o:['me','my','mine','I'], a:2, e:'a friend of mine.', l:'B2'},
{t:'mc', q:'The company changed ___ logo.', o:['it’s','its','it is','their’s'], a:1, e:'Притяжательное its (без апострофа).', l:'B2'},

{
id:'ieltsformat', title:'IELTS: Format & Scoring', ru:'Формат экзамена и баллы', levels:['B1','B2','C1','C2'],
lead:'Всё, что нужно знать об экзамене до начала подготовки: Academic или General Training, из чего состоит тест, как считаются баллы и что изменилось в 2026 году.',
sections:[
{h:'Academic или General Training', lvl:'IELTS', html:`
<p>IELTS (International English Language Testing System) проводят British Council, IDP и Cambridge University Press &amp; Assessment. Есть два модуля:</p>
<table><tr><th></th><th>Academic</th><th>General Training</th></tr>
<tr><td>Для чего</td><td>поступление в университет (бакалавриат, магистратура), профессиональная регистрация (врачи, медсёстры)</td><td>работа, иммиграция (Канада, Австралия, Новая Зеландия, Великобритания), обучение ниже уровня университета</td></tr>
<tr><td>Listening</td><td colspan="2">одинаковый</td></tr>
<tr><td>Speaking</td><td colspan="2">одинаковый</td></tr>
<tr><td>Reading</td><td>3 длинных академических текста</td><td>бытовые и рабочие тексты + один длинный текст</td></tr>
<tr><td>Writing Task 1</td><td>описание графика, таблицы, процесса или карты</td><td>письмо (формальное, полуформальное или неформальное)</td></tr>
<tr><td>Writing Task 2</td><td colspan="2">эссе (в GT темы чуть более бытовые)</td></tr></table>
<p>Большинство организаций принимают результат в течение <b>двух лет</b>. Перед регистрацией всегда уточняйте, какой модуль и какой балл нужен именно вам.</p>
`},
{h:'Структура экзамена', lvl:'IELTS', html:`
<table><tr><th>Часть</th><th>Время</th><th>Что внутри</th></tr>
<tr><td><b>Listening</b></td><td>≈ 30 мин</td><td>4 части, 40 вопросов. Запись звучит один раз.</td></tr>
<tr><td><b>Reading</b></td><td>60 мин</td><td>3 текста, 40 вопросов. Дополнительного времени на перенос ответов нет.</td></tr>
<tr><td><b>Writing</b></td><td>60 мин</td><td>Task 1 (≥150 слов, ~20 мин) и Task 2 (≥250 слов, ~40 мин).</td></tr>
<tr><td><b>Speaking</b></td><td>11–14 мин</td><td>Интервью с экзаменатором из 3 частей.</td></tr></table>
<p>Общая продолжительность: около <b>2 часов 45 минут</b>. Listening, Reading и Writing сдаются в один день подряд, без перерывов. Speaking: в тот же день или в течение недели до или после.</p>
`},
{h:'Как сдают IELTS в 2026 году', lvl:'IELTS', html:`
<p>С середины 2026 года IELTS больше не проводится на бумаге: Listening, Reading и Writing сдаются <b>на компьютере</b> в тестовом центре. В некоторых странах есть вариант <i>Writing on Paper</i>: эссе можно писать от руки. Speaking по-прежнему проходит в формате живого разговора с экзаменатором.</p>
<ul class="use">
<li><b>Listening на компьютере:</b> ответы вводятся во время прослушивания, в конце есть 2 минуты на проверку (на бумаге раньше было 10 минут на перенос).</li>
<li><b>Writing на компьютере:</b> есть счётчик слов, можно копировать и вставлять текст. Проверки орфографии нет.</li>
<li><b>Результаты</b> обычно приходят через несколько дней.</li>
<li><b>One Skill Retake:</b> во многих центрах можно пересдать одну часть, не сдавая весь экзамен заново. Условия и сроки зависят от страны и центра.</li>
</ul>
<div class="ru"><span class="tag">!</span><div><p>Тренируйтесь печатать по-английски быстро и без автоисправления: на экзамене опечатки считаются ошибками в орфографии.</p></div></div>
`},
{h:'Шкала баллов', lvl:'IELTS', html:`
<p>Каждая часть оценивается от 0 до 9 с шагом 0.5. Общий балл (Overall Band): среднее арифметическое четырёх частей, округлённое до ближайшей половины.</p>
<table><tr><th>Band</th><th>Описание</th><th>≈ CEFR</th></tr>
<tr><td>9</td><td>Expert user: свободное и точное владение</td><td rowspan="2">C2</td></tr>
<tr><td>8–8.5</td><td>Very good user: редкие неточности</td></tr>
<tr><td>7–7.5</td><td>Good user: уверенное владение, иногда ошибки</td><td>C1</td></tr>
<tr><td>5.5–6.5</td><td>Competent user: эффективно, но с ошибками и непониманием</td><td>B2</td></tr>
<tr><td>4–5</td><td>Limited / modest user: базовое владение</td><td>B1</td></tr></table>
<h4>Как считается общий балл</h4>
<p>Если среднее заканчивается на <b>.25</b>, оно округляется вверх до .5; если на <b>.75</b>: вверх до целого. Остальные значения округляются до ближайшей половины.</p>
<div class="ex">
<div>L 6.5 + R 6.5 + W 5.5 + S 6 = 24.5 ÷ 4 = 6.125 → <mark>Overall 6</mark></div>
<div>L 7 + R 6.5 + W 6 + S 6 = 25.5 ÷ 4 = 6.375 → <mark>Overall 6.5</mark></div>
<div>L 7 + R 7 + W 6 + S 6.5 = 26.5 ÷ 4 = 6.625 → <mark>Overall 6.5</mark></div>
<div>L 7.5 + R 7 + W 6.5 + S 6.5 = 27.5 ÷ 4 = 6.875 → <mark>Overall 7</mark></div>
</div>
<h4>Как оцениваются части</h4>
<ul class="use">
<li><b>Listening и Reading:</b> 1 балл за каждый правильный ответ из 40, затем «сырой» балл переводится в band по таблице. Штрафов за неправильные ответы нет.</li>
<li><b>Writing и Speaking:</b> экзаменатор оценивает по четырём критериям, каждый: 25% оценки. В Writing Task 2 весит вдвое больше, чем Task 1.</li>
</ul>
`},
{h:'Какой балл нужен', lvl:'IELTS', html:`
<table><tr><th>Цель</th><th>Типичное требование</th></tr>
<tr><td>Бакалавриат</td><td>6.0–6.5 overall, не ниже 5.5–6.0 в каждой части</td></tr>
<tr><td>Магистратура</td><td>6.5–7.0 overall</td></tr>
<tr><td>Топовые университеты</td><td>7.0–7.5, часто не ниже 7.0 в Writing</td></tr>
<tr><td>Медицина, право, преподавание</td><td>часто 7.0–8.0 в каждой части</td></tr>
<tr><td>Иммиграция</td><td>зависит от программы; часто считается по каждой части отдельно</td></tr></table>
<p>Это ориентиры: требования меняются, поэтому проверяйте сайт конкретного университета или иммиграционной программы.</p>
<p><b>Сколько времени нужно на подготовку?</b> В среднем, чтобы поднять результат на 0.5–1 band, нужно несколько месяцев регулярных занятий. Чем выше уровень, тем медленнее рост: путь с 5.5 до 6.5 обычно проходит быстрее, чем с 7 до 8.</p>
`},
{h:'Советы: Band 5–5.5 → 6', lvl:'Band 6', html:`
<ul class="use">
<li>Закройте пробелы в базовой грамматике: времена, артикли, исчисляемые существительные, порядок слов (темы этого сайта уровня B1–B2).</li>
<li>Выучите формат каждой части и типы заданий: незнание формата стоит баллов даже сильным студентам.</li>
<li>Всегда выполняйте задание полностью: пишите не меньше 150 и 250 слов, отвечайте на все вопросы, не оставляйте пропусков.</li>
<li>Учите лексику по темам IELTS: образование, работа, технологии, окружающая среда, здоровье, город.</li>
<li>Каждый день по 20–30 минут слушайте и читайте по-английски с текстом.</li>
</ul>
`},
{h:'Советы: Band 6–6.5 → 7', lvl:'Band 7', html:`
<ul class="use">
<li>Работайте над точностью: на 7 нужно, чтобы большинство предложений были без ошибок.</li>
<li>Расширяйте грамматику: условные предложения, пассив, относительные придаточные, причастные обороты.</li>
<li>В Writing: чёткая позиция в эссе и обзор (overview) в Task 1. Это главное отличие 6 от 7.</li>
<li>В Reading и Listening тренируйте распознавание перефразирования: в вопросах почти никогда нет слов из текста.</li>
<li>В Speaking развивайте ответы: мнение → причина → пример. Не заучивайте ответы: экзаменаторы это слышат.</li>
</ul>
`},
{h:'Советы: Band 7+ → 8 и выше', lvl:'Band 8', html:`
<ul class="use">
<li>Точность и естественность: коллокации, менее частотная лексика, идиомы к месту, а не для галочки.</li>
<li>Безошибочные сложные предложения, гибкость: разные способы сказать одно и то же.</li>
<li>Reading: точность в True/False/Not Given и Yes/No/Not Given, работа с аргументацией автора в третьем тексте.</li>
<li>Listening: Part 4 без ошибок, орфография, разные акценты.</li>
<li>Регулярно пишите полные эссе на время и сравнивайте с образцами Band 8–9.</li>
</ul>
`}
],

id:'ieltslistening', title:'IELTS Listening', ru:'Аудирование', levels:['B1','B2','C1'],
lead:'Четыре части, 40 вопросов, запись звучит один раз. Разбираем каждую часть, все типы заданий, правила записи ответов и типичные ловушки.',
texts:{
L1:{type:'listen', skill:'L', title:'Part 1 · Joining a sports centre', intro:'Questions 1–8. Complete the form. Write <b>ONE WORD AND/OR A NUMBER</b> for each answer.', lines:[
{v:'W', t:'Good morning, Riverside Sports Centre. How can I help you?'},
{v:'M', t:'Hi. I’d like some information about membership, please.'},
{v:'W', t:'Of course. Are you interested in full membership or off-peak?'},
{v:'M', t:'What’s the difference?'},
{v:'W', t:'Full membership lets you use the centre at any time, and it costs forty-two pounds a month. Off-peak is only before four p.m. on weekdays, and that’s twenty-eight pounds.'},
{v:'M', t:'I work during the day, so I’d better go for full membership.'},
{v:'W', t:'Fine. Can I take your name?'},
{v:'M', t:'Yes, it’s Daniel Hartley. That’s H, A, R, T, L, E, Y.'},
{v:'W', t:'Thank you. And your address?'},
{v:'M', t:'Fourteen Mill Lane. Oh no, sorry, we’ve just moved. It’s forty Mill Lane now.'},
{v:'W', t:'Forty Mill Lane. And how did you hear about us?'},
{v:'M', t:'I saw an advert in the local newspaper, but actually it was a friend who persuaded me to join.'},
{v:'W', t:'Great. Are there any activities you’re particularly interested in?'},
{v:'M', t:'Mainly swimming. I used to play squash, but I hurt my knee, so I’ve given that up.'},
{v:'W', t:'The pool opens at six thirty in the morning. Before you start, you need to book a free induction session. The next one is on Thursday the ninth.'},
{v:'M', t:'Thursday is difficult for me. Is there anything at the weekend?'},
{v:'W', t:'Yes, there’s one on Saturday the eleventh at ten o’clock.'},
{v:'M', t:'Perfect, I’ll take that one.'},
{v:'W', t:'Lastly, please bring a photo with you for your membership card.'}
]},
L2:{type:'listen', skill:'L', title:'Part 2 · Volunteering at a city farm', intro:'Questions 9–13. Choose the correct letter, <b>A, B or C</b>.', lines:[
{v:'N', n:'Speaker', t:'Good afternoon, everyone, and welcome to Greenfield City Farm. I’m Laura, the volunteer coordinator, and I’m going to explain how things work here.'},
{v:'N', n:'Speaker', t:'The farm was started in nineteen eighty-seven, not by farmers, as many people assume, but by a group of local parents who wanted their children to see where food comes from.'},
{v:'N', n:'Speaker', t:'Today we have around thirty volunteers and two full-time staff. Most volunteers come once a week, but we do ask for a minimum commitment of three months, because it takes time to learn the routines.'},
{v:'N', n:'Speaker', t:'Now, the most popular job is feeding the animals, but I’m afraid that’s always done by staff during your first month. New volunteers usually start in the vegetable garden, which is right next to the café.'},
{v:'N', n:'Speaker', t:'If you prefer working indoors, the education centre needs help on Wednesday mornings, when school groups visit.'},
{v:'N', n:'Speaker', t:'Finally, a word about clothing. We provide gloves, but you must bring your own boots. And please don’t wear anything you’d be upset to get dirty!'}
]}
},
sections:[
{h:'Формат: четыре части', lvl:'IELTS', html:`
<table><tr><th>Часть</th><th>Ситуация</th><th>Пример</th></tr>
<tr><td><b>Part 1</b></td><td>Бытовой диалог двух людей</td><td>Бронирование, запись в клуб, звонок в службу поддержки</td></tr>
<tr><td><b>Part 2</b></td><td>Монолог на бытовую тему</td><td>Экскурсовод, информация о мероприятии, объявление по радио</td></tr>
<tr><td><b>Part 3</b></td><td>Разговор до 4 человек в учебном контексте</td><td>Студенты обсуждают проект с преподавателем</td></tr>
<tr><td><b>Part 4</b></td><td>Академическая лекция (монолог, без пауз в середине)</td><td>Лекция о науке, истории, экологии</td></tr></table>
<ul class="use">
<li>В каждой части 10 вопросов, сложность растёт от Part 1 к Part 4.</li>
<li>Запись звучит <b>один раз</b>. Перед каждой частью есть время прочитать вопросы.</li>
<li>Акценты: британский, американский, австралийский, новозеландский, канадский.</li>
<li>На компьютере ответы вводятся сразу, в конце даётся 2 минуты на проверку.</li>
</ul>
`},
{h:'Типы заданий', lvl:'IELTS', html:`
<table><tr><th>Тип</th><th>Что нужно сделать</th><th>Где встречается</th></tr>
<tr><td>Form / note / table completion</td><td>Заполнить пропуски в форме или заметках</td><td>Чаще всего Part 1 и 4</td></tr>
<tr><td>Sentence / summary completion</td><td>Дополнить предложения словами из записи</td><td>Все части</td></tr>
<tr><td>Multiple choice</td><td>Выбрать один ответ из трёх или два из пяти</td><td>Part 2 и 3</td></tr>
<tr><td>Matching</td><td>Соотнести пункты списка с вариантами (например, мнения с людьми)</td><td>Part 2 и 3</td></tr>
<tr><td>Plan / map / diagram labelling</td><td>Подписать места на плане или карте</td><td>Part 2</td></tr>
<tr><td>Flow-chart completion</td><td>Заполнить этапы процесса</td><td>Part 3 и 4</td></tr>
<tr><td>Short-answer questions</td><td>Кратко ответить на вопрос</td><td>Все части</td></tr></table>
`},
{h:'Правила записи ответов', lvl:'IELTS', html:`
<ul class="use">
<li><b>Лимит слов</b> строгий. «NO MORE THAN TWO WORDS AND/OR A NUMBER» значит: максимум два слова и/или число. Ответ из трёх слов засчитывается как неправильный.</li>
<li><b>Орфография</b> должна быть правильной. Принимаются британский и американский варианты (colour / color), но не смесь в одном слове.</li>
<li><b>Числа</b> можно писать цифрами: 42 вместо forty-two. Цифры безопаснее.</li>
<li>Слово с дефисом (well-known) считается одним словом. Артикль a / the: отдельное слово.</li>
<li><b>Множественное число:</b> если в записи «tickets», ответ «ticket»: ошибка. Проверьте, подходит ли ответ грамматически к пропуску.</li>
<li>Даты: подходят «11 March», «March 11», «11th March».</li>
</ul>
`},
{h:'Ловушки (distractors)', lvl:'IELTS', html:`
<table><tr><th>Ловушка</th><th>Пример</th></tr>
<tr><td>Говорящий исправляет себя</td><td>“It’s fourteen Mill Lane. Oh no, sorry, we’ve moved: it’s forty.” → ответ 40</td></tr>
<tr><td>Отменённый вариант</td><td>“We were going to meet on Tuesday, but that’s not possible, so…”</td></tr>
<tr><td>Перефразирование</td><td>В вопросе “cost”, в записи “you’ll pay”, “it comes to”, “the fee is”</td></tr>
<tr><td>Похожие числа</td><td>thirteen / thirty, fifteen / fifty. Слушайте ударение: thirTEEN, THIRty</td></tr>
<tr><td>Буквы по слогам</td><td>Путаница A / E / I, G / J. “Double S” = SS</td></tr>
<tr><td>Все варианты звучат</td><td>В multiple choice в записи обычно упоминаются все три варианта, но правильный только один</td></tr></table>
`},
{h:'Стратегия', lvl:'IELTS', html:`
<h4>До записи</h4>
<ul class="use"><li>Прочитайте вопросы и подчеркните ключевые слова.</li><li>Предскажите тип ответа: число, имя, существительное, прилагательное? Единственное или множественное число?</li><li>Подумайте о синонимах ключевых слов.</li></ul>
<h4>Во время записи</h4>
<ul class="use"><li>Ответы идут по порядку. Пропустили вопрос: сразу переходите к следующему, не «застревайте».</li><li>Записывайте ответ сразу, даже если не уверены.</li></ul>
<h4>После</h4>
<ul class="use"><li>Проверьте орфографию, лимит слов, -s во множественном числе.</li><li>Не оставляйте пропусков: штрафа за неверный ответ нет.</li></ul>
`},
{h:'Перевод баллов', lvl:'IELTS', html:`
<table><tr><th>Правильных из 40</th><th>Band</th><th>Правильных из 40</th><th>Band</th></tr>
<tr><td>39–40</td><td>9</td><td>23–25</td><td>6</td></tr>
<tr><td>37–38</td><td>8.5</td><td>18–22</td><td>5.5</td></tr>
<tr><td>35–36</td><td>8</td><td>16–17</td><td>5</td></tr>
<tr><td>32–34</td><td>7.5</td><td>13–15</td><td>4.5</td></tr>
<tr><td>30–31</td><td>7</td><td>10–12</td><td>4</td></tr>
<tr><td>26–29</td><td>6.5</td><td></td><td></td></tr></table>
<p>Таблица ориентировочная: точные границы могут немного отличаться от теста к тесту.</p>
`},
{h:'Советы по уровням', lvl:'Band 6–8', html:`
<table><tr><th>Цель</th><th>На чём сосредоточиться</th></tr>
<tr><td><b>Band 6</b></td><td>Набирайте максимум в Part 1–2 (цель: 15+ из 20). Тренируйте числа, даты, буквы, орфографию частых слов. Слушайте подкасты для изучающих английский с текстом.</td></tr>
<tr><td><b>Band 7</b></td><td>Part 3–4: следите за ходом рассуждения, учитесь узнавать перефразирование. Конспектируйте короткие лекции (TED, университетские подкасты).</td></tr>
<tr><td><b>Band 8+</b></td><td>Без ошибок в Part 4 и в орфографии. Слушайте разные акценты. Делайте полные тесты строго в формате «один раз, без пауз».</td></tr></table>
`}
],

lead:'60 минут на три текста и 40 вопросов. Разбираем отличия Academic и General Training, все 11 типов заданий, True/False/Not Given и стратегии работы со временем.',
texts:{
R1:{type:'read', skill:'R', title:'Two Wheels in the City', intro:'Прочитайте текст и ответьте на вопросы 1–10. Рекомендуемое время: 15 минут.', html:`
<p><b class="pl">A</b>Over the past two decades, many cities in Europe and North America have seen a remarkable increase in cycling. In several large European capitals, the number of cyclists on main routes has more than doubled in just a few years, largely because city authorities converted hundreds of kilometres of road space into protected bike lanes. Similar, if less dramatic, growth has been recorded in smaller cities on both continents.</p>
<p><b class="pl">B</b>Transport planners point to several reasons for this shift. The most obvious is infrastructure: people are far more willing to cycle when they are physically separated from cars. Surveys repeatedly show that fear of traffic, rather than distance or weather, is the main reason people give for not cycling. Another factor is the spread of bike-sharing schemes, which allow residents and visitors to rent a bicycle for short trips without the cost and inconvenience of owning one.</p>
<p><b class="pl">C</b>Electric bicycles have also changed the picture. Because a small motor assists the rider, e-bikes make long commutes and hilly routes manageable for people who would never have considered cycling before, including many older adults. Critics argue, however, that e-bikes are expensive to buy and that their batteries raise environmental concerns of their own, since they contain metals that are difficult to recycle.</p>
<p><b class="pl">D</b>Not everyone has welcomed the change. When bike lanes replaced car parking on busy shopping streets, some shop owners protested, fearing that customers would stay away. Yet studies in a number of cities have found that cyclists tend to visit local shops more often than drivers and, over a month, spend at least as much money there, even if each individual visit is smaller. Whether this pattern holds in every city remains a matter of debate.</p>
<p><b class="pl">E</b>For urban planners, the lesson seems clear: if cities want more people to cycle, painting a line on the road is not enough. What matters is a connected network of safe routes that link homes, schools and workplaces, so that cycling becomes the easiest choice rather than a brave one.</p>`}
},
sections:[
{h:'Формат: Academic и General Training', lvl:'IELTS', html:`
<table><tr><th></th><th>Academic</th><th>General Training</th></tr>
<tr><td>Время / вопросы</td><td colspan="2">60 минут, 40 вопросов, 3 раздела</td></tr>
<tr><td>Тексты</td><td>3 длинных текста из книг, журналов, газет, научно-популярных изданий. Рассчитаны на неспециалиста. Один текст содержит развёрнутую аргументацию. Могут быть схемы и графики.</td><td>Раздел 1: короткие бытовые тексты (объявления, реклама, расписания). Раздел 2: тексты о работе (инструкции, договоры, обучение). Раздел 3: один длинный текст общего характера.</td></tr>
<tr><td>Общий объём</td><td>≈ 2 150–2 750 слов</td><td>примерно сопоставим, но тексты проще</td></tr>
<tr><td>Оценка</td><td colspan="2">Для одного и того же band в GT нужно больше правильных ответов: например, около 30 из 40 для 6 и около 34–35 для 7.</td></tr></table>
`},
{h:'Типы заданий', lvl:'IELTS', html:`
<table><tr><th>Тип</th><th>Что проверяет</th><th>Ответы по порядку?</th></tr>
<tr><td>Multiple choice</td><td>Детали или главную мысль</td><td>да</td></tr>
<tr><td>True / False / Not Given</td><td>Совпадает ли <b>факт</b> с текстом</td><td>да</td></tr>
<tr><td>Yes / No / Not Given</td><td>Совпадает ли утверждение с <b>мнением автора</b></td><td>да</td></tr>
<tr><td>Matching headings</td><td>Главную мысль абзаца</td><td></td></tr>
<tr><td>Matching information</td><td>В каком абзаце есть информация</td><td>нет</td></tr>
<tr><td>Matching features</td><td>Соотнести идеи с людьми, датами, местами</td><td>нет</td></tr>
<tr><td>Matching sentence endings</td><td>Логику и грамматику предложения</td><td>да</td></tr>
<tr><td>Sentence completion</td><td>Детали, точные слова из текста</td><td>да</td></tr>
<tr><td>Summary / note / table / flow-chart completion</td><td>Понимание фрагмента, иногда со списком слов</td><td>обычно да</td></tr>
<tr><td>Diagram label completion</td><td>Описание устройства или процесса</td><td>обычно да</td></tr>
<tr><td>Short-answer questions</td><td>Факты: кто, что, где, сколько</td><td>да</td></tr></table>
<p>В заданиях на заполнение пропусков слова берутся <b>из текста без изменений</b> и с учётом лимита слов.</p>
`},
{h:'True / False / Not Given', lvl:'IELTS', html:`
<table><tr><th>Ответ</th><th>Когда</th></tr>
<tr><td><b>True</b></td><td>Текст говорит то же самое (обычно другими словами).</td></tr>
<tr><td><b>False</b></td><td>Текст говорит противоположное.</td></tr>
<tr><td><b>Not Given</b></td><td>В тексте нет информации, чтобы подтвердить или опровергнуть утверждение.</td></tr></table>
<div class="ex">
<div><em>Текст:</em> The museum, which opened in 1998, attracts over a million visitors a year.</div>
<div>The museum opened in the late 1990s. → <mark>True</mark></div>
<div>The museum attracts fewer than a million visitors. → <mark>False</mark></div>
<div>The museum is the most popular in the country. → <mark>Not Given</mark></div>
</div>
<ul class="use">
<li>Не используйте собственные знания: только текст.</li>
<li>Осторожно со словами <i>all, always, only, never, most, the first</i>: одно такое слово может превратить True в False или Not Given.</li>
<li>Yes / No / Not Given работает так же, но речь о мнении автора, а не о фактах.</li>
</ul>
`},
{h:'Matching headings', lvl:'IELTS', html:`
<ul class="use">
<li>Сначала прочитайте все заголовки и поймите разницу между похожими.</li>
<li>Заголовок отражает <b>главную мысль всего абзаца</b>, а не одну деталь.</li>
<li>Главная мысль часто в первом или последнем предложении абзаца.</li>
<li>Ловушка: заголовок содержит слово из абзаца, но говорит о другом.</li>
<li>Заголовков больше, чем абзацев: лишние останутся.</li>
</ul>
`},
{h:'Стратегии и время', lvl:'IELTS', html:`
<table><tr><th>Приём</th><th>Как</th></tr>
<tr><td>Skimming</td><td>1–2 минуты на заголовок и первые предложения абзацев, чтобы понять общую структуру.</td></tr>
<tr><td>Scanning</td><td>Быстрый поиск имён, дат, чисел, терминов, слов с заглавной буквы.</td></tr>
<tr><td>Ключевые слова и синонимы</td><td>Ищите в тексте не слова из вопроса, а их перефразирование: <i>reduce → cut down on, popular → widely used, old people → the elderly</i>.</td></tr>
<tr><td>Время</td><td>Около 20 минут на текст; третий текст самый сложный: оставьте ему чуть больше.</td></tr>
<tr><td>Пропуски</td><td>Не застревайте на одном вопросе. В конце впишите ответ наугад: штрафа нет.</td></tr></table>
`},
{h:'Перевод баллов (Academic)', lvl:'IELTS', html:`
<table><tr><th>Правильных из 40</th><th>Band</th><th>Правильных из 40</th><th>Band</th></tr>
<tr><td>39–40</td><td>9</td><td>23–26</td><td>6</td></tr>
<tr><td>37–38</td><td>8.5</td><td>19–22</td><td>5.5</td></tr>
<tr><td>35–36</td><td>8</td><td>15–18</td><td>5</td></tr>
<tr><td>33–34</td><td>7.5</td><td>13–14</td><td>4.5</td></tr>
<tr><td>30–32</td><td>7</td><td>10–12</td><td>4</td></tr>
<tr><td>27–29</td><td>6.5</td><td></td><td></td></tr></table>
<p>Таблица ориентировочная.</p>
`},
{h:'Советы по уровням', lvl:'Band 6–8', html:`
<table><tr><th>Цель</th><th>На чём сосредоточиться</th></tr>
<tr><td><b>Band 6</b></td><td>Словарный запас по темам IELTS, скорость чтения. Выучите, как работает каждый тип задания. Каждый день читайте одну статью средней сложности.</td></tr>
<tr><td><b>Band 7</b></td><td>Точность в True/False/Not Given, распознавание перефразирования, контроль времени: решайте тексты по 20 минут с таймером.</td></tr>
<tr><td><b>Band 8+</b></td><td>Третий текст и вопросы о позиции автора. Читайте качественную прессу и научно-популярные журналы (The Guardian, The Economist, New Scientist, National Geographic). Анализируйте каждую ошибку: почему выбран неверный ответ?</td></tr></table>
`}
],

{h:'Структура', lvl:'IELTS', html:`
<table><tr><th>Абзац</th><th>Содержание</th><th>≈ слов</th></tr>
<tr><td>Introduction</td><td>Перефразируйте тему (1 предложение) + ваша позиция или план (thesis)</td><td>40–50</td></tr>
<tr><td>Body 1</td><td>Первая главная идея</td><td>90–110</td></tr>
<tr><td>Body 2</td><td>Вторая главная идея</td><td>90–110</td></tr>
<tr><td>Conclusion</td><td>Повторите позицию другими словами, без новых идей</td><td>30–40</td></tr></table>
<h4>Абзац по схеме PEEL</h4>
<ul class="use"><li><b>P</b>oint: главная мысль абзаца в первом предложении.</li><li><b>E</b>xplanation: почему это так, как это работает.</li><li><b>E</b>xample: конкретный пример (реальный или правдоподобный).</li><li><b>L</b>ink: вывод, связь с вопросом.</li></ul>
`},
{h:'Развитие идей', lvl:'B2', html:`
<p>Главная разница между 6 и 7: не словарь, а то, насколько развиты идеи.</p>
<div class="ex">
<div class="no">✗ Band 5–6: Online learning is good because it is flexible. Many people like it. It is also cheap.</div>
<div class="yes">✓ Band 7–8: The main advantage of online learning is its flexibility. Because lectures are recorded, students can study at a time that suits them, which is particularly valuable for those who work full-time or have young children. A working parent, for instance, can complete a degree in the evenings without giving up their income, something that would be impossible with a traditional timetable.</div>
</div>
<p>Лучше две идеи, развитые полностью, чем пять перечисленных.</p>
<p><b>Избегайте заученных фраз</b> вроде <i>“In this modern era of technology…”</i> или <i>“Every coin has two sides”</i>: экзаменаторы их узнают, и они не добавляют смысла.</p>
`},
{h:'Полезный язык', lvl:'B2', html:`
<table><tr><th>Функция</th><th>Фразы</th></tr>
<tr><td>Позиция</td><td>I firmly believe that… · I would argue that… · While I accept that…, I believe…</td></tr>
<tr><td>Противопоставление</td><td>However, … · Nevertheless, … · On the other hand, … · Although…</td></tr>
<tr><td>Причина / следствие</td><td>As a result, … · This leads to… · Consequently, … · …, which means that…</td></tr>
<tr><td>Пример</td><td>For instance, … · A case in point is… · This is evident in…</td></tr>
<tr><td>Осторожность</td><td>It could be argued that… · This tends to… · In many cases, …</td></tr>
<tr><td>Заключение</td><td>In conclusion, … · Overall, I believe that… · To sum up, …</td></tr></table>
<p>Подробнее: в темах «Linking Words» и «Hedging».</p>
`},
{h:'Советы по уровням', lvl:'Band 6–8', html:`
<table><tr><th>Цель</th><th>На чём сосредоточиться</th></tr>
<tr><td><b>Band 6</b></td><td>Ответ на все части вопроса, 250+ слов, 4–5 абзацев. Позиция во введении и в заключении. Основная грамматика без грубых ошибок.</td></tr>
<tr><td><b>Band 7</b></td><td>Развивайте каждую идею по схеме PEEL. Одна центральная мысль на абзац. Сложные предложения (условные, относительные, пассив), коллокации по теме.</td></tr>
<tr><td><b>Band 8+</b></td><td>Нюансированная позиция, точные примеры, естественная связность без шаблонных связок, почти полное отсутствие ошибок. Пишите эссе на время раз в неделю и анализируйте их.</td></tr></table>
`}
],

{t:'write', part:'Writing practice', title:'Task 2 · Opinion essay', l:'B2', min:250, time:40, band:'Band 8',
prompt:`<div class="box"><p><b>You should spend about 40 minutes on this task.</b></p><p>Some people believe that unpaid community service should be a compulsory part of high school programmes (for example, working for a charity or improving the neighbourhood).</p><p><b>To what extent do you agree or disagree?</b></p><p>Give reasons for your answer and include any relevant examples from your own knowledge or experience.</p><p><i>Write at least 250 words.</i></p></div>`,
check:['Во введении ясно, согласны вы или нет','Позиция одинаковая во введении, в основной части и в заключении','2 основных абзаца, у каждого одна главная мысль','Каждая мысль объяснена и подкреплена примером','Разнообразные связки, нет шаблонных фраз','В заключении нет новых идей','250+ слов'],
model:`<p>In many countries, teenagers spend almost all of their time on academic subjects, and some people argue that schools should also require them to do unpaid work in their local community. I largely agree with this view, provided that the activities are well organised and genuinely useful.</p>
<p>The strongest argument in favour of compulsory community service is that it develops skills which classroom learning rarely provides. When students help at a food bank or organise a clean-up of a local park, they have to cooperate with people of different ages, solve practical problems and take responsibility for the results. These are precisely the abilities that employers value, yet they are difficult to teach through textbooks. Moreover, such experiences can make young people more aware of social problems in their own neighbourhood, encouraging them to become active citizens in adulthood.</p>
<p>Critics argue that making service compulsory undermines its value, because volunteering should be a free choice, and that students already face heavy workloads. These concerns are reasonable, but they can be addressed. If schools allow students to choose from a range of projects and limit the commitment to, say, two hours a week, the programme is unlikely to harm academic performance. In fact, a short break from studying to do something meaningful may even improve motivation. What matters is that the work is real and well supervised, rather than a box-ticking exercise.</p>
<p>In conclusion, I believe that a compulsory but flexible programme of community service would benefit both students and society, as long as schools design it carefully and give young people a genuine choice of activities.</p>
<p><i>(≈ 290 words)</i></p>`},
{t:'write', title:'Task 2 · Two-part question', l:'B2', min:250, time:40, band:'Band 8',
prompt:`<div class="box"><p><b>You should spend about 40 minutes on this task.</b></p><p>In many countries, people are spending more and more time looking at screens, such as phones, computers and televisions.</p><p><b>Why is this happening? Is this a positive or negative development?</b></p><p><i>Write at least 250 words.</i></p></div>`,
check:['Есть ответ на оба вопроса: «почему» и «хорошо или плохо»','Каждый вопрос раскрыт в отдельном абзаце','Позиция по второму вопросу ясна','Причины объяснены, а не просто перечислены','250+ слов, 4 абзаца'],
model:`<p>Over the last decade, screens have become a constant presence in everyday life, from the moment people wake up until they go to sleep. This essay will explain why screen time has increased so sharply and argue that, although this trend brings real benefits, its overall effect is more negative than positive.</p>
<p>The main reason for this development is that more and more essential activities now take place online. Work, education, shopping and even contact with doctors increasingly happen through a computer or phone, so avoiding screens has become almost impossible. In addition, entertainment apps are deliberately designed to hold users’ attention: endless video feeds and notifications encourage people to keep scrolling far longer than they intended.</p>
<p>Admittedly, screens have made life more convenient and connected. Families separated by distance can see each other every day, and people in remote areas have access to courses that were once available only in large cities. However, these advantages come at a cost. Excessive screen use has been linked to poor sleep, reduced physical activity and difficulty concentrating, particularly among children. Furthermore, time spent online often replaces face-to-face conversation, which may weaken relationships rather than strengthen them.</p>
<p>In conclusion, screen time is rising because so many areas of life have moved online and because digital products are designed to be addictive. While technology clearly offers important benefits, I believe the negative effects on health and social life outweigh them, so individuals and schools should take active steps to limit unnecessary screen use.</p>
<p><i>(≈ 275 words)</i></p>`}
]
},

{
id:'ieltsspeaking', title:'IELTS Speaking', ru:'Говорение', levels:['B1','B2','C1','C2'],
lead:'Интервью с экзаменатором из трёх частей длится 11–14 минут. Разбираем, что происходит в каждой части, как оценивают ответ и как развивать его, чтобы звучать естественно.',
sections:[
{h:'Формат: три части', lvl:'IELTS', html:`
<table><tr><th>Часть</th><th>Время</th><th>Что происходит</th></tr>
<tr><td><b>Part 1</b> · Introduction &amp; interview</td><td>4–5 мин</td><td>Экзаменатор представляется, проверяет документ и задаёт вопросы на 2–3 знакомые темы: дом, учёба или работа, хобби, еда, погода, выходные.</td></tr>
<tr><td><b>Part 2</b> · Long turn</td><td>3–4 мин</td><td>Вы получаете карточку с темой и 3–4 пунктами. 1 минута на подготовку (дают бумагу и карандаш), затем говорите 1–2 минуты без перерыва. Экзаменатор может задать 1–2 коротких вопроса.</td></tr>
<tr><td><b>Part 3</b> · Discussion</td><td>4–5 мин</td><td>Более абстрактные вопросы, связанные с темой Part 2: общество, тенденции, сравнения, будущее.</td></tr></table>
<p>Разговор записывается. Он проходит лицом к лицу с экзаменатором (в некоторых центрах: по видеосвязи с живым экзаменатором).</p>
`},
{h:'Критерии оценки', lvl:'IELTS', html:`
<table><tr><th>Критерий</th><th>Что проверяют</th></tr>
<tr><td><b>Fluency &amp; Coherence</b></td><td>Говорите ли вы без долгих пауз, логично ли связаны мысли, развиваете ли ответ</td></tr>
<tr><td><b>Lexical Resource</b></td><td>Разнообразие и точность словаря, умение перефразировать, идиомы к месту</td></tr>
<tr><td><b>Grammatical Range &amp; Accuracy</b></td><td>Разные структуры (времена, условные, сложные предложения) и количество ошибок</td></tr>
<tr><td><b>Pronunciation</b></td><td>Понятность, ударение в словах, интонация, связная речь. Акцент сам по себе не снижает оценку.</td></tr></table>
<p>Каждый критерий: 25% оценки.</p>
`},
{h:'Part 1: короткие, но развёрнутые ответы', lvl:'B1', html:`
<p>Оптимальный ответ: 2–3 предложения: <b>ответ + причина или деталь + пример</b>.</p>
<div class="ex">
<div><em>Q:</em> Do you like cooking?</div>
<div class="no">✗ Yes, I do.</div>
<div class="no">✗ (заученный монолог на минуту)</div>
<div class="yes">✓ Yes, quite a lot, actually. I find it relaxing after work, and I like trying recipes from different countries. Last weekend, for example, I made a Thai curry for the first time, it turned out surprisingly well.</div>
</div>
<p>Типичные темы: hometown, home, work or study, free time, music, reading, sport, food, weather, technology, travel, friends, shopping.</p>
`},
{h:'Part 2: монолог по карточке', lvl:'B2', html:`
<div class="ex"><div><b>Describe a book you enjoyed reading.</b> You should say: what the book was · when you read it · what it was about · and explain why you enjoyed it.</div></div>
<ul class="use">
<li><b>Минута подготовки:</b> запишите 2–4 ключевых слова на каждый пункт, а не полные предложения.</li>
<li>Пройдите по пунктам по порядку: это готовая структура. Больше всего говорите о последнем пункте (explain why…).</li>
<li>Говорите до тех пор, пока экзаменатор не остановит вас. Две минуты: это примерно 250–300 слов.</li>
<li>Рассказ о прошлом: Past Simple, Past Continuous и Past Perfect, для впечатлений: Present Perfect.</li>
<li>Если тема незнакома, можно немного придумать: экзаменатор оценивает язык, а не правдивость.</li>
</ul>
`},
{h:'Part 3: дискуссия', lvl:'B2', html:`
<p>Вопросы абстрактнее: не «вы», а «люди», «общество», «будущее». Отвечайте по схеме: <b>мнение → причина → пример → (контраст или вывод)</b>.</p>
<table><tr><th>Функция</th><th>Фразы</th></tr>
<tr><td>Выиграть время</td><td>That’s an interesting question. · I’ve never really thought about it, but… · Let me think…</td></tr>
<tr><td>Обобщить</td><td>Generally speaking, … · In most cases, … · On the whole, …</td></tr>
<tr><td>Предположить</td><td>I suppose / I’d imagine that… · It’s likely that… · It might be because…</td></tr>
<tr><td>Сравнить прошлое и настоящее</td><td>Compared to our parents’ generation, … · These days, … whereas in the past …</td></tr>
<tr><td>Не согласиться частично</td><td>That’s true to some extent, but… · It depends on…</td></tr></table>
`},
{h:'Беглость и произношение', lvl:'B2', html:`
<ul class="use">
<li>Небольшие естественные паузы и слова <i>well, I mean, actually, you know</i> лучше, чем долгое «э-э-э».</li>
<li>Если ошиблись, можно исправиться: <i>“…he go: sorry, he went…”</i>: это нормально.</li>
<li>Говорите смысловыми группами (chunks), а не по одному слову.</li>
<li>Следите за ударением: <i>PHOtograph: phoTOgrapher: photoGRAPHic</i>.</li>
<li>Если не поняли вопрос, переспросите: <i>Sorry, could you repeat the question?</i> В Part 3 можно попросить объяснить слово.</li>
</ul>
`},
{h:'Советы по уровням', lvl:'Band 6–8', html:`
<table><tr><th>Цель</th><th>На чём сосредоточиться</th></tr>
<tr><td><b>Band 6</b></td><td>Говорите без долгих пауз, всегда добавляйте причину и пример. В Part 2 говорите все 2 минуты. Следите за базовыми временами.</td></tr>
<tr><td><b>Band 7</b></td><td>Менее частотная лексика и идиомы к месту, разнообразная грамматика (условные, пассив, Present Perfect). В Part 3: развёрнутые аргументы и сравнения.</td></tr>
<tr><td><b>Band 8+</b></td><td>Естественная беглость, точные коллокации, гибкое перефразирование, интонация, которая помогает смыслу. Записывайте себя и анализируйте.</td></tr></table>
`}
],

{t:'speak', part:'Speaking practice', title:'Part 1 · Home & free time', l:'B1', talk:240,
prompt:`<p>Ответьте на каждый вопрос 2–3 предложениями (≈ 20–30 секунд).</p><ul><li>Do you live in a house or a flat?</li><li>What do you like most about the area where you live?</li><li>What do you usually do in your free time?</li><li>Has the way you spend your free time changed since you were a child?</li><li>Do you prefer spending free time alone or with others? Why?</li></ul>`,
model:`<p><b>Do you live in a house or a flat?</b> I live in a flat on the fifth floor of a fairly modern building. It’s not huge, but it’s bright and it has a small balcony where I grow some herbs.</p>
<p><b>What do you like most about the area?</b> Definitely the park nearby. It only takes me five minutes to get there, so I often go for a run in the morning before work.</p>
<p><b>What do you usually do in your free time?</b> I’m quite into board games at the moment, so I meet up with friends once a week to play. Apart from that, I read a lot, mostly novels.</p>
<p><b>Has it changed since childhood?</b> Quite a lot, actually. As a kid I spent almost all my free time outside playing football, whereas now most of my hobbies are indoors, probably because I’m busier and more tired after work.</p>`},
{t:'speak', title:'Part 2 · Cue card', l:'B2', prep:60, talk:120, band:'Band 7.5–8',
prompt:`<div class="box"><p><b>Describe a person who has had an important influence on your life.</b></p><p>You should say:</p><ul><li>who this person is</li><li>how you know them</li><li>what they are like</li></ul><p>and explain why they have had such an influence on you.</p></div>`,
model:`<p>I’d like to talk about my first English teacher, Marina, who taught me at secondary school for about four years.</p>
<p>I met her when I was twelve. To be honest, at that time I wasn’t particularly interested in languages, I was much more into sport, and I remember thinking that English was just another boring subject. But that changed quite quickly once she started teaching us.</p>
<p>She was incredibly energetic and had a great sense of humour. Instead of making us memorise endless lists of words, she brought song lyrics, short films and even recipes into class, so the lessons felt more like a club than a school subject. She was also very patient. If someone made a mistake, she never made them feel stupid; she would just smile and help them find the right word.</p>
<p>The reason she’s had such an influence on me is that she was the first person who made me believe I was good at something academic. She encouraged me to enter a regional language competition, and although I didn’t win, it gave me a huge amount of confidence. Looking back, I don’t think I would have chosen to study languages at university, or be preparing for this exam now, if it hadn’t been for her. We still exchange messages occasionally, and every time I achieve something with my English, she’s one of the first people I want to tell.</p>`},
{t:'speak', title:'Part 3 · Discussion: influence and role models', l:'B2', talk:300, band:'Band 7.5–8',
prompt:`<p>Ответьте на каждый вопрос развёрнуто (≈ 40–60 секунд): мнение → причина → пример.</p><ul><li>What qualities make someone a good role model for young people?</li><li>Do you think celebrities have too much influence on teenagers today?</li><li>How has the role of teachers changed compared to the past?</li><li>Who has more influence on children: parents or friends?</li></ul>`,
model:`<p><b>What qualities make a good role model?</b> I’d say the most important quality is consistency, someone whose actions match what they say. Young people are very quick to notice hypocrisy, so a person who talks about hard work but takes shortcuts loses credibility immediately. Apart from that, I think resilience matters: seeing someone recover from failure teaches teenagers far more than seeing someone who has only ever succeeded.</p>
<p><b>Do celebrities have too much influence?</b> To some extent, yes. Because of social media, teenagers are exposed to celebrities every single day, and many of them compare their own lives to images that are carefully edited. That said, it isn’t all negative, some public figures use their influence to raise awareness of issues like mental health, which can be genuinely helpful.</p>
<p><b>How has the role of teachers changed?</b> In the past, teachers were mainly a source of information, but now that everything can be found online in seconds, their role is shifting towards guiding students, teaching them how to evaluate sources and think critically rather than simply memorise facts.</p>`}
]
}

  return `<svg class="chart" viewBox="0 0 560 290" role="img" aria-label="Bar chart">${g}<line class="axis" x1="50" x2="530" y1="250" y2="250"/>${b}<text x="12" y="20">hours</text></svg><div class="legend"><span><i style="background:var(--accent)"></i>16–24</span><span><i style="background:#6E855F"></i>25–44</span><span><i style="background:#B3C6A2"></i>45+</span></div>`;
})();

M1R:{type:'read', skill:'R', title:'Reading · The Science of Habit', intro:'You should spend about 20 minutes on Questions 12–24.', html:`
<p><b class="pl">A</b>Every day, a surprisingly large share of what we do is not the result of conscious decisions. In one well-known study, volunteers recorded their actions every hour, and researchers found that roughly 40 per cent of their behaviour was repeated in the same location almost every day, usually while the person was thinking about something else. These actions: brushing teeth, checking a phone, taking the same route to work, are habits: behaviours triggered automatically by familiar situations.</p>
<p><b class="pl">B</b>Scientists often describe a habit as a loop with three parts. First comes a cue, such as a time of day, a place or an emotion. This is followed by the routine, which is the behaviour itself. Finally, there is a reward, which tells the brain that the loop is worth remembering. Over time, the connection between cue and routine becomes so strong that the behaviour begins as soon as the cue appears, with little or no conscious thought.</p>
<p><b class="pl">C</b>This automatic quality explains why habits are so hard to change. Willpower, it turns out, is less important than many people assume. In several studies, people who described themselves as having strong self-control did not resist temptation more often than others; instead, they arranged their lives so that they faced fewer temptations in the first place. They kept snacks out of sight, for example, or left their phone in another room while working.</p>
<p><b class="pl">D</b>How long does it take to form a new habit? A popular claim suggests 21 days, but research does not support it. In one study that followed participants trying to adopt a new daily behaviour, such as drinking a glass of water with lunch or going for a short walk, the time needed for the behaviour to feel automatic ranged from 18 days to more than 250, with an average of around two months. Simpler behaviours became automatic more quickly than complex ones. Encouragingly, missing a single day did not significantly affect the process.</p>
<p><b class="pl">E</b>Because habits depend on cues, one of the most effective strategies for changing them is to alter the environment. People who move house or start a new job often find this a good moment to break old patterns, since many familiar cues disappear. Another technique, sometimes called “habit stacking”, links a new behaviour to an existing one: for instance, doing two minutes of stretching immediately after making the morning coffee.</p>
<p><b class="pl">F</b>Not all researchers agree on how much control individuals really have. Some argue that focusing on personal habits ignores the wider social and economic conditions that shape behaviour; it is far easier to eat healthily, they point out, if fresh food is affordable and available nearby. Nevertheless, most agree that understanding how habits work gives people a practical advantage when they try to change their daily lives.</p>`}
},
