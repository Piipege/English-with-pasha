<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English with Pasha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('pasha-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  /* Palette: Sage #D3DFC6 · Silk Essence #FFFBEA · Cocao Root #3A2B20 · Matcha Glow #F1F1C1 · Morning Dew #FFF9CF */
  --bg:#FFFBEA; --surface:#FFFEF8; --line:#EADFC8; --line-soft:#F3EBD8;
  --sage-50:#EEF3E8; --sage-100:#D3DFC6; --sage-300:#AFC1A0; --sage-500:#8A6E58; --sage-700:#5B4535; --sage-900:#3A2B20;
  --ink:#3A2B20; --muted:#7C6A5C; --ok:#5C7A2E; --ok-bg:#F1F1C1; --bad:#A65F52; --bad-bg:#F3E1D9;
  --dew:#FFF9CF;
  --serif:'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif; --sans:'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r:6px;
  --header-bg:rgba(255,251,234,.9); --mark:#DCE6CF; --accent:#3A2B20; --accent-hover:#22180F; --on-accent:#FFFBEA;
  --strong:#3A2B20; --on-strong:#FFFBEA; --btn-light-bg:#D3DFC6; --btn-light-fg:#3A2B20;
  --ok-line:#D3D38E; --bad-line:#D9B7A8; --ok-ink:#4A5F22; --bad-ink:#7D3F34;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1F1813; --surface:#29201A; --line:#3D3128; --line-soft:#322820;
  --sage-50:#262D22; --sage-100:#34402D; --sage-300:#56664B; --sage-500:#A9BE98; --sage-700:#C5D4B4; --sage-900:#FFFBEA;
  --ink:#F4EEDF; --muted:#B5A697; --ok:#D3DB8E; --ok-bg:#30331F; --bad:#E3937F; --bad-bg:#3A2522;
  --dew:#2E2A1C;
  --header-bg:rgba(31,24,19,.88); --mark:#3F4A36; --accent:#C5D4B4; --accent-hover:#D3DFC6; --on-accent:#2A1F17;
  --strong:#FFFBEA; --on-strong:#2A1F17; --btn-light-bg:#FFFBEA; --btn-light-fg:#2A1F17;
  --ok-line:#5B6236; --bad-line:#6E4238; --ok-ink:#E8EDB5; --bad-ink:#F2B6A6;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}

/* header */
header{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-.01em;color:var(--sage-900)}
.brand svg{width:26px;height:26px}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin-left:4px;padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.tabs{display:flex;background:var(--sage-100);border-radius:6px;padding:4px}
.tabs button{padding:7px 20px;border-radius:6px;font-size:14px;font-weight:500;color:var(--sage-700);transition:.2s}
.tabs button.on{background:var(--surface);color:var(--sage-900);box-shadow:0 1px 3px rgba(47,58,44,.12)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px;display:grid;grid-template-columns:250px 1fr;gap:56px}
aside{position:sticky;top:96px;align-self:start}
.side-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px 12px}
.themes{list-style:none;display:flex;flex-direction:column;gap:2px}
.themes button{width:100%;text-align:left;padding:11px 12px;border-radius:4px;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;transition:background .15s}
.themes button:hover{background:var(--sage-50)}
.themes button.on{background:var(--sage-100)}
.themes .n{font-family:var(--serif);color:var(--sage-500);font-size:15px}
.themes .t{font-size:14.5px;font-weight:500;line-height:1.3}
.themes .s{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.themes .p{font-size:11.5px;color:var(--sage-700);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.side-note{margin:28px 12px 0;font-size:13px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:18px}

main{min-width:0;max-width:780px}
aside{min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-500)}
h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 14px;color:var(--sage-900)}
.lead{font-size:17.5px;color:var(--muted);max-width:640px}
.levels{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}

.lvl{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:6px;border:1px solid var(--sage-300);color:var(--sage-700);background:var(--surface);vertical-align:middle}
.lvl.c{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* theory */
.section{padding:40px 0 4px;border-top:1px solid var(--line);margin-top:40px}
.section:first-of-type{margin-top:36px}
.section h2{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:-.01em;color:var(--sage-900);display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.section p{margin:10px 0}
.section h4{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-700);margin:22px 0 8px}
.formula{display:inline-block;background:var(--sage-50);border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-size:15px;margin:4px 0;color:var(--sage-900)}
.formula b{font-weight:600}
ul.use{list-style:none;margin:6px 0}
ul.use li{position:relative;padding-left:20px;margin:6px 0}
ul.use li:before{content:"";position:absolute;left:3px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--sage-300)}
.ex{margin:12px 0;border-left:2px solid var(--sage-300);padding:2px 0 2px 16px}
.ex div{margin:5px 0}
.ex em{font-style:normal;color:var(--muted);font-size:14.5px}
.ex .no{color:var(--bad)}
.ex .yes{color:var(--ok)}
mark{background:linear-gradient(transparent 58%, var(--mark) 58%);color:inherit;padding:0 1px}
.ru{background:var(--dew);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 16px 18px;margin:18px 0;display:grid;grid-template-columns:auto 1fr;gap:14px;font-size:15px}
.ru .tag{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--sage-700);background:var(--sage-100);border-radius:4px;padding:3px 7px;height:fit-content;white-space:nowrap}
.ru p{margin:0 0 6px}.ru p:last-child{margin:0}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sage-700);background:var(--sage-50)}
tr:last-child td{border-bottom:none}
.cta{margin-top:48px;padding:28px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.cta h3{font-family:var(--serif);font-weight:500;font-size:22px}
.cta p{font-size:14.5px;opacity:.82}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:6px;font-size:14.5px;font-weight:500;transition:.15s}
.btn.light{background:var(--btn-light-bg);color:var(--btn-light-fg)}
.btn.light:hover{filter:brightness(1.06)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--sage-700)}
.btn.ghost:hover{border-color:var(--sage-300)}
.btn.solid{background:var(--accent);color:var(--on-accent)}
.btn.solid:hover{background:var(--accent-hover)}

/* practice */
.score{display:flex;align-items:center;gap:20px;margin:28px 0 8px;padding:18px 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap}
.score .num{font-family:var(--serif);font-size:30px;color:var(--sage-900);line-height:1}
.score .num small{font-size:16px;color:var(--muted)}
.score .lbl{font-size:13px;color:var(--muted)}
.track{flex:1;min-width:140px;height:6px;border-radius:6px;background:var(--sage-100);overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .4s}
.track .g{background:var(--sage-500)}
.track .r{background:var(--bad-line)}
.filters{display:flex;gap:6px;margin:18px 0 4px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:6px;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.on{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin:14px 0;transition:border-color .2s}
.q.ok{border-color:var(--ok-line)}.q.bad{border-color:var(--bad-line)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.qnum{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--sage-500);text-transform:uppercase}
.qtype{font-size:12px;color:var(--muted)}
.qtext{font-size:17px;line-height:1.6}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:11px 16px;border:1px solid var(--line);border-radius:4px;background:var(--bg);transition:.15s;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--sage-500);background:var(--sage-50)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.opt.dim{opacity:.55}
.gap{display:inline-block;min-width:150px;width:auto;padding:3px 10px;border:none;border-bottom:1.5px solid var(--sage-300);background:var(--sage-50);border-radius:4px 6px 0 0;outline:none;font-size:16px;text-align:center;transition:.15s}
.gap:focus{border-bottom-color:var(--sage-700);background:var(--sage-100)}
.gap.right{background:var(--ok-bg);border-bottom-color:var(--ok);color:var(--ok-ink)}
.gap.wrong{background:var(--bad-bg);border-bottom-color:var(--bad);color:var(--bad-ink);text-decoration:line-through}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.qactions{margin-top:14px;display:flex;gap:8px}
.fb{margin-top:14px;padding:12px 16px;border-radius:4px;font-size:14.5px;background:var(--sage-50);display:none}
.fb.show{display:block}
.fb strong{font-weight:600}
.fb .ans{color:var(--ok);font-weight:600}
.done{text-align:center;padding:30px;margin-top:20px;border:1px dashed var(--sage-300);border-radius:var(--r);display:none}
.done.show{display:block}
.done h3{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--sage-900);margin-bottom:6px}
.done p{color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}


/* overview + builder + test */
body.noside .wrap{grid-template-columns:1fr}
body.noside aside{display:none}
body.noside main{max-width:1040px;margin:0 auto;width:100%}
.back{font-size:14px;color:var(--sage-700);margin-bottom:18px;padding:4px 0}
.back:hover{color:var(--sage-900)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:34px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 22px 18px;display:flex;flex-direction:column;transition:.2s}
.card:hover{border-color:var(--sage-300);transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(47,58,44,.18)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-n{font-family:var(--serif);color:var(--sage-500);font-size:15px}
.card-title{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--sage-900);line-height:1.2}
.card-ru{font-size:14px;color:var(--muted);margin-top:2px}
.card-lead{font-size:14px;color:var(--muted);margin:14px 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sage-700);border-top:1px solid var(--line-soft);padding-top:14px;gap:8px}
.levels-mini{display:flex;gap:4px}
.levels-mini .lvl{font-size:10px;padding:1px 6px}
.p{font-size:11.5px;color:var(--sage-700);background:var(--sage-50);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.pg{text-align:left;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-family:var(--serif);font-size:18px;color:var(--sage-900);transition:.15s}
.pg:hover{border-color:var(--sage-300)}
.pg span{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:2px}
.pg.r{text-align:right}
.chip.link{border-style:dashed;color:var(--sage-700)}
.blank{letter-spacing:2px;color:var(--sage-500)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin-top:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h3{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--sage-900)}
.row-s{display:flex;gap:8px;align-items:center}
.linkbtn{font-size:13.5px;color:var(--sage-700);text-decoration:underline;text-decoration-color:var(--sage-300);text-underline-offset:3px}
.linkbtn:hover{color:var(--sage-900)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:var(--bg);transition:.15s}
.pk:hover{border-color:var(--sage-300)}
.pk.on{background:var(--sage-50);border-color:var(--sage-300)}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk .box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--sage-300);flex:none;display:grid;place-items:center;transition:.15s;background:var(--surface)}
.pk.on .box{background:var(--accent);border-color:var(--accent)}
.pk.on .box:after{content:"";width:8px;height:4px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.pk input:focus-visible + .box{outline:2px solid var(--sage-500);outline-offset:2px}
.pk-t{font-size:14.5px;font-weight:500;line-height:1.3}
.pk-t span{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.count{font-family:var(--serif);font-size:40px;line-height:1;color:var(--sage-900)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:var(--sage-100);outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}
.startrow{margin-top:26px;display:flex;justify-content:flex-end}
.btn.big{padding:13px 30px;font-size:15.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.testbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.track.thin{height:4px;flex:none;margin-bottom:24px}
main .q .qnum{color:var(--sage-700)}
.opt.picked{border-color:var(--accent);background:var(--sage-100);color:var(--sage-900);box-shadow:inset 0 0 0 1px var(--accent)}
.testnav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.testnav .note{margin:0}
.sumtop{display:flex;align-items:center;gap:32px;margin:26px 0 6px;flex-wrap:wrap}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--sage-500) calc(var(--p)*1%), var(--sage-100) 0);display:grid;place-items:center;flex:none}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:var(--serif);font-weight:500;font-size:34px;color:var(--sage-900);line-height:1}
.ring span{font-size:12.5px;color:var(--muted);margin-top:4px}
.sumtxt{flex:1;min-width:240px;font-size:16px}
.sumtxt p{margin:6px 0}
.tlink{color:var(--sage-700);text-decoration:underline;text-decoration-color:var(--sage-300);text-underline-offset:3px;font-weight:500}
.bar-row{display:grid;grid-template-columns:180px 1fr 50px;align-items:center;gap:14px;margin:9px 0;font-size:14.5px}
.bar-row .track{min-width:0}
.bv{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.review-head{margin-top:36px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok-line);border-radius:4px;padding:16px 20px;margin:10px 0}
.rv.bad{border-left-color:var(--bad-line)}
.rv-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rv-h .lvl{margin-left:auto}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--ok-bg);color:var(--ok);flex:none}
.rv.bad .mark{background:var(--bad-bg);color:var(--bad)}
.rv-q{font-size:16px}
.rv-a{font-size:14.5px;margin-top:6px}
.rv-a .ans{color:var(--ok);font-weight:600}
.rv-a .wr{color:var(--bad);font-weight:600;text-decoration:line-through}
.rv-e{font-size:14px;color:var(--muted);margin-top:4px}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr 40px;font-size:13.5px}
  .tabs button{padding:6px 10px;font-size:12.5px}
  .bar{padding:12px 14px}
  .brand{font-size:16px;white-space:nowrap;gap:7px}
  .brand svg{width:20px;height:20px}
  .bar{gap:10px}
}


/* groups & filters */
aside{max-height:calc(100vh - 110px);overflow-y:auto;scrollbar-width:thin;padding-right:6px}
.themes .sg{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-500);padding:16px 12px 6px}
.themes .sg:first-child{padding-top:0}
.filterbox{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 14px;color:var(--muted);transition:.15s}
.search:focus-within{border-color:var(--sage-500);background:var(--surface)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;border:none;background:none;outline:none;padding:11px 0;font-size:15px}
.frow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.flabel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:70px}
.seg{display:inline-flex;background:var(--sage-100);border-radius:6px;padding:3px}
.seg button{padding:5px 16px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--sage-700);transition:.15s}
.seg button.on{background:var(--surface);color:var(--sage-900);box-shadow:0 1px 3px rgba(47,58,44,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip .cn{font-size:11.5px;opacity:.65;margin-left:2px;font-variant-numeric:tabular-nums}
.chip:hover:not(.on){border-color:var(--sage-300);color:var(--sage-900)}
.fsum{font-size:14px;color:var(--muted);margin:14px 2px 0}
.fsum .linkbtn{margin-left:12px}
.fsum:empty{display:none}
.ghead{display:flex;align-items:baseline;gap:12px;margin:40px 0 -18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.ghead h2{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--sage-900)}
.ghead span{font-size:13px;color:var(--muted)}
.card-g{font-family:var(--sans);font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--sage-300);border-radius:6px;margin-top:22px}
.lvlpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lp{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:12px;text-align:center;transition:.15s}
.lp b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;color:var(--muted)}
.lp span{font-size:12px;color:var(--muted)}
.lp.on{background:var(--accent);border-color:var(--accent)}
.lp.on b,.lp.on span{color:var(--on-accent)}
.pgroup{margin-top:16px}
.pgroup:first-child{margin-top:0}
.pg-head{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sage-700);margin-bottom:8px;padding:2px 0}
.pg-head .cn{font-weight:500;color:var(--muted);letter-spacing:0}
.pg-head .box,.pk .box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--sage-300);flex:none;display:grid;place-items:center;transition:.15s;background:var(--surface)}
.pg-head.on .box,.pk.on .box{background:var(--accent);border-color:var(--accent)}
.pg-head.on .box:after,.pk.on .box:after{content:"";width:8px;height:4px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.pg-head.part .box{border-color:var(--accent)}
.pg-head.part .box:after{content:"";width:8px;height:2px;background:var(--accent);border-radius:4px}
.pk{text-align:left}
.pk.empty{opacity:.45}
.startrow{align-items:center;gap:16px}
.startrow .note{margin:0}
@media (max-width:900px){
  aside{max-height:none;overflow:visible;padding-right:0}
  .themes .sg{display:none}
  .flabel{width:auto}
  .seg button{padding:5px 11px}
  .lvlpick{grid-template-columns:repeat(2,1fr)}
  .frow{flex-direction:column;align-items:flex-start;gap:8px}
  .bar{padding:12px 12px}
  .brand{font-size:15px}
  .brand svg{display:none}
  .tabs button{padding:6px 9px}
  .startrow{flex-direction:column;align-items:stretch}
}



/* IELTS: passages, listening, tasks */
.part-h{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--sage-900);margin:38px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
.ctx{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 26px;margin:16px 0}
.ctx-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.ctx-h h3{font-family:var(--serif);font-weight:500;font-size:21px;color:var(--sage-900);flex:1}
.ctx-tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--sage-100);color:var(--sage-700);padding:3px 9px;border-radius:6px}
.ctx-body{font-size:16px;line-height:1.75}
.ctx-body p{margin:12px 0}
.ctx-body .pl{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;background:var(--sage-100);color:var(--sage-700);font-size:12.5px;margin-right:8px;vertical-align:1px}
.ctx.collapsed .ctx-body{display:none}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
.rate{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:6px}
.rate select{font:inherit;font-size:13px;padding:5px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.script{margin-top:12px;font-size:14.5px}
.script summary{cursor:pointer;color:var(--sage-700);font-size:13.5px}
.script div{margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:4px;max-height:340px;overflow:auto}
.script p{margin:6px 0}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin:14px 0}
.prompt{font-size:16px;line-height:1.65;margin:6px 0 14px}
.prompt .box{border:1px solid var(--line);border-radius:4px;padding:14px 18px;background:var(--bg);margin:10px 0}
.prompt ul{margin:6px 0 6px 20px}
.wbox{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);padding:14px 16px;font:inherit;font-size:15.5px;line-height:1.65;outline:none}
.wbox:focus{border-color:var(--sage-500);background:var(--surface)}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.task.speak .tbar{justify-content:flex-start}
.wc{font-size:13.5px;color:var(--ok)}
.wc.low{color:var(--muted)}
.timer{font-variant-numeric:tabular-nums}
.timer.over{color:var(--bad);border-color:var(--bad-line)}
.tbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.xpanel{display:none;margin-top:12px;padding:16px 18px;border-radius:4px;background:var(--sage-50);font-size:15px}
.xpanel.show{display:block}
.xpanel p{margin:8px 0}
.ck{display:flex;gap:10px;align-items:flex-start;margin:7px 0;cursor:pointer}
.ck input{margin-top:5px;accent-color:var(--accent)}
.bandline{flex-basis:100%;font-size:14px;color:var(--muted)}
.bandline:empty{display:none}
.bandline b{color:var(--sage-900);font-weight:600}
.hintx{font-size:12.5px;opacity:.8}
.chart{width:100%;height:auto;margin:6px 0}
.chart text{fill:var(--muted);font-family:var(--sans);font-size:11px}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line-soft);stroke-width:1}
.chart .s1{stroke:var(--accent);fill:var(--accent)}
.chart .s2{stroke:#6E855F;fill:#6E855F}
.chart .s3{stroke:#B3C6A2;fill:#B3C6A2}
.chart .ln{fill:none;stroke-width:2.5}
.chart .bx{fill:var(--surface);stroke:var(--sage-300);stroke-width:1.2}
.chart .ar{stroke:var(--sage-500);stroke-width:1.6;fill:none;marker-end:url(#arw)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* v8: task types, mini-checks, review, print */
.okey{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--sage-100);color:var(--sage-700);font-size:11.5px;font-weight:600;margin-right:10px;vertical-align:1px}
.opt.right .okey,.opt.wrong .okey{background:transparent}
.kw{display:flex;flex-direction:column;gap:8px;font-size:16.5px;line-height:1.6}
.kwkey{align-self:flex-start;font-weight:700;letter-spacing:.12em;font-size:14px;padding:3px 12px;border:1.5px solid var(--sage-700);border-radius:4px;color:var(--sage-900)}
.kw2{color:var(--ink)}
.kwin{min-width:220px}
.ectext{line-height:2.3}
.tok{padding:2px 5px;border-radius:4px;font-size:16.5px;border-bottom:1.5px dashed var(--sage-300);transition:.12s}
.tok:hover:not(:disabled){background:var(--sage-100)}
.tok.picked{background:var(--sage-100);border-bottom-color:var(--accent)}
.tok.right{background:var(--ok-bg);color:var(--ok-ink);border-bottom-color:var(--ok)}
.tok.wrong{background:var(--bad-bg);color:var(--bad-ink);border-bottom-color:var(--bad)}
.tok:disabled{cursor:default}
.rusrc{font-size:17px;padding:10px 14px;background:var(--sage-50);border-radius:4px;margin-bottom:10px}
textarea.gap.tlin{font:inherit;display:block;width:100%;min-width:0;text-align:left;border:1px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical;font-size:16px;line-height:1.5;background:var(--bg)}
textarea.gap.tlin:focus{border-color:var(--sage-500)}
.alts{margin-top:6px;font-size:13.5px;color:var(--muted)}
.selfok{display:block;margin-top:8px;font-size:13px}
.mini{margin:22px 0 4px;padding:16px 18px;border:1px dashed var(--sage-300);border-radius:6px;background:var(--surface)}
.mini-h{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-500);margin-bottom:6px}
.mini-q{font-size:15.5px;margin-bottom:10px}
.mini-o{display:flex;gap:8px;flex-wrap:wrap}
.mo{padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:14.5px;transition:.15s}
.mo:hover:not(:disabled){border-color:var(--sage-500)}
.mo.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.mo.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.mo:disabled{cursor:default}
.mini-fb{display:none;margin-top:10px;font-size:14px}.mini-fb.show{display:block}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.duo .panel{margin-top:0;display:flex;flex-direction:column;gap:12px}
.duo .panel .btn{align-self:flex-start;margin-top:auto}
.fhead{display:flex;align-items:center;gap:10px}
.fhead h3{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--sage-900)}
.ficon{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;background:var(--sage-100);color:var(--sage-700);font-size:16px}
.duo .note{margin:0}
.mixrow{flex-wrap:wrap}
.divider{display:flex;align-items:center;gap:14px;margin:34px 0 0;color:var(--muted);font-size:13px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.keys{text-align:right;margin-top:8px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:6px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;margin-left:3px;vertical-align:1px}
.dlbtn{display:none !important}
body.can-dl .dlbtn{display:inline-flex !important}
.levels .dlbtn{margin-left:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--strong);color:var(--on-strong);padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:900px){ .duo{grid-template-columns:1fr} .keys{display:none} .kwin{min-width:160px} }
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:20px;padding:20px 18px 70px}
  aside{position:static}
  .side-label,.side-note{display:none}
  .themes{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:none}
  .themes::-webkit-scrollbar{display:none}
  .themes button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px}
  .themes .n,.themes .s{display:none}
  .themes button.on{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
  .themes button.on .p{background:transparent;color:var(--on-strong);border-color:currentColor}
  h1{font-size:34px}
  .bar{padding:12px 18px}
  .brand small{display:none}
  .tabs button{padding:6px 14px}
}

/* theme toggle */
.hright{display:flex;align-items:center;gap:10px}
.themebtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--sage-700);background:var(--sage-100);transition:.2s;flex:none}
.themebtn:hover{color:var(--sage-900)}
.themebtn svg{width:18px;height:18px}
.themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .sun{display:block}
:root[data-theme="dark"] .themebtn .moon{display:none}
:root[data-theme="dark"] .brand svg path:first-child{fill:#8FA67F}
:root[data-theme="dark"] .brand svg path:last-child{stroke:#FFFBEA}
:root[data-theme="dark"] .card:hover{box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
body{transition:background-color .25s,color .25s}
@media (max-width:900px){ .themebtn{width:32px;height:32px} .hright{gap:6px} }

@media (max-width:480px){
  .bar{padding:10px 10px;gap:6px}
  .brand{font-size:14px}
  .tabs{padding:3px}
  .tabs button{padding:6px 8px;font-size:12px}
  .themebtn{width:30px;height:30px}
  .themebtn svg{width:16px;height:16px}
  .hright{gap:5px}
  .qhead{flex-wrap:wrap}
}
@media (max-width:600px){ main table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch} main th, main td{min-width:110px} }

/* about + footer */
.brand{cursor:pointer}
.site-foot{border-top:1px solid var(--line);margin-top:20px}
.foot-in{max-width:1180px;margin:0 auto;padding:22px 28px 30px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.foot-in a{color:var(--sage-700);text-decoration:underline;text-decoration-color:var(--sage-300);text-underline-offset:3px}
.foot-in a:hover{color:var(--sage-900)}
.tutor-card{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center;margin-top:48px;padding:18px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tutor-card img{width:100%;border-radius:4px;display:block}
.tutor-card h3{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--sage-900);margin-bottom:6px}
.tutor-card p{font-size:14.5px;color:var(--muted);margin-bottom:14px}
.tutor-card .row-s{flex-wrap:wrap}
a.btn{text-decoration:none}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.about-grid .panel{margin-top:16px}
.steps{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:st;display:grid;grid-template-columns:32px 1fr;column-gap:12px}
.steps li:before{content:counter(st);grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sage-100);color:var(--sage-900);font-weight:600;font-size:14px}
.steps b{font-weight:600;color:var(--sage-900)}
.steps span{font-size:14px;color:var(--muted)}
.tg-cta{margin-top:24px}
.tg-channel{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.tg-channel h3{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--sage-900)}
.tg-channel .note{margin:4px 0 0}
.tg-ic{width:44px;height:44px;border-radius:4px;background:var(--sage-100);color:var(--sage-900);display:grid;place-items:center}
.tg-ic svg{width:22px;height:22px}
@media (max-width:900px){
  .tutor-card{grid-template-columns:1fr}
  .about-grid{grid-template-columns:1fr}
  .tg-channel{grid-template-columns:auto 1fr}
  .tg-channel .btn{grid-column:1 / -1;justify-self:start}
  .foot-in{padding:18px 18px 26px}
}
@media (max-width:520px){
  .brand .btxt{display:none}
  .brand svg{display:block !important;width:24px;height:24px}
  .tabs button{padding:6px 8px;font-size:12px}
}

/* level pills: keep text centred even when the row is stretched */
.lvl{display:inline-flex;align-items:center;justify-content:center;line-height:1.4;align-self:center}
.levels{align-items:center}
/* framed photo (vector frame) */
.pf{position:relative;aspect-ratio:3/2;background:#FFFDF3;border-radius:4px;box-shadow:0 12px 30px -20px rgba(58,43,32,.5)}
.pf img{position:absolute;left:8.667%;top:11%;width:82.667%;height:78%;object-fit:cover;display:block}
.pf .pframe{position:absolute;inset:0;width:100%;height:100%}
.about-hero{display:grid;grid-template-columns:1fr 340px;gap:44px;align-items:center;margin-bottom:12px}
.about-hero .lead{max-width:none}
.about-hero .pf{width:340px}
.tutor-card{grid-template-columns:200px 1fr}
.tutor-card .pf{width:200px}
@media (max-width:900px){
  .about-hero{grid-template-columns:1fr;gap:26px}
  .about-hero .pf{width:100%;max-width:300px;justify-self:center}
  .tutor-card .pf{width:100%;max-width:240px}
}
.tutor-card>*{min-width:0}
.tutor-card .row-s{flex-wrap:wrap}
@media (max-width:900px){ .tutor-card{grid-template-columns:1fr} }

/* mascot & crayon decorations */
:root{--deco:#8FA67F;--deco-hatch:#FFFBEA;--deco-pink:#8FA67F}
:root[data-theme="dark"]{--deco:#A3B993;--deco-hatch:#1F1813;--deco-pink:#A3B993}
.mascot{color:var(--ink);overflow:visible;flex:none}
.mascot .mb{fill:#D3DFC6;stroke:currentColor;stroke-width:3;stroke-linejoin:round}
.mascot .ml{fill:none;stroke:#9DB28C;stroke-width:2;stroke-linecap:round}
.mascot .mleaf{fill:#F1F1C1;stroke:currentColor;stroke-width:2.2}
.mascot .ol{stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mascot .ol.thin{stroke-width:2}
.mascot .fl{fill:none}
.mascot .ink{fill:currentColor}
.mascot .eye{fill:#3A2B20}
.mascot .ol.face{stroke:#3A2B20}
.mascot .mc{fill:#F0CDB8}
.mascot .ptr{stroke:#6E855F;stroke-width:4;stroke-linecap:round}
.mascot .bk{fill:#F1F1C1;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round}
.deco{color:var(--deco);flex:none;display:block}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.hero-art{position:relative;flex:none;width:150px;height:150px}
.m-hero{width:132px;position:absolute;right:0;bottom:0}
.sp-hero{width:64px;position:absolute;left:-18px;top:-8px}
.m-empty{width:96px;margin:0 auto 10px;display:block}
.free{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--sage-900);margin:4px 0 12px;font-size:14.5px}
.free.big{font-size:17px;margin:18px 0 12px}
.free span{background:linear-gradient(transparent 55%, var(--mark) 55%);padding:0 2px}
.sp-mini{width:30px;color:var(--deco-pink)}
.ar-btn{width:58px;transform:rotate(-4deg)}
.row-s .ar-btn{margin-right:2px}
.photo-wrap{position:relative}
.sp-photo{position:absolute;width:74px;right:-30px;top:-38px}
.tg-cta{position:relative;align-items:center}
.m-cta{width:84px;margin:-6px 0 -10px;color:#FFFBEA}
.cta-txt{flex:1;min-width:220px}
:root[data-theme="dark"] .m-cta{color:#2A1F17}
.sumtop .sum-art{position:relative;width:120px;height:120px;flex:none}
.m-sum{width:104px;position:absolute;right:0;bottom:0}
.sp-sum{width:56px;position:absolute;left:-14px;top:-14px}
#doneArt{position:relative;width:110px;height:100px;margin:0 auto 8px}
.m-done{width:90px;position:absolute;left:10px;bottom:0}
.sp-done{width:48px;position:absolute;right:-8px;top:-10px}
:root[data-theme="dark"] .mascot{color:#FFFBEA}
:root[data-theme="dark"] .mascot .mb{stroke:#FFFBEA}
@media (max-width:900px){
  .hero-art{width:104px;height:104px}
  .m-hero{width:92px}
  .sp-hero{width:44px;left:-10px}
  .sp-photo{right:-6px;top:-30px;width:56px}
  .sumtop .sum-art{display:none}
}
@media (max-width:520px){
  .hero-row{align-items:flex-start}
  .hero-art{width:80px;height:84px;margin-top:6px}
  .m-hero{width:72px}
  .sp-hero{display:none}
  .ar-btn{display:none}
  .m-cta{width:64px}
}

/* intro block on home */
.intro{display:grid;grid-template-columns:320px 1fr;gap:72px;align-items:center;padding:6px 0 34px;margin-bottom:34px;border-bottom:1px solid var(--line)}
.intro h1{margin-top:0}
.intro .lead{max-width:560px}
.intro .free{margin:16px 0 12px;font-size:16px}
.intro-btns{flex-wrap:wrap}
.intro-photo .pf{width:320px}
.h1like{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.15;letter-spacing:-.015em;margin:8px 0 12px;color:var(--sage-900)}
@media (max-width:900px){
  .intro{grid-template-columns:1fr;gap:22px}
  .intro-photo{order:-1}
  .intro-photo .pf{width:100%;max-width:300px}
  .h1like{font-size:28px}
}

/* ---- readability ---- */
.tl{margin:14px 0 18px;padding:12px 16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.tl svg{width:100%;height:auto;display:block;overflow:visible}
.tl-axis{stroke:var(--sage-300);stroke-width:2}
.tl-axhead{fill:var(--sage-300)}
.tl-now{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.55}
.tl-nowt{font:600 11px var(--sans);fill:var(--ink);letter-spacing:.06em;text-transform:uppercase}
.tl-end{font:11px var(--sans);fill:var(--muted)}
.tl-ev{fill:var(--accent)}
.tl-n{font:700 9px var(--sans);fill:var(--on-accent)}
.tl-bar{fill:var(--sage-100);stroke:var(--sage-300)}
.tl-wave{fill:none;stroke:#6E855F;stroke-width:3;stroke-linecap:round}
:root[data-theme="dark"] .tl-wave{stroke:#A9BE98}
.tl-arc{fill:none;stroke:var(--sage-500);stroke-width:1.8;stroke-dasharray:5 4}
.tl-arrhead{fill:var(--sage-500)}
.tl-lb{font:italic 12.5px var(--sans);fill:var(--ink)}
.tl-lb.sm{font-size:11.5px;fill:var(--muted);font-style:normal}
.tl figcaption{font-size:14px;color:var(--muted);margin-top:4px}
/* rule cards */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.rule{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sage-300);border-radius:4px;padding:12px 14px}
.rule-t{font-weight:600;color:var(--sage-900);font-size:15.5px;margin-bottom:4px}
.rule-c{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.rule-c span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sage-500);font-weight:600}
.rule-e{font-size:14.5px;font-style:italic;background:var(--sage-50);border-radius:4px;padding:6px 10px}
.rule-e b{font-style:normal}
/* comparison */
.vs{display:grid;grid-template-columns:1fr 34px 1fr;gap:6px 0;margin:14px 0;font-size:15px}
.vs-h{font-weight:600;font-size:13px;letter-spacing:.03em;padding:8px 12px;border-radius:4px 10px 0 0}
.vs-h.a{background:var(--sage-100);color:var(--sage-900)}
.vs-h.b{background:var(--ok-bg);color:var(--ok-ink)}
.vs-c{padding:9px 12px;background:var(--surface);border:1px solid var(--line-soft)}
.vs-c.a{border-left:3px solid var(--sage-300)}
.vs-c.b{border-left:3px solid var(--ok-line)}
.vs-mid{display:grid;place-items:center;color:var(--sage-500);font-weight:600}
.vs-mid.h{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
/* glossary */
.gloss{margin:14px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.gloss-h{display:grid;grid-template-columns:minmax(140px,38%) 1fr;gap:14px;padding:8px 14px;background:var(--sage-50);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sage-700)}
.gl{display:grid;grid-template-columns:minmax(140px,38%) 1fr;gap:14px;padding:9px 14px;border-top:1px solid var(--line-soft)}
.gl dt{font-weight:600;color:var(--sage-900)}
.gl dd{color:var(--ink)}
/* generic tables */
.section table th:first-child, .section table td:first-child{font-weight:600;color:var(--sage-900)}
.section table tr:nth-child(even) td{background:color-mix(in srgb, var(--sage-50) 55%, transparent)}
@media (max-width:640px){
  .vs{grid-template-columns:1fr 22px 1fr;font-size:14px}
  .vs-c,.vs-h{padding:8px 9px}
  .gloss-h{display:none}
  .gl{grid-template-columns:1fr;gap:2px}
  main table.stack{display:block;border:0;background:none;overflow:visible}
  main table.stack tr:first-child{display:none}
  main table.stack tbody{display:block}
  main table.stack tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:4px;margin:8px 0;padding:6px 0}
  main table.stack td{display:block;border:0;padding:4px 12px;min-width:0;background:none !important}
  main table.stack td[data-label]:before{content:attr(data-label);display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sage-500)}
}

.mascot .mug{fill:#F1F1C1;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round}
.mascot .mug-b{stroke:#8FA67F;stroke-width:4}
.mascot .glass{fill:rgba(255,255,255,.35);stroke:#3A2B20;stroke-width:2.2}
.mascot .steam{opacity:.55}
.intro-photo{position:relative}
.m-photo{position:absolute;width:118px;right:-60px;bottom:-34px;transform:rotate(7deg);filter:drop-shadow(0 6px 10px rgba(58,43,32,.18));z-index:2}
@media (max-width:900px){ .intro-photo{justify-self:center;width:100%;max-width:300px} .intro-photo .pf{width:100%} .m-photo{width:92px;right:-28px;left:auto;bottom:-26px} .intro{padding-bottom:40px} }
@media (max-width:420px){ .m-photo{width:80px;right:-16px;left:auto;bottom:-24px} }
.mascot .shine{fill:#FFFFFF}
.mascot .glass{fill:rgba(255,255,255,.4)}

.intro{display:block}
.intro .intro-photo{width:360px;max-width:100%;margin:26px 0 30px}
.intro .intro-photo .pf{width:100%}
@media (max-width:900px){ .intro .intro-photo{order:0;justify-self:auto;width:100%;max-width:320px;margin:22px 0 28px} }

.intro h1{font-size:32px;max-width:640px}
.creator{margin-top:30px;padding-top:24px;border-top:1px dashed var(--line)}
.creator-h{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--sage-900);margin-bottom:6px}
.creator-t{font-size:15.5px;color:var(--muted);max-width:560px}
.creator .intro-photo{width:300px;margin:20px 0 28px}
@media (max-width:900px){ .intro h1{font-size:26px} .creator .intro-photo{width:100%;max-width:300px} }

/* soft rounded typography (Nunito) */
body{font-size:16.5px;letter-spacing:.005em}
h1,.h1like{font-weight:800;letter-spacing:-.015em}
.section h2,.ghead h2,.part-h,.card-title,.ctx-h h3,.panel-head h3,.fhead h3,.creator-h,.cta h3,.done h3,.tg-channel h3,.tutor-card h3,.pg,.brand{font-weight:700;letter-spacing:-.01em}
.card-n,.themes .n,.count,.num,.ring b,.lp b{font-weight:700}
.lead{line-height:1.6}
.tabs button,.btn,.chip,.seg button{font-weight:600}
.opt,.mo,.tok{font-weight:500}

/* ---- less "generated" look ---- */
.themes button{grid-template-columns:1fr auto}
.eyebrow,.side-label,.themes .sg,.flabel,.mini-h,.qnum,.ctx-tag,.ghead span,.rule-c span,.gloss-h,.vs-h,.vs-mid.h,th,.steps li:before,.pg span,.tl-nowt{text-transform:none !important;letter-spacing:0 !important}
.eyebrow{font-size:14px;font-weight:600;color:var(--sage-500)}
.side-label,.themes .sg{font-size:13px;font-weight:700;color:var(--sage-700)}
.mini-h,.qnum{font-size:13px}
th{font-size:13px}
.card{box-shadow:none !important;transform:none !important;transition:border-color .15s}
.card:hover{border-color:var(--sage-500)}
.card-top{margin-bottom:6px;min-height:0}
.card-top:empty,.card-top:has(.card-n:empty):not(:has(.p)){display:none}
.card-lead{-webkit-line-clamp:2}
.pf,.btn,.chip,.tabs,.tabs button,.seg,.seg button,.themebtn,.lvl,.opt,.mo,.q,.task,.panel,.ctx,.rule,.gloss,.tl,.cta,.score,.filterbox,.search,.pk,.lp,.kwkey,.free span{border-radius:4px !important}
.themebtn{border-radius:4px !important}
.q,.task,.panel,.ctx,.cta,.score,.filterbox{box-shadow:none}
.pf{box-shadow:0 1px 0 var(--line)}
.lvl{border-radius:3px !important}

.pg-head{text-transform:none !important;letter-spacing:0 !important;font-size:14px}
#qs .okey{display:none}
.card-lead{-webkit-line-clamp:3}
</style>
</head>
