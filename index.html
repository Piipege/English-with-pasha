{t:'write', part:'Writing', title:'Writing Task 1 · Bar chart', l:'B2', min:150, time:20, band:'Band 8',
prompt:`<div class="box"><p><b>You should spend about 20 minutes on this task.</b></p><p>The chart below shows the average number of hours per week that people in three age groups spent on four leisure activities in one country in 2025.</p><p>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.</p><p><i>Write at least 150 words.</i></p>${CHART_BAR}</div>`,
check:['Вступление перефразирует задание','Overview: молодые больше всего в соцсетях, старшие у телевизора; чтение и спорт занимают меньше всего времени','Сравнение возрастных групп, а не просто перечисление цифр','Все четыре вида активности упомянуты','Нет мнения, 150+ слов'],
model:`<p>The bar chart compares how many hours per week three age groups spent on social media, television, exercise and reading in one country in 2025.</p>
<p>Overall, the youngest group spent by far the most time on social media, whereas the oldest group devoted most of their leisure time to television. Exercise and reading occupied relatively few hours across all ages.</p>
<p>Social media use declined sharply with age. People aged 16–24 spent 18 hours a week on it, almost twice as long as those aged 25–44 (10 hours), while the over-45s spent only 4 hours. Television showed the opposite pattern: viewing time rose from 6 hours among the youngest to 9 hours for the middle group and 15 hours for the oldest, making it the most popular activity for people over 45.</p>
<p>The figures for exercise were broadly similar, ranging from 3 to 5 hours, with the youngest group the most active. Reading, by contrast, increased with age: the over-45s read for 6 hours a week, three times as long as 16–24-year-olds, who read for just 2 hours.</p>
<p><i>(≈ 195 words)</i></p>`},
{t:'write', title:'Writing Task 2 · Opinion essay', l:'B2', min:250, time:40, band:'Band 8',
prompt:`<div class="box"><p><b>You should spend about 40 minutes on this task.</b></p><p>Some people believe that university education should be free for all students, paid for by the government.</p><p><b>To what extent do you agree or disagree?</b></p><p>Give reasons for your answer and include any relevant examples from your own knowledge or experience.</p><p><i>Write at least 250 words.</i></p></div>`,
check:['Позиция ясна во введении и сохраняется до конца','Два основных абзаца с развитыми аргументами и примерами','Учтён противоположный взгляд (по желанию, но полезно для Band 7+)','Связки разнообразны и естественны','250+ слов'],
model:`<p>Whether higher education should be funded entirely by the state is a question that divides opinion in many countries. While I accept that free tuition has clear benefits, I believe that a system in which students contribute part of the cost, with generous support for those on low incomes, is fairer and more sustainable.</p>
<p>Supporters of free university education argue that it widens access. When tuition is free, talented young people from poorer families are not discouraged by the prospect of large debts, and society benefits from the skills of a wider pool of graduates. Countries such as Germany, where tuition fees at public universities are minimal, are often cited as evidence that this model can work. A well-educated population also tends to be healthier and more productive, so public investment in universities can be seen as an investment in the economy as a whole.</p>
<p>However, making university completely free for everyone has significant drawbacks. Higher education is expensive, and if the government pays the full cost, the money must come from taxpayers, including many people who never attended university and often earn less than graduates. In practice, free tuition may therefore transfer resources from lower-income workers to students who will later enjoy higher salaries. Furthermore, when funding is limited, universities may be forced to restrict the number of places or reduce the quality of teaching.</p>
<p>In conclusion, although free university education is an attractive idea, I believe a mixed system is preferable: students should pay a share of the cost, ideally through loans repaid only once they earn above a certain income, while grants ensure that no capable student is excluded because of their background.</p>
<p><i>(≈ 300 words)</i></p>`},
{t:'speak', part:'Speaking', title:'Part 1 · Your hometown', l:'B1', talk:180,
prompt:`<ul><li>Where is your hometown?</li><li>What do you like about living there?</li><li>Is it a good place for young people? Why / why not?</li><li>How has your hometown changed in recent years?</li></ul>`,
model:`<p><b>Where is your hometown?</b> I’m from Kazan, which is a fairly large city on the Volga river, about eight hundred kilometres east of Moscow.</p>
<p><b>What do you like about it?</b> I love the mix of cultures. You can see a mosque and an Orthodox cathedral standing almost side by side in the Kremlin, which I think is quite unusual. The food is great too.</p>
<p><b>Is it good for young people?</b> Yes, I’d say so. There are lots of universities, so the city feels quite young and lively, and there’s always something going on in the evenings.</p>
<p><b>How has it changed?</b> It’s become much more modern over the last ten years. The embankment has been completely redeveloped, and there are far more cycle paths than when I was a child.</p>`},
{t:'speak', title:'Part 2 · Cue card', l:'B2', prep:60, talk:120, band:'Band 7.5–8',
prompt:`<div class="box"><p><b>Describe a skill you learned that you are proud of.</b></p><p>You should say:</p><ul><li>what the skill is</li><li>when and how you learned it</li><li>how difficult it was to learn</li></ul><p>and explain why you are proud of it.</p></div>`,
model:`<p>The skill I’m proudest of is swimming, which might sound a bit strange because most people learn it as children. I didn’t, though: I only learned when I was twenty-five.</p>
<p>As a kid I had a bad experience at a summer camp, when I slipped into deep water and panicked, and after that I avoided pools and the sea for years. It became a bit embarrassing, especially on holidays with friends, when I always had some excuse for staying on the beach.</p>
<p>Eventually I decided enough was enough and signed up for adult lessons at a local pool. Honestly, it was much harder than I expected, not physically but mentally. For the first few weeks I couldn’t even put my face in the water without feeling anxious. My instructor was incredibly patient; she broke everything down into tiny steps, like breathing out under water or floating on my back for ten seconds.</p>
<p>It took about four months before I could swim a full length without stopping, and I still remember that moment really clearly. The reason I’m so proud of it is that it wasn’t just about learning a technique, it was about overcoming a fear I’d had for most of my life. Now I swim twice a week, and last summer I even swam in the sea, which my younger self would never have believed.</p>`},
{t:'speak', title:'Part 3 · Skills and learning', l:'B2', talk:300, band:'Band 7.5–8',
prompt:`<ul><li>What skills do you think children should learn at school that they don’t learn now?</li><li>Is it easier to learn new skills as a child or as an adult?</li><li>Do you think practical skills are valued less than academic ones?</li><li>How might technology change the way people learn skills in the future?</li></ul>`,
model:`<p><b>Skills children should learn:</b> I think financial literacy should be taught much more seriously. Many young people leave school without knowing how to make a budget or understand a loan, and they often learn these things the hard way, by getting into debt.</p>
<p><b>Child or adult?</b> In some ways children have an advantage, they pick up languages and physical skills like skating remarkably quickly, partly because they’re not afraid of making mistakes. Adults, on the other hand, are usually better at understanding why they’re doing something, so they can learn more efficiently if they’re motivated.</p>
<p><b>Practical vs academic:</b> Unfortunately, yes, at least where I come from. There’s a strong belief that everyone should go to university, so jobs like plumbing or electrical work are seen as second-best, even though they’re well paid and in high demand.</p>`}
]
},

M2L2:{type:'listen', skill:'L', title:'Listening · Part 3 · Planning a student project', intro:'Questions 6–11. Choose the correct letter, or write <b>ONE WORD AND/OR A NUMBER</b>.', lines:[
{v:'W', t:'So, Tom, we need to decide on the focus of our presentation. I was thinking we could look at plastic waste in the university canteen.'},
{v:'M', t:'That’s a good idea, but isn’t it a bit narrow? I’d been thinking about the whole campus.'},
{v:'W', t:'Maybe, but the canteen is where most of the waste comes from, and it would be much easier to collect data there.'},
{v:'M', t:'Fair point. OK, the canteen it is. How should we collect the data? A questionnaire?'},
{v:'W', t:'Questionnaires take ages to analyse. What if we simply counted the plastic items thrown away during one week?'},
{v:'M', t:'That sounds more reliable, actually. People don’t always tell the truth in surveys. We’d need permission from the catering manager, though.'},
{v:'W', t:'I can email her today. What about the presentation itself? Dr Evans said it should be fifteen minutes.'},
{v:'M', t:'I thought it was twenty.'},
{v:'W', t:'No, she changed it last week. Fifteen, plus five minutes for questions.'},
{v:'M', t:'Right. I’m happy to do the slides, if you’ll handle the data analysis.'},
{v:'W', t:'Deal. Shall we meet on Thursday to practise?'},
{v:'M', t:'Thursday’s my part-time job. How about Friday morning?'},
{v:'W', t:'Friday morning works for me.'}
]},
M2R:{type:'read', skill:'R', title:'Reading · Farming Upwards', intro:'You should spend about 20 minutes on Questions 12–24.', html:`
<p><b class="pl">A</b>In a former warehouse on the edge of a city, rows of lettuce grow on shelves stacked eight levels high. There is no soil and no sunlight; the plants sit in trays of nutrient-rich water under purple LED lamps, while computers control temperature, humidity and carbon dioxide. This is vertical farming, an approach that its supporters believe could transform the way cities are fed.</p>
<p><b class="pl">B</b>The advantages are easy to see. Because crops are grown indoors, they are protected from storms, droughts and pests, so farmers rarely need pesticides. Production continues all year round, and yields per square metre can be many times higher than in a field. Vertical farms also use far less water than conventional agriculture, as most of it is recycled within a closed system. Moreover, by locating farms inside or near cities, producers can cut the distance food travels to supermarkets, delivering fresher produce.</p>
<p><b class="pl">C</b>However, the technology has a significant weakness: energy. Replacing the sun with artificial light requires enormous amounts of electricity, and climate control adds further costs. In regions where electricity comes mainly from fossil fuels, the carbon footprint of a vertically farmed lettuce may be higher than that of one grown outdoors and transported hundreds of kilometres. Several well-known vertical farming companies have closed in recent years after failing to cover their energy bills.</p>
<p><b class="pl">D</b>The range of crops is also limited. Leafy greens and herbs are ideal, because they grow quickly, are light and fetch high prices. Staple crops such as wheat, rice and potatoes, which provide most of the world’s calories, are a different matter. They need far more space and light relative to their value, and growing them indoors is, at present, economically unrealistic.</p>
<p><b class="pl">E</b>Supporters respond that costs are falling. LED lamps have become dramatically more efficient over the past fifteen years, and some farms now generate their own power from solar panels or use surplus heat from nearby factories. Researchers are also developing plant varieties designed specifically for indoor conditions, which grow more compactly and need less light.</p>
<p><b class="pl">F</b>Most experts now see vertical farming not as a replacement for traditional agriculture but as a complement to it. In places with little farmland or harsh climates, such as desert cities or northern regions with long, dark winters, it may offer a reliable local supply of fresh vegetables. Elsewhere, its future will depend largely on the price of clean energy.</p>`}
},

{t:'write', part:'Writing', title:'Writing Task 1 · Process diagram', l:'B2', min:150, time:20, band:'Band 8',
prompt:`<div class="box"><p><b>You should spend about 20 minutes on this task.</b></p><p>The diagram below shows how recycled paper is produced.</p><p>Summarise the information by selecting and reporting the main features.</p><p><i>Write at least 150 words.</i></p>${CHART_PROCESS}</div>`,
check:['Вступление перефразирует задание','Overview: сколько этапов, с чего начинается и чем заканчивается процесс','Все этапы описаны по порядку','Present Simple Passive (is collected, is mixed…)','Слова последовательности: first, next, after that, once, finally','150+ слов'],
model:`<p>The diagram illustrates the process by which used paper is recycled to produce new paper.</p>
<p>Overall, there are six main stages, beginning with the collection of waste paper and ending with the production of new rolls of paper, which are then delivered to shops.</p>
<p>First, used paper is collected from homes and businesses and taken to a recycling centre, where it is sorted according to its type and quality. Next, the sorted paper is placed in a large container and mixed with water and chemicals, which break it down into a soft pulp.</p>
<p>After that, the pulp is cleaned to remove any remaining materials, such as plastic or staples, and it is also de-inked so that the final product is as white as possible. Once it has been cleaned, the pulp is pressed and dried by being passed between heavy rollers, which squeeze out the water. Finally, the resulting paper is rolled into large reels, ready to be cut and delivered to shops as new paper products.</p>
<p><i>(≈ 175 words)</i></p>`},
{t:'write', title:'Writing Task 2 · Discussion essay', l:'B2', min:250, time:40, band:'Band 8',
prompt:`<div class="box"><p><b>You should spend about 40 minutes on this task.</b></p><p>Some people think that the best way to reduce traffic congestion in cities is to build more roads. Others believe that improving public transport is a better solution.</p><p><b>Discuss both views and give your own opinion.</b></p><p><i>Write at least 250 words.</i></p></div>`,
check:['Обе точки зрения описаны в отдельных абзацах','Ваше мнение ясно (во введении и заключении)','Каждая точка зрения объяснена и подкреплена примером','Нейтральные формулировки при описании чужих взглядов: Some argue that… Supporters of this view…','250+ слов'],
model:`<p>Traffic congestion is one of the most persistent problems facing modern cities, and there is considerable debate about how best to tackle it. While some argue that building new roads is the answer, I agree with those who believe that investment in public transport offers a more effective long-term solution.</p>
<p>Those in favour of road building point out that many cities were designed for far fewer vehicles than they now carry. Wider roads, ring roads and new bridges can increase capacity and allow traffic to flow more freely, at least in the short term. This approach also responds directly to the needs of people who depend on cars, such as tradespeople carrying equipment or families living in areas poorly served by buses and trains.</p>
<p>However, experience in many cities suggests that new roads rarely solve congestion for long. When road space increases, driving becomes more attractive, so more people choose to travel by car, and within a few years the new roads are as crowded as the old ones. Public transport, by contrast, can move far more people using the same amount of space: a single bus can replace dozens of cars, and a metro line can carry tens of thousands of passengers an hour. Cities that have invested in frequent, reliable and affordable services, such as those in much of Western Europe and East Asia, generally have lower car dependency as a result.</p>
<p>In conclusion, although building roads may offer temporary relief, I believe that improving public transport is the better strategy, because it addresses the root of the problem by giving people a genuine alternative to driving.</p>
<p><i>(≈ 300 words)</i></p>`},
{t:'speak', part:'Speaking', title:'Part 1 · Reading', l:'B1', talk:180,
prompt:`<ul><li>Do you enjoy reading? Why / why not?</li><li>What kind of things do you usually read?</li><li>Do you prefer paper books or e-books?</li><li>Did you read a lot when you were a child?</li></ul>`,
model:`<p><b>Do you enjoy reading?</b> Yes, very much. It’s one of the few things that really helps me switch off from work, especially before I go to sleep.</p>
<p><b>What do you usually read?</b> Mostly novels, crime fiction in particular, but I also read a lot of articles online about science and technology.</p>
<p><b>Paper or e-books?</b> I prefer paper books at home, I like the feel of them, but I use an e-reader when I travel, because it’s much lighter than carrying three or four books.</p>
<p><b>As a child?</b> Not as much as I’d like to say, actually. I only really got into reading as a teenager, when a friend lent me a fantasy series and I couldn’t put it down.</p>`},
{t:'speak', title:'Part 2 · Cue card', l:'B2', prep:60, talk:120, band:'Band 7.5–8',
prompt:`<div class="box"><p><b>Describe a place you visited that you would like to go back to.</b></p><p>You should say:</p><ul><li>where it is</li><li>when you went there and who with</li><li>what you did there</li></ul><p>and explain why you would like to go back.</p></div>`,
model:`<p>I’d like to talk about a small town in Georgia called Sighnaghi, which is in the Kakheti region, about two hours’ drive east of Tbilisi.</p>
<p>I went there three years ago with two close friends. We were travelling around Georgia for ten days, and to be honest, Sighnaghi wasn’t originally on our list; a guesthouse owner in Tbilisi recommended it, and we decided to go on impulse.</p>
<p>It turned out to be the highlight of the whole trip. The town is built on a hill and surrounded by old defensive walls, so you can walk along them and look out over the Alazani Valley, with the Caucasus mountains in the distance. We spent most of our time just wandering through the narrow streets, visiting small family wineries and eating far too much, the food was incredible.</p>
<p>The reason I’d love to go back is partly the scenery, which is absolutely breathtaking, but mostly the people. Our host family treated us like relatives; on our last evening, they invited us to a traditional supper with singing and endless toasts, and I don’t think I’ve ever felt so welcome anywhere. We were only there for two days, which really wasn’t enough, so next time I’d like to stay at least a week and explore the surrounding villages too.</p>`},
{t:'speak', title:'Part 3 · Tourism', l:'B2', talk:300, band:'Band 7.5–8',
prompt:`<ul><li>Why do you think people enjoy travelling to other countries?</li><li>What are the negative effects of tourism on popular destinations?</li><li>Should governments limit the number of tourists in some places?</li><li>How do you think tourism will change in the future?</li></ul>`,
model:`<p><b>Why do people travel?</b> I think the main reason is curiosity, people want to experience things they can’t see at home, whether that’s different landscapes, food or ways of life. For many, it’s also a way of escaping routine; even a short trip can make you see your own life from a different perspective.</p>
<p><b>Negative effects:</b> The most obvious one is overcrowding. In cities like Venice or Barcelona, the number of visitors in summer is so high that it changes the character of the place, and local residents are often pushed out because flats are rented to tourists instead. There’s also an environmental cost, particularly from flights.</p>
<p><b>Should governments limit tourists?</b> In some cases, yes, I think it’s justified. Charging an entry fee or limiting daily visitor numbers might seem unfair, but it can protect fragile places so that future generations can still enjoy them.</p>`}
]
}
);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ').trim();

function ecTokens(q){
  const out=[]; const re=/\[([^\]]+)\]([.,!?;:]*)|(\S+)/g; let m;
  while((m=re.exec(q.s))){
    if(m[1]!==undefined){ const ws=m[1].split(/\s+/); ws.forEach((w,k)=>out.push({w: k===ws.length-1 ? w+(m[2]||'') : w, err:true})); }
    else out.push({w:m[3], err:false});
  }
  return out;
}
function ecFixed(q){
  let f = q.s.replace(/\[[^\]]+\]/, !q.fix ? '' : q.fix).replace(/\s+([.,!?])/g,'$1').replace(/\s{2,}/g,' ').trim();
  return f.charAt(0).toUpperCase()+f.slice(1);
}
const CAPS = ['london','japan','monday','spanish','english','rome','kazan','volga','mum','mom'];
function pretty(a, q){
  let t = a.replace(/\bi\b/g,'I').replace(/\b[a-z]+\b/g, w=> CAPS.slice(0,8).includes(w) ? w[0].toUpperCase()+w.slice(1) : w);
  t = t.charAt(0).toUpperCase()+t.slice(1);
  return t + ((q.ru||'').trim().endsWith('?') ? '?' : '.');
}
function promptText(q){
  if(q.t==='kw') return q.s1+' → ('+q.key+') '+q.s2;
  if(q.t==='ec') return q.s.replace(/[\[\]]/g,'');
  if(q.t==='tl') return q.ru;
  return q.q;
}
function correctText(q){
  if(q.t==='mc') return q.o[q.a];
  if(q.t==='kw') return q.s2.replace('___', q.a[0].replace(/\bi\b/g,'I').toUpperCase());
  if(q.t==='ec') return ecFixed(q);
  if(q.t==='tl') return pretty(q.a[0], q);
  return q.a[0];
}
function answerText(q,v){
  if(v===undefined || v===null || v==='') return '(нет ответа)';
  if(q.t==='mc') return q.o[v];
  if(q.t==='ec') return (ecTokens(q)[v]||{}).w || '(ничего)';
  return v;
}
const isRight = (q,v) => {
  if(q.t==='mc') return v===q.a;
  if(q.t==='ec') return typeof v==='number' && !!(ecTokens(q)[v]||{}).err;
  return typeof v==='string' && q.a.some(a=>norm(a)===norm(v));
};

}

const DAY = 864e5;
let srs = {};

function srsRecord(tid, i, ok){
  const t = byId(tid), q = t && t.quiz[i]; if(!q || q.ctx || !gradable(q)) return;
  const k = tid+'#'+i, e = srs[k], now = Date.now();
  if(!ok) srs[k] = {s:0, d: e ? now+DAY : now, n:(e?e.n:0)+1};
  else if(e){ e.s++; if(e.s>=2) delete srs[k]; else e.d = now+3*DAY; }
  saveSrs();
}
function srsItems(dueOnly=true){
  const now = Date.now();
  return Object.entries(srs).filter(([k,e])=>!dueOnly || e.d<=now).map(([k,e])=>{
    const [tid,i] = k.split('#'); const t = byId(tid); const q = t && t.quiz[+i];
    return q && gradable(q) && !q.ctx ? {tid, q, i:+i, e} : null; }).filter(Boolean);
}

function bindTimer(b){

let VOICES = [];
function loadVoices(){ try{ VOICES = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }catch(e){ VOICES=[]; } }
try{ if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } }catch(e){}
function pickVoice(tag){
  if(!VOICES.length) return null;
  const uk = VOICES.filter(v=>/GB|IE|AU|NZ/i.test(v.lang)), pool = uk.length ? uk : VOICES;
  const fem = /female|samantha|karen|serena|kate|moira|tessa|susan|hazel|libby|sonia|emma|amy|zira|aria|jenny/i;
  const mal = /male|daniel|arthur|george|ryan|oliver|thomas|james|guy|david|mark|fred|lee/i;
  const find = re => pool.find(v=>re.test(v.name) && !(re===mal && fem.test(v.name))) || VOICES.find(v=>re.test(v.name) && !(re===mal && fem.test(v.name)));
  if(tag==='W') return find(fem) || pool[0];
  if(tag==='M') return find(mal) || pool[1] || pool[0];
  return pool[0];
}
function speakLines(lines, rate, onEnd){
  speechSynthesis.cancel();
  const parts = [];
  lines.forEach(l=> l.t.split(/(?<=[.!?])\s+/).forEach(seg=>{ if(seg.trim()) parts.push({v:l.v, t:seg}); }));
  parts.forEach((p,k)=>{
    const u = new SpeechSynthesisUtterance(p.t), v = pickVoice(p.v);
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
    u.rate = rate; u.pitch = p.v==='M' ? 0.85 : p.v==='W' ? 1.12 : 1;
    if(k===parts.length-1) u.onend = onEnd;
    speechSynthesis.speak(u);
  });
}

    const n = THEMES.filter(t=>(v==='all'||t.group===v) && (ov.level==='all'||t.levels.includes(ov.level))).length;
    b.classList.toggle('on', v===ov.group);
    b.innerHTML = (v==='all'?'Все группы':groupOf(v).title) + ` <span class="cn">${n}</span>`;
  });
  const list = THEMES.filter(matches);
  const active = ov.group!=='all' || ov.level!=='all' || ov.q;
  $('#fsum').innerHTML = active
    ? `Найдено тем: <b>${list.length}</b>${ov.level!=='all'?` · с материалом уровня ${ov.level}`:''} <button class="linkbtn" id="clearF">Сбросить фильтры</button>`
    : '';
  if(active) $('#clearF').onclick = ()=>{ ov={group:'all',level:'all',q:''}; saveOv(); $('#search').value=''; drawResults(); };
  let html;
  if(!list.length){
    html = `<div class="empty">${mascot('read','m-empty')}<p>Ничего не найдено. Попробуйте другой запрос или сбросьте фильтры.</p></div>`;
  } else if(ov.group==='all' && !ov.q){
    html = GROUPS.map(g=>{ const ts = list.filter(t=>t.group===g.id); if(!ts.length) return '';
      return `<div class="ghead"><h2>${g.title}</h2><span>${ts.length} ${ts.length===1?'тема':ts.length<5?'темы':'тем'}</span></div>
        <div class="grid">${ts.map(t=>cardHTML(t,false)).join('')}</div>`; }).join('');
  } else {
    html = `<div class="grid" style="margin-top:22px">${list.map(t=>cardHTML(t, ov.group==='all')).join('')}</div>`;
  }
  $('#results').innerHTML = html;
  document.querySelectorAll('#results .card').forEach(c=>c.onclick=()=>{ levelFilter='all'; go(undefined,c.dataset.theme); });
}

/* ============ THEORY ============ */

/* ============ PRACTICE ============ */
function renderPractice(t){
  const r = results(t.id);
  const levels = [...new Set(t.quiz.map(q=>q.l))].sort();
  const list = t.quiz.map((q,i)=>({...q,i})).filter(q=>levelFilter==='all' || q.l===levelFilter);
  const nextT = THEMES[(THEMES.indexOf(t)+1) % THEMES.length];
  $('#main').innerHTML = `<div class="fade">
    <button class="back" id="back">← Все темы</button>
    <div class="eyebrow">Практика · ${t.ru}</div>
    <h1>${t.title}</h1>
    <p class="lead">Выберите ответ или впишите форму глагола. После каждого ответа появится объяснение.</p>
    <div class="score">
      <div><div class="num" id="sc"></div><div class="lbl">правильных ответов</div></div>

      ${t.timer?`<button class="btn ghost timer" data-s="${t.timer*60}" data-label="Таймер"></button>`:''}

      <div class="bandline" id="bandline"></div>
    </div>
    <div class="filters">
      <button class="chip ${levelFilter==='all'?'on':''}" data-l="all">Все уровни</button>
      ${levels.map(l=>`<button class="chip ${levelFilter===l?'on':''}" data-l="${l}">${l}</button>`).join('')}
      <button class="chip link" id="readTheory">Открыть теорию</button>
      <button class="chip link dlbtn" id="dlWork">⤓ Задания для печати</button>
    </div>
    <div id="qs">${practiceBody(t,list)}</div>
    <div class="done" id="done">
      <div id="doneArt"></div>
      <h3 id="doneTitle"></h3><p id="doneText"></p>
      <div class="row">
        <button class="btn ghost" id="again">Пройти ещё раз</button>
        <button class="btn ghost" id="redoWrong"></button>
        <button class="btn solid" id="next">Следующая тема: ${nextT.title} →</button>
      </div>
    </div>
  </div>`;
  $('#back').onclick = ()=>go(undefined,null);
  $('#readTheory').onclick = ()=>go('theory');
  document.querySelectorAll('.chip[data-l]').forEach(c=>c.onclick=()=>{ levelFilter=c.dataset.l; render(); });
  const keepDrafts = ()=>{ const r0=store[t.id]||{}, k={}; Object.keys(r0).filter(x=>x[0]==='w').forEach(x=>k[x]=r0[x]); store[t.id]=k; save(); };
  $('#reset').onclick = ()=>{ keepDrafts(); render(); };
  $('#again').onclick = ()=>{ keepDrafts(); levelFilter='all'; go(); };
  $('#next').onclick = ()=>{ levelFilter='all'; go('theory', nextT.id); };

  bindExtras(t);
  list.filter(q=>gradable(q)).forEach(q=>{
    const card = document.querySelector(`.q[data-k="${q.i}"]`);
    const commit = ok=>{ r[q.i]=ok; srsRecord(t.id,q.i,ok); save(); update(t); };
    if(q.t==='mc'){
      card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const v=+b.dataset.o; r['c'+q.i]=v; commit(isRight(q,v)); lockMC(card,q,v,true); });
      if(r['c'+q.i]!==undefined) lockMC(card,q,r['c'+q.i],true);
    } else if(q.t==='ec'){
      card.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ const v=+b.dataset.w; r['v'+q.i]=v; commit(isRight(q,v)); lockEC(card,q,v,true); });
      if(r['v'+q.i]!==undefined) lockEC(card,q,r['v'+q.i],true);
    } else {
      const inp = card.querySelector('.gap'), btn = card.querySelector('.check');
      const onSelf = ()=>{ r[q.i]=true; r['s'+q.i]=1; srsRecord(t.id,q.i,true); save(); update(t); };
      const check = ()=>{ if(!inp.value.trim()){ inp.focus(); return; } r['v'+q.i]=inp.value; commit(isRight(q,inp.value)); lockText(card,q,inp.value,true,false,onSelf); };
      btn.onclick = check; inp.onkeydown = e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); check(); } };
      if(r['v'+q.i]!==undefined) lockText(card,q,r['v'+q.i],true,!!r['s'+q.i],onSelf);
    }
  });
  const wrong = gq(t).filter(x=>r[x.i]===false && !x.q.ctx);
  const rb = $('#redoWrong'); if(rb){ rb.style.display = wrong.length ? '' : 'none'; rb.textContent = `Повторить ошибки (${wrong.length})`;
    rb.onclick = ()=>{ const rr=store[t.id]||{}; startTestWith(gq(t).filter(x=>rr[x.i]===false && !x.q.ctx).map(x=>({tid:t.id,q:x.q,i:x.i})), 'theme'); }; }
  $('#dlWork').onclick = ()=>downloadWorksheet(t);
  update(t);
}

function practiceBody(t,list){
  let html='', prevCtx=null, prevPart=null, n=0;
  list.forEach(q=>{
    if(q.part && q.part!==prevPart){ html += `<h3 class="part-h">${q.part}</h3>`; prevPart=q.part; }
    if(q.ctx && q.ctx!==prevCtx) html += ctxHTML(t,q.ctx);
    prevCtx = q.ctx || null;
    if(gradable(q)) html += qHTML(q,n++,q.i);
    else if(q.t==='write') html += writeHTML(t,q);
    else if(q.t==='speak') html += speakHTML(q);
  });
  return html;
}
function ctxHTML(t,id){
  const c = t.texts[id];
  if(c.type==='read') return `<div class="ctx read">
    <div class="ctx-h"><span class="ctx-tag">Reading</span><h3>${c.title}</h3><button class="linkbtn ctx-toggle">Свернуть текст</button></div>
    ${c.intro?`<p class="note">${c.intro}</p>`:''}
    <div class="ctx-body">${c.html}</div></div>`;
  return `<div class="ctx listen" data-ctx="${id}">
    <div class="ctx-h"><span class="ctx-tag">Listening</span><h3>${c.title}</h3></div>
    ${c.intro?`<p class="note">${c.intro}</p>`:''}

function writeHTML(t,q){

    <div class="qhead"><span class="qnum">${q.title}</span><span class="qtype">${q.min}+ слов · ${q.time} мин · ${lvlPill(q.l)}</span></div>

function speakHTML(q){

function bindExtras(t){

    play.onclick = ()=>{ loadVoices(); document.querySelectorAll('.ctx.listen .play').forEach(p=>p.textContent='▶ Слушать запись'); play.textContent='♪ Идёт запись…';
      try{ speakLines(c.lines, +sel.value, ()=>{ play.textContent='▶ Слушать ещё раз'; }); }catch(e){ msg.textContent='Не удалось включить озвучку в этом браузере. Откройте текст записи.'; } };
    stop.onclick = ()=>{ try{ speechSynthesis.cancel(); }catch(e){} play.textContent='▶ Слушать запись'; };
  });
  document.querySelectorAll('.task').forEach(card=>{
    card.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{ b.classList.toggle('on'); card.querySelector('.xpanel.'+b.dataset.x).classList.toggle('show'); });
    const ta = card.querySelector('.wbox'); if(!ta) return;
    const q = t.quiz[+card.dataset.k], wc = card.querySelector('.wc');
    const count = ()=>{ const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; wc.innerHTML = `<b>${n}</b> ${n%10===1&&n%100!==11?'слово':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'слова':'слов'} · минимум ${q.min}`; wc.classList.toggle('low', n<q.min); };
    ta.oninput = ()=>{ count(); results(t.id)['w'+card.dataset.k] = ta.value; save(); };

  });
}
function qHTML(q,n,key,extra=''){
  const btn = `<div class="qactions"><button class="btn solid check">${extra?'Ответить':'Проверить'}</button></div>`;
  const inp = cls => `<input class="gap ${cls||''}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ответ">`;
  let body, type;
  if(q.t==='gap'){ type='Впишите ответ';
    body = `<div class="qtext">${esc(q.q).replace('___', inp())}</div>${q.hint?`<div class="hint">${esc(q.hint)}</div>`:''}${btn}`; }
  else if(q.t==='mc'){ type='Выберите ответ';
    body = `<div class="qtext">${esc(q.q).split('___').join('<b class="blank">____</b>')}</div>
       <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-o="${k}"><span class="okey">${k+1}</span>${esc(o)}</button>`).join('')}</div>`; }
  else if(q.t==='kw'){ type='Трансформация'+(q.ex?' · '+q.ex:'');
    body = `<div class="kw"><div class="kw1">${esc(q.s1)}</div><div class="kwkey">${esc(q.key)}</div><div class="kw2">${esc(q.s2).replace('___', inp('kwin'))}</div></div>
       <div class="hint">Используйте слово <b>${esc(q.key)}</b> без изменений${q.ex?`; ${KW_RANGE[q.ex]} слов, включая его`:''}. Смысл должен совпадать с первым предложением.</div>${btn}`; }
  else if(q.t==='ec'){ type='Найдите ошибку';
    body = `<div class="qtext ectext">${ecTokens(q).map((x,k)=>`<button class="tok" data-w="${k}">${esc(x.w)}</button>`).join(' ')}</div><div class="hint">Нажмите на слово или фразу с ошибкой.</div>`; }
  else { type='Переведите на английский';
    body = `<div class="qtext rusrc">${esc(q.ru)}</div><textarea class="gap tlin" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваш перевод…" aria-label="перевод"></textarea>${btn}`; }
  return `<div class="q" data-k="${key}">
    <div class="qhead"><span class="qnum">${extra || 'Задание '+(n+1)}</span><span class="qtype">${type} · ${lvlPill(q.l)}</span></div>
    ${body}<div class="fb"></div></div>`;
}

function lockMC(card,q,chosen,feedback){
  card.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true; if(k===q.a) b.classList.add('right'); else if(k===chosen) b.classList.add('wrong'); else b.classList.add('dim'); });
  if(feedback) showFb(card, chosen===q.a, q);
}
function lockEC(card,q,idx,feedback){
  const toks = ecTokens(q), ok = !!(toks[idx]||{}).err;
  card.querySelectorAll('.tok').forEach((b,k)=>{ b.disabled=true; if(toks[k].err) b.classList.add('right'); else if(k===idx) b.classList.add('wrong'); });
  if(feedback) showFb(card, ok, q);
}
function lockText(card,q,val,feedback,selfOk,onSelf){
  const ok = selfOk || isRight(q,val);
  const inp = card.querySelector('.gap'); inp.value=val; inp.disabled=true; inp.classList.add(ok?'right':'wrong');
  if(q.t!=='tl') inp.style.width = Math.max(150, val.length*10+30)+'px';
  const a = card.querySelector('.qactions'); if(a) a.remove();
  if(feedback) showFb(card, ok, q, selfOk);
  if(!ok && onSelf && (q.t==='kw' || q.t==='tl')){
    const b = document.createElement('button'); b.className='linkbtn selfok'; b.textContent='Мой ответ тоже верный: засчитать';
    b.onclick = ()=>{ onSelf(); card.classList.remove('bad'); card.classList.add('ok'); inp.classList.remove('wrong'); inp.classList.add('right'); showFb(card,true,q,true); };
    card.querySelector('.fb').appendChild(b);
  }
}
function showFb(card, ok, q, self){
  card.classList.remove('ok','bad'); card.classList.add(ok?'ok':'bad');
  const fb = card.querySelector('.fb'); fb.classList.add('show');
  const head = ok ? `<strong style="color:var(--ok)">${self?'Засчитано (самопроверка).':'Верно.'}</strong> ` : `<strong style="color:var(--bad)">Не совсем.</strong> `;
  const ct = correctText(q);
  const model = (q.t==='ec' || q.t==='kw' || q.t==='tl' || !ok) ? `${ok?'Образец':'Правильно'}: <span class="ans">${esc(ct)}</span>${/[.?!]$/.test(ct)?' ':'. '}` : '';
  const more = q.t==='tl' && q.a.length>1 ? `<div class="alts">Другие варианты: ${q.a.slice(1,3).map(a=>esc(pretty(a,q))).join(' · ')}</div>` : '';
  fb.innerHTML = head + model + esc(q.e) + more;
}

function update(t){
  const r = store[t.id] || {}, g = gq(t), total = g.length || 1;
  const answered = g.filter(x=>x.i in r).length;
  const correct = g.filter(x=>r[x.i]===true).length;
  $('#sc').innerHTML = `${correct}<small> / ${g.length}</small>`;
  $('#tg').style.width = (correct/total*100)+'%';
  $('#tr').style.width = ((answered-correct)/total*100)+'%';
  const bl = $('#bandline');
  if(bl && t.texts){
    const sk = {}; const NAMES={L:'Listening',R:'Reading'};
    g.forEach(x=>{ const c = x.q.ctx && t.texts[x.q.ctx]; if(!c || !c.skill) return; const o = sk[c.skill] ||= {n:0,a:0,c:0}; o.n++; if(x.i in r) o.a++; if(r[x.i]===true) o.c++; });
    const parts = Object.entries(sk).map(([k,v])=> v.a<v.n ? `${NAMES[k]}: ${v.a}/${v.n} отвечено` : `${NAMES[k]} ≈ <b>Band ${bandOf(k, v.c/v.n)}</b>`);
    bl.innerHTML = parts.length ? 'Оценка по шкале IELTS: ' + parts.join(' · ') + ' <span class="hintx">(ориентировочно, пересчёт на 40 вопросов)</span>' : '';
  }
  const done = answered===g.length;
  $('#done').classList.toggle('show', done);
  if(done){
    const pct = correct/total;
    $('#doneArt').innerHTML = pct>=.6 ? mascot('cheer','m-done') : mascot('read','m-done');
    $('#doneTitle').textContent = pct>=.9 ? 'Отлично!' : pct>=.6 ? 'Хороший результат' : 'Стоит повторить теорию';
    const rb=$('#redoWrong'), nw=g.filter(x=>r[x.i]===false && !x.q.ctx).length; if(rb){ rb.style.display=nw?'':'none'; rb.textContent=`Повторить ошибки (${nw})`; }
    $('#doneText').textContent = `Вы ответили правильно на ${correct} из ${g.length}. ` + (pct<.6 ? 'Перечитайте разделы с ошибками и попробуйте снова.' : 'Можно переходить к следующей теме.');
  }
  renderSide();
}

/* ============ TEST BUILDER ============ */
builder.levels = new Set(LEVELS);
const qOk = q => builder.levels.has(q.l) && gradable(q) && !q.ctx;
const themeCount = t => t.quiz.filter(qOk).length;
function poolSize(){ return THEMES.filter(t=>builder.themes.has(t.id)).reduce((s,t)=>s+themeCount(t),0); }

let mixN = 10;
function practisedThemes(){ return THEMES.filter(t=>t.group!=='ielts' && gq(t).some(x=>x.i in (store[t.id]||{}))); }
function buildMix(n){
  const due = shuffle(srsItems()).slice(0, Math.ceil(n*0.3));
  const practised = practisedThemes();
  const pool = practised.length ? practised : THEMES.filter(t=>t.group!=='ielts');
  const weight = t=>{ const r=store[t.id]||{}, g=gq(t).filter(x=>x.i in r); if(!g.length) return 1; return 1 + (1 - g.filter(x=>r[x.i]===true).length/g.length)*3; };
  const used = new Set(due.map(d=>d.tid+'#'+d.i)), items=[...due];
  let guard=0;
  while(items.length<n && guard++<800){
    const tot = pool.reduce((s,t)=>s+weight(t),0); let x=Math.random()*tot, t=pool[pool.length-1];
    for(const p of pool){ x-=weight(p); if(x<=0){ t=p; break; } }
    const c = t.quiz.map((q,i)=>({q,i})).filter(o=>gradable(o.q) && !o.q.ctx && !used.has(t.id+'#'+o.i));
    if(!c.length) continue;
    const o = c[Math.floor(Math.random()*c.length)]; used.add(t.id+'#'+o.i); items.push({tid:t.id, q:o.q, i:o.i});
  }
  return shuffle(items);
}
function startTestWith(items, kind){
  if(!items.length) return;
  test = { items, answers: [], pos: 0, finished: false, kind, self:{} };
  if(mode!=='test') go('test'); else { renderTest(); window.scrollTo({top:0}); }
}

function refresh(){
  document.querySelectorAll('.lp').forEach(b=>{
    const l=b.dataset.l; b.classList.toggle('on', builder.levels.has(l));
    b.querySelector('span').textContent = THEMES.filter(t=>builder.themes.has(t.id)).reduce((s,t)=>s+t.quiz.filter(q=>q.l===l && gradable(q) && !q.ctx).length,0) + ' вопр.';
  });
  $('#pickGroups').innerHTML = GROUPS.map(g=>{
    const ts = THEMES.filter(t=>t.group===g.id);
    const sel = ts.filter(t=>builder.themes.has(t.id)).length;
    const state = sel===0?'':sel===ts.length?'on':'part';
    return `<div class="pgroup">
      <button class="pg-head ${state}" data-g="${g.id}"><span class="box"></span>${g.title}<span class="cn">${sel}/${ts.length}</span></button>
      <div class="pick">${ts.map(t=>{ const n=themeCount(t), on=builder.themes.has(t.id);
        return `<button class="pk ${on?'on':''} ${n?'':'empty'}" data-t="${t.id}">
          <span class="box"></span>
          <span class="pk-t">${t.title}<span>${t.ru} · ${n} вопр.</span></span>
        </button>`; }).join('')}</div></div>`;
  }).join('');
  document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{ const id=b.dataset.t; builder.themes.has(id)?builder.themes.delete(id):builder.themes.add(id); refresh(); });
  document.querySelectorAll('.pg-head').forEach(b=>b.onclick=()=>{
    const ts = THEMES.filter(t=>t.group===b.dataset.g); const all = ts.every(t=>builder.themes.has(t.id));
    ts.forEach(t=> all ? builder.themes.delete(t.id) : builder.themes.add(t.id)); refresh();
  });
  const pool = poolSize(), n = Math.min(builder.count, pool);
  $('#cnt').textContent = pool ? n : 0;
  $('#note').textContent = !builder.levels.size ? 'Выберите хотя бы один уровень.'
    : !builder.themes.size ? 'Выберите хотя бы одну тему.'
    : !pool ? 'В выбранных темах нет вопросов этого уровня.'
    : builder.count > pool ? `Подходящих вопросов всего ${pool}, поэтому в тесте будет ${pool}. Добавьте темы или уровни, чтобы получить больше.`
    : `В тесте ${n} вопросов из ${pool} подходящих.`;
  $('#sumline').textContent = pool ? `${builder.themes.size} ${builder.themes.size===1?'тема':builder.themes.size<5?'темы':'тем'} · ${[...builder.levels].sort().join(', ')} · ${n} вопр.` : '';
  $('#start').disabled = pool < 1;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startTest(){
  test = { items: makeCustomItems(), answers: [], pos: 0, finished: false, kind:'custom', self:{} };
  renderTest();
}
function makeCustomItems(){
  const chosen = THEMES.filter(t=>builder.themes.has(t.id));
  const pool = chosen.flatMap(t=>t.quiz.map((q,i)=>({tid:t.id,q,i})).filter(o=>qOk(o.q)));
  const n = Math.min(builder.count, pool.length);
  // spread questions evenly across chosen themes, then fill
  const buckets = chosen.map(t=>shuffle(pool.filter(p=>p.tid===t.id))).filter(b=>b.length);
  const items = [];
  while(items.length<n){ for(const b of buckets){ if(items.length<n && b.length) items.push(b.pop()); } }
  return shuffle(items);
}

function renderTest(){
  if(!test) return renderBuilder();
  if(test.finished) return renderSummary();
  const it = test.items[test.pos], q = it.q, total = test.items.length;
  $('#main').innerHTML = `<div class="fade">
    <div class="testbar">
      <span class="eyebrow">${test.kind==='review'?'Повторение · ':test.kind==='mix'?'Микс · ':test.kind==='theme'?'Работа над ошибками · ':''}Вопрос ${test.pos+1} из ${total}</span>
      <button class="linkbtn" id="quit">Выйти из теста</button>
    </div>
    <div class="track thin"><i class="g" style="width:${test.pos/total*100}%"></i></div>
    ${qHTML(q,0,'t',byId(it.tid).title)}
    <div class="testnav">
      <span class="note">Ответ можно изменить, пока не нажата кнопка «Далее». Клавиши: 1–4, Enter.</span>
      <button class="btn solid" id="nextq" disabled>${test.pos+1===total?'Завершить тест':'Далее →'}</button>
    </div>
  </div>`;
  const card = document.querySelector('.q'); const nb = $('#nextq');
  if(q.t==='mc'){
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      card.querySelectorAll('.opt').forEach(x=>x.classList.remove('picked')); b.classList.add('picked');
      test.answers[test.pos] = +b.dataset.o; nb.disabled=false;
    });
  } else if(q.t==='ec'){
    card.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{
      card.querySelectorAll('.tok').forEach(x=>x.classList.remove('picked')); b.classList.add('picked');
      test.answers[test.pos] = +b.dataset.w; nb.disabled=false;
    });
  } else {
    const qa = card.querySelector('.qactions'); if(qa) qa.remove();
    const inp = card.querySelector('.gap');
    inp.oninput = ()=>{ test.answers[test.pos] = inp.value; nb.disabled = !inp.value.trim(); };
    inp.onkeydown = e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(inp.value.trim()) nb.click(); } };
    setTimeout(()=>inp.focus(),50);
  }
  nb.onclick = ()=>{ test.pos++; if(test.pos>=total) test.finished=true; renderTest(); window.scrollTo({top:0}); };
  $('#quit').onclick = ()=>{ test=null; renderBuilder(); };
}

function renderSummary(){
  const items = test.items, total = items.length;
  test.self ||= {};
  const res = items.map((it,i)=>!!test.self[i] || isRight(it.q, test.answers[i]));
  if(!test.recorded){ items.forEach((it,i)=>{ if(it.i!==undefined) srsRecord(it.tid, it.i, res[i]); }); test.recorded = true; }
  const correct = res.filter(Boolean).length, pct = Math.round(correct/total*100);
  const per = {};
  items.forEach((it,i)=>{ (per[it.tid] ||= {c:0,n:0}); per[it.tid].n++; if(res[i]) per[it.tid].c++; });
  const lvl = {};
  items.forEach((it,i)=>{ (lvl[it.q.l] ||= {c:0,n:0}); lvl[it.q.l].n++; if(res[i]) lvl[it.q.l].c++; });
  const weak = Object.entries(per).filter(([,v])=>v.c/v.n<.7).map(([k])=>byId(k));
  const verdict = pct>=90?'Отличный результат':pct>=75?'Хороший результат':pct>=50?'Неплохо, но есть над чем поработать':'Стоит повторить теорию';
  const ans = (it,i)=>answerText(it.q, test.answers[i]);
  const right = it => correctText(it.q);

  $('#main').innerHTML = `<div class="fade">
    <div class="eyebrow">Итоги теста</div>
    <h1>${verdict}</h1>
    <div class="sumtop">
      <div class="ring" style="--p:${pct}"><div><b>${pct}%</b><span>${correct} из ${total}</span></div></div>
      <div class="sum-art">${pct>=75?mascot('cheer','m-sum'):mascot('read','m-sum')}</div>
      <div class="sumtxt">
        <p>Вы ответили правильно на <b>${correct}</b> из <b>${total}</b> вопросов по ${Object.keys(per).length} ${plural(Object.keys(per).length,'теме','темам','темам')}.</p>
        ${weak.length ? `<p>Стоит повторить: ${weak.map(t=>`<button class="tlink" data-t="${t.id}">${t.title}</button>`).join(', ')}.</p>` : '<p>Во всех темах больше 70% правильных ответов.</p>'}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>По темам</h3></div>
      ${Object.entries(per).map(([k,v])=>`<div class="bar-row">
        <span class="bl">${byId(k).title}</span>
        <span class="track"><i class="g" style="width:${v.c/v.n*100}%"></i></span>
        <span class="bv">${v.c}/${v.n}</span></div>`).join('')}
      <div class="panel-head" style="margin-top:22px"><h3>По уровням</h3></div>
      ${Object.keys(lvl).sort().map(k=>`<div class="bar-row">
        <span class="bl">${lvlPill(k)}</span>
        <span class="track"><i class="g" style="width:${lvl[k].c/lvl[k].n*100}%"></i></span>
        <span class="bv">${lvl[k].c}/${lvl[k].n}</span></div>`).join('')}
    </div>

    <div class="panel-head review-head"><h3>Разбор ответов</h3>
      <div class="row-s"><button class="chip on" data-f="all">Все</button><button class="chip" data-f="bad">Ошибки (${total-correct})</button></div>
    </div>
    <div id="review">${items.map((it,i)=>`
      <div class="rv ${res[i]?'ok':'bad'}">
        <div class="rv-h"><span class="mark">${res[i]?'✓':'✕'}</span><span class="qnum">${i+1} · ${byId(it.tid).title}</span>${lvlPill(it.q.l)}</div>
        <div class="rv-q">${esc(promptText(it.q)).split('___').join('<b class="blank">____</b>')}</div>
        <div class="rv-a">${res[i] ? `Ваш ответ: <span class="ans">${esc(ans(it,i))}</span>${test.self[i]?' (засчитано)':''}` : `Ваш ответ: <span class="wr">${esc(ans(it,i))}</span> · Правильно: <span class="ans">${esc(right(it))}</span>${(it.q.t==='kw'||it.q.t==='tl')?` <button class="linkbtn selfok" data-i="${i}">Мой ответ тоже верный</button>`:''}`}</div>
        <div class="rv-e">${esc(it.q.e)}</div>
      </div>`).join('')}</div>

    <div class="row" style="margin-top:28px">
      <button class="btn ghost" id="newt">Новый тест</button>
      <button class="btn solid" id="retry">${test.kind==='review'?'Повторить ещё':test.kind==='mix'?'Новый микс':test.kind==='theme'?'К теме':'Ещё раз с теми же темами'}</button>
    </div>
  </div>`;
  document.querySelectorAll('.chip[data-f]').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.toggle('on',x===c));
    document.querySelectorAll('.rv.ok').forEach(r=>r.style.display = c.dataset.f==='bad'?'none':'');
  });
  document.querySelectorAll('.tlink').forEach(b=>b.onclick=()=>go('theory',b.dataset.t));
  $('#newt').onclick = ()=>{ test=null; renderBuilder(); window.scrollTo({top:0}); };
  $('#retry').onclick = ()=>{
    if(test.kind==='review'){ const d=srsItems(); if(d.length) startTestWith(shuffle(d).slice(0,20),'review'); else { test=null; renderBuilder(); } }
    else if(test.kind==='mix') startTestWith(buildMix(mixN),'mix');
    else if(test.kind==='theme'){ const tid=test.items[0].tid; test=null; go('practice', tid); return; }
    else startTest();
    window.scrollTo({top:0}); };
  document.querySelectorAll('.selfok[data-i]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; test.self[i]=true; const it=test.items[i]; if(it.i!==undefined) srsRecord(it.tid,it.i,true); const y=scrollY; renderSummary(); window.scrollTo({top:y}); });
}
function plural(n,a,b,c){ return n===1?a:b; }

const NOW = 330;
function tl(items, cap){
  let g = '';
  items.forEach(it=>{
    if(it.t==='dot') g += `<circle class="tl-ev" cx="${it.x}" cy="62" r="7"/>${it.l?`<text class="tl-lb" x="${it.x}" y="${it.up?40:96}" text-anchor="middle">${it.l}</text>`:''}${it.n?`<text class="tl-n" x="${it.x}" y="66" text-anchor="middle">${it.n}</text>`:''}`;
    if(it.t==='rep') it.xs.forEach(x=> g += `<circle class="tl-ev" cx="${x}" cy="62" r="4.5"/>`);
    if(it.t==='bar') g += `<rect class="tl-bar" x="${it.a}" y="56" width="${it.b-it.a}" height="12" rx="6"/>`;
    if(it.t==='wave'){ let d=`M${it.a} 62`; for(let x=it.a; x<it.b; x+=12) d+=` q 3 -9 6 0 t 6 0`; g += `<path class="tl-wave" d="${d}"/>`; }
    if(it.t==='arc'){ const m=(it.a+it.b)/2, h=Math.min(46, (it.b-it.a)*.35+14); g += `<path class="tl-arc" d="M${it.a} 54 Q ${m} ${54-h} ${it.b-4} 52" marker-end="url(#tlArr)"/>${it.l?`<text class="tl-lb sm" x="${m}" y="${54-h-4}" text-anchor="middle">${it.l}</text>`:''}`; }
    if(it.t==='lab') g += `<text class="tl-lb" x="${it.x}" y="${it.y||96}" text-anchor="middle">${it.l}</text>`;
  });
  return `<figure class="tl"><svg viewBox="0 0 560 124" role="img" aria-label="Временная шкала">
    <defs><marker id="tlArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="tl-arrhead"/></marker></defs>
    <line class="tl-axis" x1="18" y1="62" x2="540" y2="62"/><path class="tl-axhead" d="M540 56 L550 62 L540 68 Z"/>
    <line class="tl-now" x1="${NOW}" y1="22" x2="${NOW}" y2="88"/><text class="tl-nowt" x="${NOW}" y="16" text-anchor="middle">сейчас</text>
    <text class="tl-end" x="20" y="120">прошлое</text><text class="tl-end" x="540" y="120" text-anchor="end">будущее</text>
    ${g}</svg>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
}

/* table → better format */
const VS_ARROW = [['Прямая речь','Косвенная речь'],['Обычная форма','С инверсией'],['Прямо','Мягче'],['Неформально','Формально'],['✗ Калька','✓ Правильно'],['Глагол / прил.','Существительное'],['Слово','Производное'],['Неисчисляемое','Исчисляемое']];
const DEF_COL2 = ['Значение','Перевод','Разница','Английские варианты','Хвостик','Когда','Пример','Фразы','Глаголы','Прилагательные','Предлог','Типичное требование','Как сказать «один»','Что проверяют','Как','Содержание','На чём сосредоточиться'];
function enhanceTables(root){
  root.querySelectorAll('.section table').forEach(tb=>{
    const ths=[...tb.querySelectorAll('tr:first-child th')].map(th=>th.textContent.trim());
    const rows=[...tb.querySelectorAll('tr')].slice(1).map(tr=>[...tr.children].map(td=>td.innerHTML));
    if(!ths.length || !rows.length) return;
    const n=ths.length;
    // 1) Rule cards: 3 columns, last is an example
    if(n===3 && /Пример/.test(ths[2]) && rows.every(r=>r.length===3)){
      const titleIdx = ths.findIndex(h=>/Форма|Конструкция|Выражение|Суффикс|Приставка|Тип/.test(h)); const ti = titleIdx>=0 ? titleIdx : 0; const ci = ti===0?1:0;
      tb.outerHTML = `<div class="rules">${rows.map(r=>`<div class="rule"><div class="rule-t">${r[ti]}</div><div class="rule-c"><span>${ths[ci]}:</span> ${r[ci]}</div><div class="rule-e">${r[2]}</div></div>`).join('')}</div>`;
      return;
    }
    // 2) Comparison: two alternatives side by side
    if(n===2 && !DEF_COL2.includes(ths[1]) && rows.every(r=>r.length===2)){
      const arrow = VS_ARROW.some(p=>p[0]===ths[0] && p[1]===ths[1]);
      tb.outerHTML = `<div class="vs ${arrow?'arrow':''}"><div class="vs-h a">${ths[0]}</div><div class="vs-mid h">${arrow?'→':'vs'}</div><div class="vs-h b">${ths[1]}</div>
        ${rows.map(r=>`<div class="vs-c a">${r[0]}</div><div class="vs-mid">${arrow?'→':''}</div><div class="vs-c b">${r[1]}</div>`).join('')}</div>`;
      return;
    }
    // 3) Glossary: term → meaning / list
    if(n===2 && rows.every(r=>r.length===2)){
      tb.outerHTML = `<dl class="gloss"><div class="gloss-h"><span>${ths[0]}</span><span>${ths[1]}</span></div>${rows.map(r=>`<div class="gl"><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}</dl>`;
      return;
    }
    // 4) Everything else stays a table, but stacks into cards on phones
    tb.classList.add('stack');
    tb.querySelectorAll('tr').forEach((tr,ri)=>{ if(!ri) return; [...tr.children].forEach((td,ci)=>{ if(ths[ci]) td.setAttribute('data-label', ths[ci]); }); });
  });
}

/* ============ RENDER ============ */
function render(){
  clearTimers();
  renderSide();
  if(mode==='test') return renderTest();
  const t = themeId && byId(themeId);
  if(!t) return renderOverview();
  mode==='theory' ? renderTheory(t) : renderPractice(t);
}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  if(b.dataset.mode==='test') return go('test');
  go(b.dataset.mode);
});
$('#themeBtn').onclick = ()=>{
  const t = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('pasha-theme', t); }catch(e){}
};
document.addEventListener('keydown', e=>{
  if(mode!=='test' || !test || test.finished) return;
  const tag = (document.activeElement||{}).tagName;
  if(tag==='INPUT' || tag==='TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  if(/^[1-6]$/.test(e.key)){ const o=document.querySelectorAll('.q .opt')[+e.key-1]; if(o){ o.click(); e.preventDefault(); } }
  else if(e.key==='Enter'){ const nb=$('#nextq'); if(nb && !nb.disabled){ e.preventDefault(); nb.click(); } }
});

.kwkey{display:inline-block;font-weight:700;letter-spacing:.08em;border:1px solid var(--ink);padding:0 6px;margin:3px 0}
.passage{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0 12px;font-size:12px;break-inside:auto}.passage p{margin:5px 0}.pl{font-weight:700;margin-right:5px}
.task{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0 12px;break-inside:avoid}.chart{max-width:480px;width:100%}
.chart text{fill:#555;font-size:11px}.chart .axis{stroke:#bbb}.chart .grid{stroke:#eee}.chart .s1{stroke:#3A2B20;fill:#3A2B20}.chart .s2{stroke:#6E855F;fill:#6E855F}.chart .s3{stroke:#B3C6A2;fill:#B3C6A2}.chart .ln{fill:none;stroke-width:2.5}.chart .bx{fill:#fff;stroke:#AFC1A0}.chart .ar{stroke:#8A6E58;stroke-width:1.6;fill:none;marker-end:url(#arw)}
.legend{font-size:11px;color:#555}.legend span{margin-right:12px}.legend i{display:inline-block;width:10px;height:10px;margin-right:4px}
.key{break-before:page}.key ol{column-count:2;column-gap:26px;margin-left:18px}.key li{break-inside:avoid;margin-bottom:5px}.key .e{color:var(--muted);font-size:11px}
.pbtn{position:fixed;top:14px;right:14px;background:#3A2B20;color:#FFFBEA;border:0;border-radius:99px;padding:9px 18px;font:inherit;font-size:13px;cursor:pointer}
@media print{.pbtn{display:none}body{padding:0}@page{margin:14mm}}`;
function printDoc(title, sub, body){
  return `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>${esc(title)}</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>${PRINT_CSS}</style></head><body><button class="pbtn" onclick="window.print()">Печать / сохранить в PDF</button>
<h1>${esc(title)}</h1><div class="sub">${sub} · English with Pasha</div>${body}</body></html>`;
}
const fileSafe = s => s.replace(/[^\wа-яА-ЯёЁ\- ]+/g,'').trim().replace(/\s+/g,'-');
async function saveFile(name, html){
  if(!DL){
    try{ const url=URL.createObjectURL(new Blob([html],{type:'text/html'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Файл скачан. Откройте его и нажмите «Печать».'); }
    catch(e){ toast('Скачивание недоступно в этом окне'); }
    return; }
  try{ await DL.save({filename:name, data:html}); toast('Файл сохранён. Откройте его и нажмите «Печать».'); }
  catch(e){ if(!e || e.code!=='declined') toast('Не удалось сохранить файл'); }
}
function downloadSheet(t){
  const body = `<div class="cols">${t.sections.map(s=>{
    const d=document.createElement('div'); d.innerHTML=s.html;
    const keep=[...d.children].filter(el=>el.matches('.formula,table,.ex,.ru,ul.use,h4'));
    return `<div class="blk"><h2>${s.h} <span class="lvl">${s.lvl}</span></h2>${keep.map(el=>el.outerHTML).join('')}</div>`; }).join('')}</div>`;
  saveFile(`Шпаргалка-${fileSafe(t.title)}.html`, printDoc('Шпаргалка: '+t.title, t.ru, body));
}
function printQ(q, n){
  const lv = `<span class="lvl">${q.l}</span>`;
  if(q.t==='mc') return `<div class="q"><span class="qn">${n}.</span>${esc(q.q).split('___').join('<span class="line"></span>')} ${lv}<div class="opts">${q.o.map((o,k)=>`<span>${'ABCDEF'[k]}) ${esc(o.replace(/^[A-F]\s\s/,''))}</span>`).join('')}</div></div>`;
  if(q.t==='gap') return `<div class="q"><span class="qn">${n}.</span>${esc(q.q).replace('___','<span class="line"></span>')} ${lv}</div>`;
  if(q.t==='kw') return `<div class="q"><span class="qn">${n}.</span>${esc(q.s1)} ${lv}<br><span class="kwkey">${esc(q.key)}</span><br>${esc(q.s2).replace('___','<span class="line" style="min-width:220px"></span>')}${q.ex?`<div class="sub">${q.ex}: ${KW_RANGE[q.ex]} слов, включая ключевое слово</div>`:''}</div>`;
  if(q.t==='ec') return `<div class="q"><span class="qn">${n}.</span>Найдите и исправьте ошибку: ${esc(q.s.replace(/[\[\]]/g,''))} ${lv}<div class="lines"></div></div>`;
  if(q.t==='tl') return `<div class="q"><span class="qn">${n}.</span>Переведите: ${esc(q.ru)} ${lv}<div class="lines"></div><div class="lines"></div></div>`;
  return '';
}
function keyLine(q){ return `<li><b>${esc(correctText(q))}</b> <span class="e">A: ${esc(q.e)}</span></li>`; }
function downloadWorksheet(t){
  let body='', n=0, prevCtx=null, prevPart=null; const keys=[], scripts=[];
  t.quiz.forEach(q=>{
    if(q.part && q.part!==prevPart){ body+=`<h3>${esc(q.part)}</h3>`; prevPart=q.part; }
    if(q.ctx && q.ctx!==prevCtx){ const c=t.texts[q.ctx];
      if(c.type==='read') body+=`<h2>${c.title}</h2><div class="passage">${c.html}</div>`;
      else { body+=`<h2>${c.title}</h2><p class="sub">${c.intro||''} Запись есть на сайте, текст записи в конце, в ответах.</p>`; scripts.push(`<h3>${c.title}</h3>`+c.lines.map(l=>`<p><b>${l.v==='W'?'Woman':l.v==='M'?'Man':l.n||'Speaker'}:</b> ${esc(l.t)}</p>`).join('')); } }
    prevCtx = q.ctx||null;
    if(gradable(q)){ n++; body+=printQ(q,n); keys.push(keyLine(q)); }
    else if(q.t==='write') body+=`<div class="task"><b>${q.title}</b> · ${q.min}+ слов · ${q.time} мин${q.prompt}<div class="lines"></div><div class="lines"></div><div class="lines"></div><div class="lines"></div></div>`;
    else if(q.t==='speak') body+=`<div class="task"><b>${q.title}</b>${q.prompt}</div>`;
  });
  body += `<div class="key"><h2>Ответы</h2><ol>${keys.join('')}</ol>${scripts.length?'<h2>Тексты записей</h2>'+scripts.join(''):''}</div>`;
  saveFile(`Задания-${fileSafe(t.title)}.html`, printDoc('Задания: '+t.title, t.ru, body));
}
function downloadTest(items, title){
  const body = items.map((it,k)=>printQ(it.q,k+1)).join('') + `<div class="key"><h2>Ответы</h2><ol>${items.map(it=>keyLine(it.q)).join('')}</ol></div>`;
  const themes=[...new Set(items.map(it=>byId(it.tid).title))];
  saveFile(`${title}-${items.length}-вопросов.html`, printDoc(`${title}: ${items.length} вопросов`, themes.slice(0,6).join(', ')+(themes.length>6?` и ещё ${themes.length-6}`:''), body));
}

$('#brandHome').onkeydown = e=>{ if(e.key==='Enter') go('theory', null); };

document.body.insertAdjacentHTML('afterbegin', CRAYON_DEFS);
readHash(); render(); updateBadge();
