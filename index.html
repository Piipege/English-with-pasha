<script>
/* ============ CONTENT ============ */
const THEMES = [
/* ---------------- PAST ---------------- */
{
id:'past', title:'Past Tenses', ru:'Прошедшие времена', levels:['B1','B2','C1'],
lead:'В русском одно прошедшее время и два вида глагола. В английском выбор зависит от другого: закончено ли действие, длилось ли оно в фоне и что произошло раньше чего.',
sections:[
{h:'Past Simple', lvl:'B1', html:`
<p>Законченное действие или состояние в конкретный момент прошлого. Основное время для рассказа о последовательности событий.</p>
<div class="formula"><b>V2</b> / <b>did</b> + V &nbsp;·&nbsp; didn’t + V &nbsp;·&nbsp; Did … + V?</div>
<h4>Маркеры</h4>
<p>yesterday, last week, in 2019, two years ago, when…?, then, after that</p>
<div class="ex">
<div>She <mark>moved</mark> to Lisbon in 2021 and <mark>opened</mark> a café.</div>
<div>When <mark>did</mark> you <mark>finish</mark> the report?</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>Если указано <b>законченное</b> время в прошлом (ago, last year, вопрос <i>when?</i>), Present Perfect невозможен.</p><p><span style="color:var(--bad)">✗ I have seen him yesterday.</span> → <span style="color:var(--ok)">✓ I saw him yesterday.</span></p></div></div>
`},
{h:'Past Continuous', lvl:'B1', html:`
<p>Действие <b>в процессе</b> в определённый момент прошлого. Создаёт фон, на котором происходит короткое событие.</p>
<div class="formula"><b>was / were</b> + V-ing</div>
<ul class="use">
<li>Процесс в момент прошлого: <i>At 8 p.m. I was having dinner.</i></li>
<li>Прерванное действие: <i>I was cooking when the phone rang.</i></li>
<li>Параллельные процессы: <i>While she was reading, he was watching TV.</i></li>
<li>Фон в рассказе: <i>The sun was shining and birds were singing.</i></li>
</ul>
<div class="ru"><span class="tag">RU</span><div><p>Несовершенный вид ≠ Continuous. «Я читал эту книгу»: это опыт или факт, а не процесс.</p><p><span style="color:var(--bad)">✗ I was reading this book, it’s great.</span> → <span style="color:var(--ok)">✓ I’ve read / I read this book.</span></p></div></div>
`},
{h:'Past Perfect', lvl:'B2', html:`
<p>«Предпрошедшее»: действие, которое произошло <b>раньше</b> другого момента или действия в прошлом.</p>
<div class="formula"><b>had</b> + V3</div>
<div class="ex">
<div>By the time we arrived, the film <mark>had</mark> already <mark>started</mark>.</div>
<div>She realised she <mark>had left</mark> her passport at home.</div>
<div><em>Сравните:</em> When I arrived, she <mark>left</mark>. (сначала я пришёл, потом она ушла) / When I arrived, she <mark>had left</mark>. (она ушла до моего прихода)</div>
</div>
<p>С <i>after / before</i> Past Perfect часто необязателен, если последовательность и так ясна: <i>After he (had) finished, he went home.</i></p>
`},
{h:'Past Perfect Continuous', lvl:'B2', html:`
<p>Длительное действие, продолжавшееся <b>до</b> момента в прошлом. Часто объясняет причину ситуации в прошлом.</p>
<div class="formula"><b>had been</b> + V-ing</div>
<div class="ex">
<div>She was exhausted because she <mark>had been working</mark> all night.</div>
<div>We <mark>had been waiting</mark> for over an hour when the bus finally came.</div>
</div>
`},
{h:'used to / would', lvl:'B2', html:`
<p>Привычки и состояния в прошлом, которых больше нет. Русское «раньше…», «бывало…».</p>
<table><tr><th></th><th>Действия</th><th>Состояния</th></tr>
<tr><td><b>used to</b></td><td>✓ I used to play tennis.</td><td>✓ I used to live in Kazan.</td></tr>
<tr><td><b>would</b></td><td>✓ Every summer we would go to the sea.</td><td>✗ I would live in Kazan.</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p>Не путайте три конструкции:</p><p><b>used to do</b>: раньше делал · <b>be used to doing</b>: привык · <b>get used to doing</b>: привыкаю/привыкнуть.</p><p><i>I’m used to getting up early</i> = Я привык рано вставать.</p></div></div>
`},
{h:'Прошедшее для вежливости', lvl:'C1', c:true, html:`
<p>Прошедшие формы «отдаляют» просьбу и делают её мягче, хотя речь о настоящем.</p>
<div class="ex">
<div>I <mark>was wondering</mark> if you could help me.</div>
<div><mark>Did</mark> you <mark>want</mark> to see me?</div>
<div>I <mark>was hoping</mark> we could talk about my salary.</div>
</div>
`}
],
quiz:[
{t:'mc', q:'I ___ him at the conference two years ago.', o:['have met','met','had met','was meeting'], a:1, e:'«Two years ago»: законченное время в прошлом → Past Simple.', l:'B1'},
{t:'mc', q:'While I ___ dinner, the lights suddenly went out.', o:['cooked','had cooked','was cooking','have been cooking'], a:2, e:'Длительный процесс (фон), прерванный коротким действием → Past Continuous.', l:'B1'},
{t:'gap', q:'When we got to the station, the train ___ (already / leave).', a:['had already left'], e:'Поезд ушёл до нашего прихода → Past Perfect: had already left.', l:'B2'},
{t:'mc', q:'Choose the incorrect sentence.', o:['We used to live near the sea.','We would live near the sea.','We would swim every morning.','We used to swim every morning.'], a:1, e:'«Would» для прошлых привычек используется только с действиями, не с состояниями (live, have, know).', l:'B2'},
{t:'gap', q:'His eyes were red. He ___ (cry) for hours.', a:['had been crying',"'d been crying"], e:'Длительное действие до момента в прошлом, объясняющее видимый результат → Past Perfect Continuous.', l:'B2'},
{t:'mc', q:'It took me months to get used to ___ on the left.', o:['drive','driving','drove','have driven'], a:1, e:'После get / be used to стоит герундий (-ing), потому что to здесь предлог.', l:'B2'},
{t:'mc', q:'She was nervous because she ___ in public before.', o:['never spoke','was never speaking','had never spoken','has never spoken'], a:2, e:'Опыт до момента в прошлом → Past Perfect.', l:'B2'},
{t:'gap', q:'I ___ (wonder) if you could give me a hand with this.', a:['was wondering'], e:'Past Continuous делает просьбу вежливее и мягче.', l:'C1'},
{t:'mc', q:'By the time the police arrived, the thieves ___.', o:['escaped','have escaped','had escaped','were escaping'], a:2, e:'«By the time» + прошлое: действие завершилось раньше → Past Perfect.', l:'B2'},
{t:'mc', q:'When I was a child, my grandmother ___ me stories every night.', o:['would tell','was telling','had told','has told'], a:0, e:'Повторяющееся действие в прошлом → would (или used to).', l:'B2'}
]
},

/* ---------------- PERFECT ---------------- */
{
id:'perfect', title:'Perfect Tenses', ru:'Перфектные времена', levels:['B1','B2','C1','C2'],
lead:'Перфект связывает два момента времени: действие в прошлом и его значение сейчас (или к другой точке). В русском такой формы нет, поэтому здесь больше всего ошибок.',
sections:[
{h:'Present Perfect', lvl:'B1', html:`
<p>Прошлое действие, важное <b>сейчас</b>: результат, опыт или период, который ещё не закончился.</p>
<div class="formula"><b>have / has</b> + V3</div>
<ul class="use">
<li>Результат сейчас: <i>I’ve lost my keys.</i> (их до сих пор нет)</li>
<li>Опыт в жизни: <i>Have you ever been to Japan?</i></li>
<li>Незаконченный период: <i>I’ve drunk three coffees today.</i></li>
<li>С for / since: <i>We’ve known each other since school.</i></li>
</ul>
<h4>Маркеры</h4>
<p>ever, never, already, yet, just, so far, recently, lately, this week, for, since</p>
`},
{h:'Present Perfect или Past Simple', lvl:'B2', html:`
<table><tr><th>Present Perfect</th><th>Past Simple</th></tr>
<tr><td>Время не указано или не закончилось</td><td>Время закончилось</td></tr>
<tr><td>I’ve seen this film. (опыт)</td><td>I saw this film last week.</td></tr>
<tr><td>Have you seen Anna this morning? (ещё утро)</td><td>Did you see Anna this morning? (уже день)</td></tr>
<tr><td>She has written four novels. (жива, пишет)</td><td>Tolstoy wrote many novels.</td></tr></table>
<p>Сначала новость сообщают в Present Perfect, а детали в Past Simple: <i>A: I’ve broken my arm! B: How did it happen? A: I fell off my bike.</i></p>
`},
{h:'Present Perfect Continuous', lvl:'B2', html:`
<p>Действие, которое началось в прошлом и продолжается до сих пор (или только что закончилось). Важен процесс и длительность.</p>
<div class="formula"><b>have / has been</b> + V-ing</div>
<div class="ex">
<div>I <mark>’ve been waiting</mark> for an hour.</div>
<div>A: Why are you out of breath? B: I <mark>’ve been running</mark>.</div>
<div><em>Сравните:</em> I’ve been writing emails all morning. (процесс) / I’ve written ten emails. (результат, количество)</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>Главная ошибка: «Я живу здесь пять лет» передаётся не через Present Simple.</p><p><span style="color:var(--bad)">✗ I live here for five years.</span> → <span style="color:var(--ok)">✓ I’ve lived / I’ve been living here for five years.</span></p><p>Глаголы состояния (know, be, like, own) в Continuous не ставятся: ✓ <i>I’ve known her for years.</i></p></div></div>
`},
{h:'Future Perfect и Future Perfect Continuous', lvl:'C1', c:true, html:`
<p>Взгляд из будущего назад: что будет <b>завершено</b> или как долго что-то будет длиться к определённому моменту.</p>
<div class="formula"><b>will have</b> + V3 &nbsp;·&nbsp; <b>will have been</b> + V-ing</div>
<div class="ex">
<div>By 2030, I <mark>will have paid off</mark> my mortgage.</div>
<div>Next June, I <mark>’ll have been working</mark> here for ten years.</div>
<div>Don’t call at 7, we <mark>won’t have finished</mark> dinner.</div>
</div>
<p>Ключевой маркер: <b>by</b> + время: by then, by the end of the year, by the time you arrive.</p>
`},
{h:'Модальные глаголы с перфектом', lvl:'C1', c:true, html:`
<p>Модальный глагол + <b>have + V3</b>: оценка или сожаление о прошлом.</p>
<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td>must have done</td><td>наверняка сделал</td><td>She must have forgotten.</td></tr>
<tr><td>can’t have done</td><td>не может быть, что сделал</td><td>He can’t have seen us.</td></tr>
<tr><td>might / could have done</td><td>возможно, сделал</td><td>They might have got lost.</td></tr>
<tr><td>should have done</td><td>следовало сделать (но нет)</td><td>You should have told me.</td></tr>
<tr><td>needn’t have done</td><td>сделал зря</td><td>You needn’t have brought food.</td></tr></table>
<p><b>needn’t have done</b> (сделал, хотя не было нужно) ≠ <b>didn’t need to do</b> (не было нужно, обычно и не делал).</p>
`},
{h:'It’s the first time…', lvl:'C2', c:true, html:`
<p>После <i>It’s the first / second / best… time</i> и превосходной степени (<i>the best… I’ve ever…</i>) используется перфект.</p>
<div class="ex">
<div class="no">✗ It’s the first time I am in London.</div>
<div class="yes">✓ It’s the first time I’ve been to London.</div>
<div>It was the first time she <mark>had driven</mark> abroad. (сдвиг в прошлое → Past Perfect)</div>
<div>That’s the best meal I’<mark>ve</mark> ever <mark>had</mark>.</div>
</div>
`}
],
quiz:[
{t:'mc', q:'I ___ here since 2019.', o:['live','am living','have lived','lived'], a:2, e:'С since/for действие продолжается до сих пор → Present Perfect (или Perfect Continuous), а не Present Simple.', l:'B1'},
{t:'mc', q:'Shakespeare ___ about 39 plays.', o:['has written','wrote','has been writing','had written'], a:1, e:'Автор умер, период закрыт → Past Simple.', l:'B2'},
{t:'gap', q:'You look tired. ___ (you / work) all day?', a:['have you been working'], e:'Процесс до настоящего момента с видимым результатом → Have you been working…?', l:'B2', hint:'Используйте вопросительную форму с подлежащим you'},
{t:'mc', q:'Choose the correct sentence.', o:['I have been knowing her for ages.','I know her for ages.','I have known her for ages.','I am knowing her for ages.'], a:2, e:'«Know»: глагол состояния, в Continuous не используется → I have known.', l:'B2'},
{t:'gap', q:'By the end of this month, I ___ (finish) the project.', a:['will have finished',"'ll have finished"], e:'«By» + момент в будущем, действие будет завершено → Future Perfect.', l:'C1'},
{t:'mc', q:'The streets are wet. It ___ in the night.', o:['should have rained','must have rained','needn’t have rained','can’t have rained'], a:1, e:'Логический вывод с уверенностью о прошлом → must have + V3.', l:'C1'},
{t:'mc', q:'It’s the first time I ___ sushi.', o:['try','am trying','have tried','tried'], a:2, e:'После «It’s the first time» используется Present Perfect.', l:'C2'},
{t:'mc', q:'We took a taxi, but we ___, the station was just around the corner.', o:['didn’t need to hurry','needn’t have taken one','mustn’t have taken one','shouldn’t take one'], a:1, e:'Действие совершили, но в нём не было необходимости → needn’t have done.', l:'C1'},
{t:'gap', q:'Next year, they ___ (be) married for twenty-five years.', a:['will have been',"'ll have been"], e:'Длительность к моменту в будущем; be является глаголом состояния → Future Perfect: will have been.', l:'C1'},
{t:'mc', q:'A: I’ve cut my finger! B: Oh no, how ___ it?', o:['have you done','did you do','had you done','have you been doing'], a:1, e:'Новость: Present Perfect, а подробности (как, когда): Past Simple.', l:'B2'}
]
},

/* ---------------- FUTURE ---------------- */
{
id:'future', title:'Future Forms', ru:'Способы выразить будущее', levels:['B1','B2','C1'],
lead:'Будущего времени в английском как одной формы нет: есть набор конструкций, и выбор зависит от того, когда принято решение, насколько оно твёрдое и есть ли расписание.',
sections:[
{h:'will', lvl:'B1', html:`
<p>Решение в момент речи, предсказание-мнение, обещание, предложение помощи.</p>
<div class="formula"><b>will</b> + V</div>
<div class="ex">
<div>A: The phone’s ringing. B: I<mark>’ll get</mark> it. (решил сейчас)</div>
<div>I think she<mark>’ll</mark> love the present. (мнение)</div>
<div>I <mark>won’t tell</mark> anyone, I promise.</div>
</div>
`},
{h:'be going to', lvl:'B1', html:`
<p>Намерение, решённое <b>заранее</b>, и предсказание по видимым признакам.</p>
<div class="formula"><b>am / is / are going to</b> + V</div>
<div class="ex">
<div>I<mark>’m going to</mark> apply for a master’s next year. (план)</div>
<div>Look at those clouds, it<mark>’s going to</mark> rain. (вижу признаки)</div>
</div>
`},
{h:'Present Continuous и Present Simple', lvl:'B1', html:`
<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td>Present Continuous</td><td>договорённость, есть время и место</td><td>I’m meeting Tom at six.</td></tr>
<tr><td>Present Simple</td><td>расписание, программа</td><td>The train leaves at 7:15.</td></tr></table>
`},
{h:'Придаточные времени и условия', lvl:'B2', html:`
<p>После <b>when, if, as soon as, until, before, after, once, unless</b> будущее выражается настоящим временем.</p>
<div class="ex">
<div class="no">✗ I’ll call you when I will arrive.</div>
<div class="yes">✓ I’ll call you when I arrive.</div>
<div class="yes">✓ I won’t leave until you have finished.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>В русском «когда приеду»: будущее, поэтому рука тянется написать <i>will</i>. Нельзя.</p><p>Исключение: если <i>when/if</i> вводит дополнение («ли»), will возможен: <i>I don’t know if he will come.</i> = Не знаю, придёт <b>ли</b> он.</p></div></div>
`},
{h:'Future Continuous', lvl:'B2', html:`
<p>Процесс в определённый момент будущего, а также вежливый вопрос о планах.</p>
<div class="formula"><b>will be</b> + V-ing</div>
<div class="ex">
<div>This time tomorrow I<mark>’ll be lying</mark> on a beach.</div>
<div><mark>Will</mark> you <mark>be using</mark> the car tonight? (не прошу прямо, просто уточняю)</div>
</div>
`},
{h:'Будущее в прошлом и формальные конструкции', lvl:'C1', c:true, html:`
<table><tr><th>Конструкция</th><th>Значение</th><th>Пример</th></tr>
<tr><td>was going to</td><td>собирался (но не сделал)</td><td>I was going to call you, but I forgot.</td></tr>
<tr><td>would</td><td>будущее с позиции прошлого</td><td>She said she would help.</td></tr>
<tr><td>be about to</td><td>вот-вот</td><td>The show is about to start.</td></tr>
<tr><td>be on the verge / point of</td><td>на грани</td><td>They are on the verge of signing.</td></tr>
<tr><td>be to + V</td><td>официальный план (новости)</td><td>The Prime Minister is to visit Delhi.</td></tr>
<tr><td>be due to</td><td>ожидается по графику</td><td>The plane is due to land at noon.</td></tr></table>
`}
],
quiz:[
{t:'mc', q:'A: We’ve run out of milk. B: Really? I ___ some.', o:['’m going to buy','’ll buy','buy','’m buying'], a:1, e:'Решение принято в момент речи → will.', l:'B1'},
{t:'mc', q:'Watch out! That glass ___ fall.', o:['will','is going to','falls','is falling to'], a:1, e:'Предсказание по видимым признакам → be going to.', l:'B1'},
{t:'mc', q:'I’ll text you as soon as I ___ home.', o:['will get','get','am getting','would get'], a:1, e:'После «as soon as» будущее выражается Present Simple.', l:'B2'},
{t:'gap', q:'Our flight ___ (depart) at 6:40 tomorrow morning.', a:['departs'], e:'Расписание → Present Simple.', l:'B1'},
{t:'mc', q:'I’m ___ my sister for lunch on Saturday, we booked a table.', o:['going to meet','meeting','meet','will meet'], a:1, e:'Конкретная договорённость (столик забронирован) → Present Continuous. «Going to meet» тоже возможно, но Present Continuous естественнее для договорённостей.', l:'B1'},
{t:'gap', q:'This time next week I ___ (fly) to Bali.', a:['will be flying',"'ll be flying"], e:'Процесс в конкретный момент будущего → Future Continuous.', l:'B2'},
{t:'mc', q:'I don’t know if she ___ the job offer.', o:['accepts','will accept','accepted','is accepting to'], a:1, e:'Здесь «if» = «ли» (дополнительное придаточное), поэтому will возможен.', l:'B2'},
{t:'mc', q:'The new bridge ___ be opened by the mayor on Friday.', o:['is to','is about','will to','is due'], a:0, e:'Официальный план → be to + V. «Is due» требует «to»: is due to be opened.', l:'C1'},
{t:'gap', q:'I ___ (go) to call you, but my battery died.', a:['was going'], e:'Намерение в прошлом, которое не осуществилось → was going to.', l:'C1'},
{t:'mc', q:'Hurry up! The film is ___ start.', o:['about to','on the verge to','due','going'], a:0, e:'«Be about to»: вот-вот произойдёт.', l:'B2'}
]
},

/* ---------------- CONDITIONALS ---------------- */
{
id:'conditionals', title:'Conditionals', ru:'Условные предложения', levels:['B1','B2','C1','C2'],
lead:'Русское «если бы» охватывает и настоящее, и прошлое. В английском время в условии сдвигается на шаг назад, и это показывает, насколько ситуация нереальна.',
sections:[
{h:'Zero и First Conditional', lvl:'B1', html:`
<table><tr><th>Тип</th><th>Схема</th><th>Пример</th></tr>
<tr><td>Zero: общие истины</td><td>If + Present, Present</td><td>If you heat ice, it melts.</td></tr>
<tr><td>First: реальное будущее</td><td>If + Present, will + V</td><td>If it rains, we’ll stay in.</td></tr></table>
<p>Вместо <i>will</i> в главной части возможны модальные глаголы и повелительное наклонение: <i>If you see her, tell her to call me.</i></p>
`},
{h:'Second Conditional', lvl:'B1', html:`
<p>Нереальное или маловероятное настоящее и будущее.</p>
<div class="formula">If + <b>Past Simple</b>, <b>would</b> + V</div>
<div class="ex">
<div>If I <mark>had</mark> more time, I <mark>would learn</mark> Italian.</div>
<div>If I <mark>were</mark> you, I<mark>’d</mark> accept the offer.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>Русское «бы» стоит в обеих частях, а английское <i>would</i>: только в главной.</p><p><span style="color:var(--bad)">✗ If I would have money…</span> → <span style="color:var(--ok)">✓ If I had money…</span></p></div></div>
`},
{h:'Third Conditional', lvl:'B2', html:`
<p>Нереальное прошлое: представляем, что было бы иначе.</p>
<div class="formula">If + <b>Past Perfect</b>, <b>would have</b> + V3</div>
<div class="ex">
<div>If we <mark>had left</mark> earlier, we <mark>wouldn’t have missed</mark> the train.</div>
<div>She <mark>might have passed</mark> if she <mark>had studied</mark> harder.</div>
</div>
`},
{h:'Mixed Conditionals', lvl:'C1', c:true, html:`
<table><tr><th>Связь</th><th>Пример</th></tr>
<tr><td>Прошлое → настоящее</td><td>If I <b>had taken</b> that job, I <b>would be</b> rich now.</td></tr>
<tr><td>Настоящее (постоянное) → прошлое</td><td>If I <b>weren’t</b> so shy, I <b>would have spoken</b> to her yesterday.</td></tr></table>
`},
{h:'Альтернативы if', lvl:'C1', c:true, html:`
<ul class="use">
<li><b>unless</b> = if not: <i>You won’t pass unless you study.</i></li>
<li><b>provided / providing (that), as long as</b> = при условии: <i>You can borrow it as long as you return it.</i></li>
<li><b>suppose / supposing</b> = а что если: <i>Supposing you lost your job, what would you do?</i></li>
<li><b>otherwise</b> = иначе: <i>Hurry, otherwise we’ll be late.</i></li>
<li><b>but for / without</b> + сущ.: <i>But for your help, I would have failed.</i></li>
</ul>
`},
{h:'Инверсия', lvl:'C2', c:true, html:`
<p>Формальный стиль: <i>if</i> убирается, вспомогательный глагол выходит вперёд.</p>
<div class="ex">
<div><mark>Should</mark> you need any help, please contact us. (= If you should need)</div>
<div><mark>Were</mark> I in your position, I would resign. (= If I were)</div>
<div><mark>Were</mark> she <mark>to</mark> find out, she’d be furious. (= If she found out)</div>
<div><mark>Had</mark> I known, I would have come. (= If I had known)</div>
</div>
<p>Отрицание без сокращения: <i>Had I not seen it…</i> (не ✗ Hadn’t I seen it…).</p>
`},
{h:'wish / if only', lvl:'B2', html:`
<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td>wish + Past Simple</td><td>сожаление о настоящем</td><td>I wish I lived closer.</td></tr>
<tr><td>wish + Past Perfect</td><td>сожаление о прошлом</td><td>I wish I hadn’t said that.</td></tr>
<tr><td>wish + would</td><td>раздражение, желание, чтобы <i>другой</i> изменился</td><td>I wish you would stop interrupting.</td></tr></table>
<p><span style="color:var(--bad)">✗ I wish I would…</span> (о себе так не говорят), лучше ✓ <i>I wish I could…</i></p>
`}
],
quiz:[
{t:'mc', q:'If I ___ you, I would talk to her.', o:['am','was being','were','would be'], a:2, e:'Second Conditional; классическая форма: If I were you.', l:'B1'},
{t:'gap', q:'If she ___ (know) about the meeting, she would have come.', a:['had known',"'d known"], e:'Третий тип: нереальное прошлое → If + Past Perfect.', l:'B2'},
{t:'mc', q:'If I had saved money last year, I ___ on holiday now.', o:['would have been','will be','would be','had been'], a:2, e:'Mixed: условие в прошлом, результат сейчас («now») → would + V.', l:'C1'},
{t:'mc', q:'You can use my laptop ___ you’re careful with it.', o:['unless','as long as','otherwise','in case'], a:1, e:'«При условии, что» → as long as / provided that.', l:'C1'},
{t:'gap', q:'___ I known you were coming, I would have baked a cake. (одно слово)', a:['had'], e:'Инверсия в третьем типе: Had I known = If I had known.', l:'C2'},
{t:'mc', q:'I wish I ___ so rude to him yesterday.', o:['wasn’t','wouldn’t be','hadn’t been','haven’t been'], a:2, e:'Сожаление о прошлом → wish + Past Perfect.', l:'B2'},
{t:'mc', q:'___ you require further information, please do not hesitate to contact us.', o:['Should','Would','Were','Had'], a:0, e:'Формальная инверсия First Conditional: Should you require = If you require.', l:'C2'},
{t:'mc', q:'Choose the correct sentence.', o:['If I would have a car, I would drive.','If I had a car, I would drive.','If I have a car, I would drive.','If I had a car, I will drive.'], a:1, e:'Second Conditional: If + Past Simple, would + V. «Would» в условной части не ставится.', l:'B1'},
{t:'gap', q:'I wish you ___ (stop) leaving dirty dishes in the sink!', a:['would stop',"'d stop"], e:'Раздражение из-за поведения другого человека → wish + would.', l:'B2'},
{t:'mc', q:'If he weren’t so stubborn, he ___ the mistake last week.', o:['would admit','would have admitted','had admitted','admitted'], a:1, e:'Mixed: постоянная черта характера (настоящее) → результат в прошлом → would have + V3.', l:'C1'}
]
},

/* ---------------- PASSIVE ---------------- */
{
id:'passive', title:'Passive & Causative', ru:'Пассив и каузатив', levels:['B1','B2','C1','C2'],
lead:'В русском пассив часто передаётся неопределённо-личным «мне сказали», «здесь строят». В английском в таких случаях почти всегда нужен пассив.',
sections:[
{h:'Формы пассива', lvl:'B1', html:`
<div class="formula"><b>be</b> (в нужном времени) + V3</div>
<table><tr><th>Время</th><th>Пример</th></tr>
<tr><td>Present Simple</td><td>English is spoken here.</td></tr>
<tr><td>Present Continuous</td><td>The road is being repaired.</td></tr>
<tr><td>Past Simple</td><td>The bridge was built in 1890.</td></tr>
<tr><td>Present Perfect</td><td>The contract has been signed.</td></tr>
<tr><td>Past Perfect</td><td>The room had been cleaned.</td></tr>
<tr><td>Modals</td><td>It must be done today. / It should have been done.</td></tr></table>
`},
{h:'Когда нужен пассив', lvl:'B2', html:`
<ul class="use">
<li>Исполнитель неизвестен или не важен: <i>My bike was stolen.</i></li>
<li>Важнее объект, чем исполнитель: <i>Penicillin was discovered by Fleming.</i></li>
<li>Формальный, научный, новостной стиль: <i>The results were analysed.</i></li>
</ul>
<div class="ru"><span class="tag">RU</span><div><p>«Мне сказали / дали / предложили» → в английском подлежащим становится человек.</p><p><span style="color:var(--bad)">✗ To me was said…</span> → <span style="color:var(--ok)">✓ I was told…</span> · ✓ <i>I was offered a job.</i></p></div></div>
`},
{h:'Глаголы с предлогом', lvl:'B2', html:`
<p>Предлог остаётся после глагола.</p>
<div class="ex">
<div>The children <mark>are being looked after</mark> by their aunt.</div>
<div>This issue <mark>will be dealt with</mark> tomorrow.</div>
<div>He hates <mark>being laughed at</mark>.</div>
</div>
`},
{h:'Безличный пассив', lvl:'C1', c:true, html:`
<p>Для передачи мнений и слухов: «говорят», «считается», «полагают».</p>
<table><tr><th>Конструкция</th><th>Пример</th></tr>
<tr><td>It is said / believed / thought that…</td><td>It is believed that the painting is genuine.</td></tr>
<tr><td>Sb is said to + V</td><td>He is said to be a millionaire.</td></tr>
<tr><td>Sb is said to + have V3 (прошлое)</td><td>She is believed to have left the country.</td></tr>
<tr><td>Sb is said to be + V-ing (процесс)</td><td>They are thought to be negotiating.</td></tr></table>
`},
{h:'Каузатив: have / get something done', lvl:'B2', html:`
<p>Кто-то делает что-то <b>для нас</b> (обычно за плату) или с нами случилось что-то неприятное.</p>
<div class="formula"><b>have / get</b> + объект + V3</div>
<div class="ex">
<div>I <mark>had my hair cut</mark> yesterday. (меня подстригли, а не я сам)</div>
<div>We need to <mark>get the boiler fixed</mark>.</div>
<div>She <mark>had her bag stolen</mark> on the metro. (неприятный опыт)</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>«Я подстригся» по-английски чаще всего <i>I had my hair cut</i>, а не <i>I cut my hair</i>: иначе получится, что вы стриглись сами.</p></div></div>
<h4>С человеком</h4>
<p><b>have sb do</b>: <i>I’ll have my assistant send it.</i> · <b>get sb to do</b>: <i>I got him to fix it.</i></p>
`},
{h:'Пассивные инфинитивы и герундии', lvl:'C2', c:true, html:`
<div class="ex">
<div>I hate <mark>being interrupted</mark>.</div>
<div>He expects <mark>to be promoted</mark> soon.</div>
<div>She denied <mark>having been told</mark> about it.</div>
<div>The windows need <mark>cleaning</mark>. = The windows need <mark>to be cleaned</mark>.</div>
</div>
`}
],
quiz:[
{t:'mc', q:'The Mona Lisa ___ by Leonardo da Vinci.', o:['painted','was painted','has painted','is painting'], a:1, e:'Прошлое событие, исполнитель с by → Past Simple Passive.', l:'B1'},
{t:'gap', q:'Sorry about the noise, our kitchen ___ (renovate) at the moment.', a:['is being renovated'], e:'Процесс сейчас + пассив → is being + V3.', l:'B2'},
{t:'mc', q:'Choose the correct translation of «Мне предложили новую должность».', o:['To me was offered a new position.','I was offered a new position.','Me was offered a new position.','It was offered me a new position.'], a:1, e:'В английском подлежащим пассива становится человек: I was offered…', l:'B2'},
{t:'mc', q:'I ___ my car serviced every year.', o:['make','have','let','do'], a:1, e:'Каузатив have something done: кто-то делает это для меня.', l:'B2'},
{t:'gap', q:'The suspect is believed ___ (leave) the country last night.', a:['to have left'], e:'Действие в прошлом относительно «is believed» → перфектный инфинитив: to have left.', l:'C1'},
{t:'mc', q:'The patients are being ___ by a team of nurses.', o:['looked','looked after','look after','looking after'], a:1, e:'Предлог фразового глагола остаётся при глаголе в пассиве: looked after.', l:'B2'},
{t:'mc', q:'It ___ that the company will cut 500 jobs.', o:['is reported','reports','is reporting','has reported'], a:0, e:'Безличный пассив: It is reported that…', l:'C1'},
{t:'gap', q:'She had her phone ___ (steal) while she was on holiday.', a:['stolen'], e:'Have something done может означать и неприятный опыт: had her phone stolen.', l:'B2'},
{t:'mc', q:'Nobody likes ___ what to do.', o:['telling','being told','to tell','be told'], a:1, e:'После like в значении «нравиться»: герундий; смысл пассивный (кому-то говорят) → being told.', l:'C2'},
{t:'mc', q:'I finally got the plumber ___ the leak.', o:['fix','fixed','to fix','fixing'], a:2, e:'get sb TO do sth (уговорить или заставить кого-то сделать), а have sb do: без to.', l:'C1'}
]
},

/* ---------------- REPORTED SPEECH ---------------- */
{
id:'reported', title:'Reported Speech', ru:'Косвенная речь', levels:['B1','B2','C1'],
lead:'В русском при пересказе время не меняется: «Он сказал, что устал». В английском после глагола в прошедшем времени всё «сдвигается» на шаг в прошлое, а вопросы теряют вопросительный порядок слов.',
sections:[
{h:'Сдвиг времён (backshift)', lvl:'B1', html:`
<p>Если глагол сообщения стоит в прошедшем времени (<i>said, told, asked</i>), время в придаточном сдвигается назад.</p>
<table><tr><th>Прямая речь</th><th>Косвенная речь</th></tr>
<tr><td>Present Simple: “I <b>work</b> here.”</td><td>Past Simple: he said he <b>worked</b> there.</td></tr>
<tr><td>Present Continuous: “I’<b>m leaving</b>.”</td><td>Past Continuous: she said she <b>was leaving</b>.</td></tr>
<tr><td>Past Simple / Present Perfect, “I <b>saw</b> / <b>have seen</b> it.”</td><td>Past Perfect: he said he <b>had seen</b> it.</td></tr>
<tr><td>will: “I’<b>ll</b> call.”</td><td>would: she said she <b>would</b> call.</td></tr>
<tr><td>can / may: “I <b>can</b> help.”</td><td>could / might: he said he <b>could</b> help.</td></tr>
<tr><td>must: “You <b>must</b> go.”</td><td>must / had to, she said I <b>had to</b> go.</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p>«Она сказала, что <b>живёт</b> в Москве» → <i>She said she <b>lived</b> in Moscow.</i></p><p>Русское настоящее время при пересказе: главный источник ошибок.</p></div></div>
`},
{h:'Когда время не сдвигается', lvl:'B2', html:`
<ul class="use">
<li>Глагол сообщения в настоящем: <i>He says he is busy.</i></li>
<li>Факт всё ещё верен (сдвиг возможен, но не обязателен): <i>She told me she lives / lived in Riga.</i></li>
<li>Общие истины: <i>The teacher said water boils at 100°C.</i></li>
<li>Модальные would, could, should, might, ought to не меняются.</li>
</ul>
`},
{h:'Слова времени и места', lvl:'B1', html:`
<table><tr><th>Прямая речь</th><th>Косвенная речь</th></tr>
<tr><td>now · today · tonight</td><td>then · that day · that night</td></tr>
<tr><td>tomorrow</td><td>the next day / the following day</td></tr>
<tr><td>yesterday</td><td>the day before / the previous day</td></tr>
<tr><td>next week · last week</td><td>the following week · the week before</td></tr>
<tr><td>ago</td><td>before / earlier</td></tr>
<tr><td>here · this · these</td><td>there · that · those</td></tr></table>
<p>Если пересказываете в тот же день и в том же месте, менять не нужно.</p>
`},
{h:'say или tell', lvl:'B1', html:`
<div class="ex">
<div class="yes">✓ She <mark>said</mark> (that) she was tired. · She <mark>said to me</mark> that…</div>
<div class="yes">✓ She <mark>told me</mark> (that) she was tired.</div>
<div class="no">✗ She said me… · ✗ She told that…</div>
</div>
<p>После <b>tell</b> нужен человек, после <b>say</b>: нет (или <i>to</i> + человек).</p>
`},
{h:'Косвенные вопросы', lvl:'B1', html:`
<p>В косвенном вопросе <b>прямой порядок слов</b> и нет do/does/did. Вопросы «да/нет» вводятся словами <b>if / whether</b>.</p>
<div class="ex">
<div>“Where <b>do you live</b>?” → He asked me where <mark>I lived</mark>.</div>
<div>“<b>Are you</b> ready?” → She asked <mark>if / whether I was</mark> ready.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ He asked where was I.</span> · <span style="color:var(--bad)">✗ She asked did I like it.</span></p><p><span style="color:var(--ok)">✓ He asked where I was.</span> · <span style="color:var(--ok)">✓ She asked if I liked it.</span></p><p>То же в вежливых вопросах: <i>Could you tell me where the station <b>is</b>?</i></p></div></div>
`},
{h:'Просьбы и приказы', lvl:'B2', html:`
<div class="formula"><b>tell / ask / order</b> + sb + (<b>not</b>) <b>to</b> + V</div>
<div class="ex">
<div>“Sit down.” → She told me <mark>to sit</mark> down.</div>
<div>“Please don’t be late.” → He asked us <mark>not to be</mark> late.</div>
</div>
`},
{h:'Глаголы сообщения', lvl:'C1', c:true, html:`
<p>Вместо <i>said</i> на продвинутом уровне используют точные глаголы. У каждого своя конструкция.</p>
<table><tr><th>Конструкция</th><th>Глаголы</th><th>Пример</th></tr>
<tr><td>+ to do</td><td>agree, offer, promise, refuse, threaten</td><td>He refused to help.</td></tr>
<tr><td>+ sb + to do</td><td>advise, warn, remind, encourage, persuade</td><td>She reminded me to call.</td></tr>
<tr><td>+ -ing</td><td>deny, admit, suggest, recommend</td><td>He denied taking it.</td></tr>
<tr><td>+ предлог + -ing</td><td>apologise for, insist on, accuse sb of, blame sb for</td><td>She accused him of lying.</td></tr>
<tr><td>+ that (sb) should</td><td>suggest, recommend, insist</td><td>I suggested that we (should) leave.</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ He suggested me to go.</span> → <span style="color:var(--ok)">✓ He suggested going / that I (should) go.</span></p></div></div>
`}
],
quiz:[
{t:'mc', q:'“I am tired,” she said. → She said she ___ tired.', o:['is','was','has been','will be'], a:1, e:'Глагол сообщения в прошедшем → Present Simple сдвигается в Past Simple.', l:'B1'},
{t:'gap', q:'“I will call you.” → He promised he ___ (call) me.', a:['would call',"'d call"], e:'will → would.', l:'B1'},
{t:'mc', q:'He asked me where ___.', o:['did I live','I lived','do I live','I did live'], a:1, e:'В косвенном вопросе прямой порядок слов и нет did: where I lived.', l:'B1'},
{t:'mc', q:'“Have you finished?” → She asked ___ I had finished.', o:['that','if','did','what'], a:1, e:'Вопрос «да/нет» в косвенной речи вводится словом if или whether.', l:'B1'},
{t:'gap', q:'“Don’t touch it!” → She told the kids ___ (not / touch) it.', a:['not to touch'], e:'Отрицательный приказ: tell sb not to do.', l:'B2'},
{t:'mc', q:'He suggested ___ a taxi.', o:['us to take','to take us','taking','we taking'], a:2, e:'suggest + -ing или suggest that we (should) take. Конструкции suggest sb to do не существует.', l:'C1'},
{t:'mc', q:'“I’ll see you tomorrow,” she said last Monday. → She said she would see me ___.', o:['tomorrow','the next day','the day before','yesterday'], a:1, e:'Пересказ в другой день: tomorrow → the next day / the following day.', l:'B1'},
{t:'mc', q:'She ___ me that she was leaving.', o:['said','told','spoke','talked'], a:1, e:'После tell сразу идёт человек; said me: ошибка (said to me).', l:'B1'},
{t:'gap', q:'“I didn’t take the money.” → He denied ___ (take) the money.', a:['taking','having taken'], e:'deny + -ing (или перфектный герундий having taken).', l:'C1'},
{t:'mc', q:'The teacher explained that the Earth ___ around the Sun.', o:['goes','had gone','has gone','would go'], a:0, e:'Это общая истина, поэтому время можно не сдвигать: goes (went тоже возможно).', l:'B2'},
{t:'mc', q:'“You broke my phone!” → She accused me ___ her phone.', o:['to break','of breaking','for breaking','that I broke'], a:1, e:'accuse sb of doing sth.', l:'C1'},
{t:'gap', q:'“Can you help me?” → He asked me if I ___ help him.', a:['could'], e:'can → could.', l:'B1'}
]
},

/* ---------------- INVERSION ---------------- */
{
id:'inversion', title:'Inversion', ru:'Инверсия', levels:['B2','C1','C2'],
lead:'Инверсия: вспомогательный глагол перед подлежащим в утвердительном предложении. Она делает речь эмфатичной и формальной и часто встречается в C1/C2-экзаменах и академических текстах.',
sections:[
{h:'Как устроена инверсия', lvl:'C1', c:true, html:`
<p>Когда предложение начинается с отрицательного или ограничительного наречия, порядок слов становится вопросительным.</p>
<div class="formula">Наречие + <b>вспомогательный глагол</b> + подлежащее + основной глагол</div>
<div class="ex">
<div>I have never seen such chaos. → <mark>Never have I seen</mark> such chaos.</div>
<div>She rarely complains. → <mark>Rarely does she</mark> complain.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>В русском порядок слов свободный: «Никогда я не видел…». В английском без вспомогательного глагола нельзя.</p><p><span style="color:var(--bad)">✗ Never I have seen…</span> · <span style="color:var(--bad)">✗ Rarely she complains.</span></p><p>Если вспомогательного нет, добавляем do / does / did.</p></div></div>
`},
{h:'Отрицательные наречия', lvl:'C1', c:true, html:`
<table><tr><th>Выражение</th><th>Пример</th></tr>
<tr><td>Never (before) · Rarely · Seldom</td><td>Seldom do we get such an opportunity.</td></tr>
<tr><td>Little</td><td>Little did he know what was coming.</td></tr>
<tr><td>Under no circumstances · On no account</td><td>On no account must you tell her.</td></tr>
<tr><td>At no time · In no way</td><td>At no time was the public in danger.</td></tr>
<tr><td>Nowhere</td><td>Nowhere else will you find such prices.</td></tr></table>
`},
{h:'Hardly / No sooner', lvl:'C1', c:true, html:`
<p>«Едва… как»: одно событие сразу за другим. Обычно Past Perfect.</p>
<div class="ex">
<div><mark>Hardly / Scarcely had</mark> I sat down <b>when</b> the phone rang.</div>
<div><mark>No sooner had</mark> we arrived <b>than</b> it started to rain.</div>
</div>
<p>Запомните пары: <b>hardly / scarcely … when</b>, <b>no sooner … than</b>.</p>
`},
{h:'Not until / Only…', lvl:'C1', c:true, html:`
<p>Инверсия стоит в <b>главной</b> части предложения, а не сразу после <i>until / when</i>.</p>
<div class="ex">
<div><mark>Not until</mark> I got home <mark>did I realise</mark> my phone was gone.</div>
<div><mark>Only when</mark> she left <mark>did we understand</mark> how much she did.</div>
<div><mark>Only after</mark> / <mark>Only by</mark> / <mark>Only then</mark> / <mark>Only in this way</mark> + инверсия</div>
<div><mark>Not only did</mark> he arrive late, <b>but</b> he <b>also</b> forgot the tickets.</div>
</div>
`},
{h:'So / Such', lvl:'C2', c:true, html:`
<div class="ex">
<div><mark>So</mark> difficult <mark>was the exam</mark> that half the students failed.</div>
<div><mark>Such was</mark> the noise that we couldn’t sleep.</div>
</div>
<p>С <b>so</b> идёт прилагательное или наречие, а с <b>such</b>: сразу глагол be.</p>
`},
{h:'Условные предложения', lvl:'C1', c:true, html:`
<table><tr><th>Обычная форма</th><th>С инверсией</th></tr>
<tr><td>If you should need help…</td><td><b>Should</b> you need help…</td></tr>
<tr><td>If I were rich…</td><td><b>Were</b> I rich…</td></tr>
<tr><td>If she found out…</td><td><b>Were</b> she <b>to</b> find out…</td></tr>
<tr><td>If I had known…</td><td><b>Had</b> I known…</td></tr></table>
<p>Подробнее: в теме «Conditionals».</p>
`},
{h:'Другие случаи', lvl:'B2', html:`
<ul class="use">
<li><b>So / Neither / Nor</b>: «я тоже»: <i>A: I love jazz. B: So do I.</i> · <i>A: I can’t swim. B: Neither can I.</i></li>
<li><b>Наречия места и направления</b>: инвертируется <i>основной</i> глагол, без do: <i>Here comes the bus. · Down came the rain. · On the hill stood an old castle.</i></li>
<li>С местоимением инверсии нет: <i>Here it comes.</i> (не ✗ Here comes it)</li>
</ul>
`}
],
quiz:[
{t:'mc', q:'Never ___ such a beautiful sunset.', o:['I have seen','have I seen','I saw','seen I have'], a:1, e:'После Never в начале предложения нужна инверсия: have I seen.', l:'C1'},
{t:'gap', q:'No sooner ___ (we / sit) down than the phone rang.', a:['had we sat'], e:'No sooner + Past Perfect с инверсией … than.', l:'C1'},
{t:'mc', q:'Not until I got home ___ that I had lost my wallet.', o:['I realised','did I realise','I did realise','realised I'], a:1, e:'После Not until… инверсия стоит в главной части: did I realise.', l:'C1'},
{t:'mc', q:'Hardly had the match started ___ it began to rain.', o:['than','when','that','then'], a:1, e:'Пара hardly … when (no sooner … than).', l:'C1'},
{t:'mc', q:'Under no circumstances ___ the door to strangers.', o:['you should open','should you open','you open','open you'], a:1, e:'Under no circumstances + инверсия: should you open.', l:'C1'},
{t:'gap', q:'Little ___ (she / know) that her life was about to change.', a:['did she know'], e:'Little = «совсем не»; вспомогательного нет → did she know.', l:'C1'},
{t:'mc', q:'Not only ___ late, but he also forgot the tickets.', o:['he was','was he','he has been','did he be'], a:1, e:'Not only + инверсия; с be вспомогательный не нужен: was he.', l:'C1'},
{t:'mc', q:'So loud ___ that we couldn’t hear each other.', o:['the music was','was the music','did the music','the music is'], a:1, e:'So + прилагательное + инверсия: So loud was the music that…', l:'C2'},
{t:'mc', q:'___ the risks, I would never have agreed.', o:['Had I known','If I knew','Did I know','Have I known'], a:0, e:'Инверсия в третьем типе условных: Had I known = If I had known.', l:'C1'},
{t:'mc', q:'Only by working together ___ this problem.', o:['we can solve','can we solve','we solve','solve we can'], a:1, e:'Only by… + инверсия: can we solve.', l:'C1'},
{t:'mc', q:'A: I can’t swim.: ___', o:['Neither I can.','Neither can I.','So can’t I.','Nor I can.'], a:1, e:'Согласие с отрицанием: Neither / Nor + вспомогательный + подлежащее.', l:'B2'},
{t:'gap', q:'On top of the hill ___ (stand) an old castle. (Past Simple)', a:['stood'], e:'После обстоятельства места инвертируется сам глагол, без did: …stood an old castle.', l:'C2'}
]
}
];

/* ---------------- CLEFT ---------------- */
{
id:'cleft', title:'Cleft Sentences & Fronting', ru:'Выделение и вынесение вперёд', levels:['C1','C2'],
lead:'В русском мы выделяем главное интонацией или словом «именно». В английском порядок слов жёстче, поэтому для выделения используют особые конструкции: It was… that…, What I need is…, Strange as it may seem…',
sections:[
{h:'It-cleft', lvl:'C1', c:true, html:`
<div class="formula"><b>It + be</b> + выделяемая часть + <b>who / that</b> + остальное</div>
<div class="ex">
<div>Tom broke the window. → <mark>It was Tom who</mark> broke the window. (а не кто-то другой)</div>
<div><mark>It was in Paris that</mark> we first met.</div>
<div><mark>It wasn’t until</mark> 2010 <mark>that</mark> I started learning English.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>«Именно Том разбил окно» → <i>It was Tom who broke the window.</i> Дословное <span style="color:var(--bad)">✗ Exactly Tom broke…</span> звучит неестественно.</p></div></div>
`},
{h:'Wh-cleft и All…', lvl:'C1', c:true, html:`
<div class="formula"><b>What</b> + подлежащее + глагол + <b>is / was</b> + выделяемая часть</div>
<div class="ex">
<div><mark>What I need is</mark> a long holiday.</div>
<div><mark>What happened was (that)</mark> the car broke down.</div>
<div><mark>What she did was</mark> (to) call the police.</div>
<div><mark>All I want is</mark> some peace and quiet. (= единственное, что я хочу)</div>
<div><mark>The reason (why)</mark> I called <mark>is</mark> to apologise. · <mark>The place where</mark> we met <mark>was</mark> a café.</div>
</div>
`},
{h:'Fronting: Strange as it may seem', lvl:'C2', c:true, html:`
<p>Прилагательное, наречие или глагол выносится вперёд со словом <b>as</b> или <b>though</b>. Значение: «хотя».</p>
<table><tr><th>Конструкция</th><th>Пример</th></tr>
<tr><td>Adj + as + S + V</td><td>Strange as it may seem, he’s never left his town.</td></tr>
<tr><td>Much as + S + V</td><td>Much as I admire him, I can’t agree.</td></tr>
<tr><td>Try as + S + might</td><td>Try as I might, I couldn’t open the jar.</td></tr>
<tr><td>Дополнение вперёд</td><td>That I can’t accept. · This question we’ll discuss later.</td></tr></table>
`}
],

{t:'gap', q:'___ I need is a long holiday. (одно слово)', a:['what'], e:'Wh-cleft: What I need is…', l:'C1'},
{t:'mc', q:'It wasn’t until midnight ___ they arrived.', o:['when','that','which','then'], a:1, e:'It wasn’t until … that …: устойчивая конструкция.', l:'C1'},
{t:'mc', q:'What she did ___ call the police.', o:['is','was','did','has'], a:1, e:'В wh-cleft глагол be согласуется по времени: What she did was (to) call…', l:'C1'},
{t:'mc', q:'Much ___ I admire him, I can’t agree with this decision.', o:['though','as','so','like'], a:1, e:'Much as = хотя (и очень). Fronting с as.', l:'C2'},

{t:'mc', q:'The reason ___ I called is to apologise.', o:['why','because','for','what'], a:0, e:'The reason why / that … is …', l:'C1'},

},

/* ---------------- SUBJUNCTIVE ---------------- */
{
id:'subjunctive', title:'Subjunctive & Unreal Past', ru:'Сослагательное наклонение', levels:['B2','C1','C2'],
lead:'Русское «чтобы он пришёл», «пора бы уже», «лучше бы ты не…» в английском передаётся особыми формами: базовой формой глагола (subjunctive) или прошедшим временем для нереального настоящего.',
sections:[
{h:'Present subjunctive', lvl:'C1', c:true, html:`
<p>После глаголов и прилагательных требования, совета и важности: <i>insist, demand, suggest, recommend, request, essential, vital, important</i>.</p>
<div class="formula">that + подлежащее + <b>базовая форма</b> (без -s, без времени)</div>
<div class="ex">
<div>It is vital that he <mark>be</mark> informed immediately.</div>
<div>She insisted that he <mark>leave</mark>. (не leaves / left)</div>
<div>They recommended that the meeting <mark>not be</mark> postponed.</div>
</div>
<p>В британском английском часто используют <b>should</b>: <i>She insisted that he should leave.</i></p>
<div class="ru"><span class="tag">RU</span><div><p>«Она настояла, чтобы он ушёл» → <span style="color:var(--bad)">✗ …that he will leave / left</span> → <span style="color:var(--ok)">✓ …that he leave / should leave.</span></p></div></div>
`},
{h:'It’s (high) time', lvl:'B2', html:`
<div class="ex">
<div>It’s time <mark>we left</mark>. (= нам пора; Past Simple, хотя речь о настоящем)</div>
<div>It’s high time you <mark>found</mark> a job. (давно пора: с упрёком)</div>
<div>It’s time <mark>to leave</mark>. (без подлежащего: инфинитив)</div>
</div>
`},
{h:'would rather / would sooner', lvl:'B2', html:`
<table><tr><th>Ситуация</th><th>Форма</th><th>Пример</th></tr>
<tr><td>То же лицо</td><td>would rather + V</td><td>I’d rather stay at home.</td></tr>
<tr><td>Другое лицо, настоящее</td><td>would rather + S + Past</td><td>I’d rather you didn’t smoke here.</td></tr>
<tr><td>Другое лицо, прошлое</td><td>would rather + S + Past Perfect</td><td>I’d rather you hadn’t told her.</td></tr></table>
`},
{h:'as if / as though, suppose', lvl:'C1', c:true, html:`
<div class="ex">
<div>He talks <mark>as if he knew</mark> everything. (но он не знает: нереально)</div>
<div>It looks <mark>as if it’s going</mark> to rain. (вполне возможно: обычное время)</div>
<div><mark>Suppose / Imagine</mark> you <mark>lost</mark> your job: what would you do?</div>
</div>
`},
{h:'Устойчивые выражения', lvl:'C2', c:true, html:`
<p><i>Be that as it may</i> (как бы то ни было) · <i>Come what may</i> (что бы ни случилось) · <i>So be it</i> (быть по сему) · <i>Long live…</i> (да здравствует) · <i>Suffice it to say</i> (достаточно сказать) · <i>God save the King</i>.</p>
`}
],
quiz:[
{t:'mc', q:'It’s high time you ___ a job.', o:['find','found','will find','have found'], a:1, e:'It’s (high) time + подлежащее + Past Simple.', l:'B2'},
{t:'mc', q:'The doctor recommended that she ___ more rest.', o:['gets','get','got','will get'], a:1, e:'После recommend that нужна базовая форма (subjunctive): she get.', l:'C1'},
{t:'gap', q:'I’d rather you ___ (not / tell) anyone about this.', a:["didn't tell",'did not tell'], e:'would rather + другое лицо + Past Simple (о настоящем/будущем).', l:'C1'},
{t:'mc', q:'I’d rather ___ at home tonight.', o:['stay','stayed','to stay','staying'], a:0, e:'То же лицо → would rather + инфинитив без to.', l:'B2'},
{t:'mc', q:'He behaves as if he ___ the boss, but he’s just an intern.', o:['is being','were','be','has been'], a:1, e:'Нереальная ситуация после as if → were / was.', l:'C1'},
{t:'mc', q:'It is essential that every student ___ the form by Friday.', o:['submits','submit','submitted','will submit'], a:1, e:'It is essential that + базовая форма.', l:'C1'},
{t:'gap', q:'I’d rather you ___ (not / say) that to her yesterday.', a:["hadn't said",'had not said'], e:'would rather + другое лицо + Past Perfect: о прошлом.', l:'C1'},
{t:'mc', q:'___ that as it may, we still need a decision.', o:['Be','Being','Is','Were'], a:0, e:'Устойчивое выражение: Be that as it may.', l:'C2'},
{t:'mc', q:'They demanded that the manager ___ dismissed.', o:['is','be','was','will be'], a:1, e:'demand that + базовая форма; в пассиве: be dismissed.', l:'C1'},
{t:'mc', q:'Suppose you ___ the lottery, what would you do?', o:['win','won','will win','would win'], a:1, e:'Suppose + Past Simple: воображаемая ситуация.', l:'B2'}
]
},

/* ---------------- MODALS ---------------- */
{
id:'modals', title:'Modals in Depth', ru:'Модальные глаголы: глубже', levels:['B2','C1','C2'],
lead:'На продвинутом уровне модальные глаголы: это шкала уверенности и оттенки обязанности. Русское «должно быть», «вряд ли», «наверняка» передаётся разными формами.',
sections:[
{h:'Степени уверенности', lvl:'B2', html:`
<table><tr><th>Уверенность</th><th>Форма</th><th>Пример</th></tr>
<tr><td>~100%</td><td>must / can’t</td><td>She must be at home. · He can’t be serious.</td></tr>
<tr><td>Уверенное предположение</td><td>will / won’t</td><td>That’ll be the postman.</td></tr>
<tr><td>Ожидание</td><td>should / ought to</td><td>They should be here by now.</td></tr>
<tr><td>Вполне вероятно</td><td>may well / might well / could well</td><td>You may well be right.</td></tr>
<tr><td>Возможно</td><td>may / might / could</td><td>It might rain later.</td></tr></table>
`},
{h:'bound to, likely to, sure to', lvl:'C1', c:true, html:`
<div class="ex">
<div>She’s <mark>bound to</mark> win: she’s the best. (наверняка)</div>
<div>Prices are <mark>likely to</mark> rise. · He’s <mark>unlikely to</mark> come.</div>
<div>There’s <mark>bound to be</mark> a problem.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ He will probably to come.</span> · <span style="color:var(--bad)">✗ It is likely that he will to come.</span></p><p><span style="color:var(--ok)">✓ He is likely to come.</span> · <span style="color:var(--ok)">✓ He will probably come.</span></p></div></div>
`},
{h:'Обязанность: оттенки', lvl:'B2', html:`
<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td>must</td><td>внутреннее убеждение, правило</td><td>I must call Mum.</td></tr>
<tr><td>have to</td><td>внешняя необходимость</td><td>I have to wear a uniform.</td></tr>
<tr><td>mustn’t</td><td>нельзя</td><td>You mustn’t smoke here.</td></tr>
<tr><td>don’t have to</td><td>не обязательно</td><td>You don’t have to come.</td></tr>
<tr><td>be supposed to</td><td>предполагается (но часто не делается)</td><td>We’re supposed to start at 9.</td></tr>
<tr><td>had better</td><td>лучше бы (предупреждение)</td><td>You’d better not be late.</td></tr></table>
`},
{h:'could или was able to', lvl:'B2', html:`
<p>Для <b>однократного успеха</b> в прошлом используют <i>was able to / managed to</i>, а не <i>could</i>.</p>
<div class="ex">
<div class="no">✗ After three hours, I could fix the car.</div>
<div class="yes">✓ After three hours, I was able to / managed to fix the car.</div>
<div class="yes">✓ I couldn’t fix it. (в отрицании could можно)</div>
<div class="yes">✓ When I was five, I could swim. (общая способность)</div>
</div>
`},
{h:'will / would для привычек', lvl:'C1', c:true, html:`
<div class="ex">
<div>He <mark>will</mark> leave his socks everywhere! (раздражающая привычка, will под ударением)</div>
<div>She <mark>would</mark> say that, wouldn’t she? (типично для неё)</div>
<div>Boys <mark>will</mark> be boys.</div>
</div>
`}
],
quiz:[
{t:'mc', q:'Don’t worry, they ___ be here soon, the traffic is light today.', o:['should','must','can','need'], a:0, e:'Ожидание → should.', l:'B2'},
{t:'mc', q:'You ___ wear a suit, it’s a casual party.', o:['mustn’t','don’t have to','can’t','shouldn’t to'], a:1, e:'Не обязательно → don’t have to. Mustn’t = запрещено.', l:'B2'},
{t:'mc', q:'After hours of trying, I ___ open the door.', o:['could','was able to','can','might'], a:1, e:'Однократный успех в прошлом → was able to / managed to.', l:'B2'},
{t:'gap', q:'Take an umbrella. It ___ (bound) rain later.', a:['is bound to',"'s bound to"], e:'be bound to = наверняка.', l:'C1'},
{t:'mc', q:'A: Someone’s at the door. B: That ___ be the courier.', o:['will','shall','may to','ought'], a:0, e:'will для уверенного предположения о настоящем.', l:'C1'},
{t:'mc', q:'We’re ___ to submit the essay today, but nobody has finished it.', o:['supposed','bound','likely','able'], a:0, e:'be supposed to: так предполагается (но не делается).', l:'B2'},
{t:'mc', q:'You’d better ___ late again.', o:['not be','not to be','don’t be','be not'], a:0, e:'had better (not) + инфинитив без to.', l:'B2'},
{t:'mc', q:'She ___ well be right, I hadn’t thought of that.', o:['may','must','can','should'], a:0, e:'may well = вполне возможно.', l:'C1'},
{t:'mc', q:'He ___ leave the lights on all the time! It drives me mad.', o:['will','shall','must','can'], a:0, e:'Раздражающая привычка → will (с ударением).', l:'C1'},
{t:'mc', q:'Prices are ___ to rise next year, according to experts.', o:['likely','probably','possible','sure that'], a:0, e:'be likely to + V.', l:'C1'}
]
},

/* ---------------- PARTICIPLE CLAUSES ---------------- */
{
id:'participle', title:'Participle Clauses', ru:'Причастные обороты', levels:['B2','C1','C2'],
lead:'Причастные обороты делают текст плотнее и формальнее. Они похожи на русские деепричастные обороты, и правило то же: подлежащее оборота и главного предложения должно совпадать.',
sections:[
{h:'Present participle (-ing)', lvl:'B2', html:`
<p>Одновременное действие или причина. Активное значение.</p>
<div class="ex">
<div><mark>Walking</mark> home, I met an old friend. (= когда я шёл)</div>
<div><mark>Feeling</mark> tired, she went to bed early. (= так как она устала)</div>
<div>People <mark>living</mark> near the airport complain about noise. (= who live)</div>
</div>
`},
{h:'Past participle (V3)', lvl:'B2', html:`
<p>Пассивное значение.</p>
<div class="ex">
<div><mark>Built</mark> in 1889, the Eiffel Tower was meant to be temporary.</div>
<div><mark>Asked</mark> about the scandal, he refused to comment.</div>
<div>If <mark>stored</mark> correctly, the cheese will last for months.</div>
</div>
`},
{h:'Perfect participle', lvl:'C1', c:true, html:`
<p>Действие произошло <b>раньше</b> основного.</p>
<div class="formula"><b>Having</b> + V3 &nbsp;·&nbsp; <b>Having been</b> + V3 (пассив)</div>
<div class="ex">
<div><mark>Having finished</mark> the report, she went home.</div>
<div><mark>Having been warned</mark> about the risks, they still went.</div>
</div>
`},
{h:'Отрицание и союзы', lvl:'C1', c:true, html:`
<div class="ex">
<div><mark>Not knowing</mark> what to say, he stayed silent. (not стоит перед причастием)</div>
<div><mark>After leaving</mark> school, she travelled for a year.</div>
<div><mark>Since moving</mark> to Lisbon, I’ve learned Portuguese.</div>
<div><mark>When/If/Unless/Once</mark> + V3: <i>Once opened, use within 3 days.</i></div>
</div>
`},
{h:'Висячее причастие', lvl:'C1', c:true, html:`
<div class="ex">
<div class="no">✗ Walking down the street, the rain started. (дождь шёл по улице?)</div>
<div class="yes">✓ Walking down the street, I got caught in the rain.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>Это та же ошибка, что и в чеховском «Подъезжая к сией станции… у меня слетела шляпа». Подлежащее главного предложения должно выполнять действие причастия.</p></div></div>
`},
{h:'Абсолютная конструкция', lvl:'C2', c:true, html:`
<p>У оборота своё подлежащее. Книжный стиль.</p>
<div class="ex">
<div><mark>The weather being</mark> fine, we had a picnic.</div>
<div><mark>All things considered</mark>, it was a success.</div>
<div><mark>With the exams over</mark>, the students celebrated.</div>
</div>
`}
],
quiz:[
{t:'mc', q:'___ all her homework, she went out with friends.', o:['Doing','Done','Having done','To do'], a:2, e:'Сначала сделала, потом ушла → Having done.', l:'C1'},
{t:'mc', q:'___ in 1889, the Eiffel Tower was meant to be temporary.', o:['Building','Built','Having built','To build'], a:1, e:'Башню построили (пассив) → Built.', l:'B2'},
{t:'mc', q:'___ what to say, he stayed silent.', o:['Not knowing','Knowing not','Don’t knowing','No knowing'], a:0, e:'Отрицание ставится перед причастием: Not knowing.', l:'C1'},
{t:'gap', q:'___ (feel) unwell, she left work early.', a:['feeling'], e:'Причина, активное значение → Feeling.', l:'B2'},
{t:'mc', q:'Which sentence is correct?', o:['Walking into the room, the lights went out.','Walking into the room, I noticed the lights were off.','Walked into the room, I noticed the lights were off.','Having walk into the room, I noticed the lights.'], a:1, e:'Подлежащее главного предложения (I) выполняет действие причастия.', l:'C1'},
{t:'gap', q:'If ___ (store) properly, the cheese will last for months.', a:['stored'], e:'Сыр хранят (пассив) → If stored.', l:'C1'},
{t:'mc', q:'___ been warned about the risks, they decided to go anyway.', o:['Having','Being','Had','Have'], a:0, e:'Перфектное пассивное причастие: Having been warned.', l:'C1'},
{t:'mc', q:'The weather ___ fine, we decided to have a picnic.', o:['being','been','was being','to be'], a:0, e:'Абсолютная конструкция: The weather being fine…', l:'C2'},
{t:'mc', q:'People ___ near the airport often complain about the noise.', o:['living','lived','having lived','live'], a:0, e:'Сокращённое придаточное: who live → living.', l:'B2'},
{t:'mc', q:'Since ___ to Lisbon, she has learned Portuguese.', o:['moving','moved','having moving','she move'], a:0, e:'Since + -ing.', l:'C1'}
]
},

/* ---------------- GERUNDS & INFINITIVES ---------------- */
{
id:'gerunds', title:'Gerunds & Infinitives', ru:'Герундий и инфинитив', levels:['B2','C1','C2'],
lead:'Какую форму поставить после глагола, -ing или to do? Часто это просто нужно запомнить, но у ряда глаголов от выбора меняется смысл, и это любимая тема экзаменов.',
sections:[
{h:'Основные модели', lvl:'B2', html:`
<table><tr><th>Модель</th><th>Глаголы</th></tr>
<tr><td>+ -ing</td><td>avoid, enjoy, mind, consider, deny, risk, suggest, can’t help, can’t stand, give up, keep</td></tr>
<tr><td>+ to do</td><td>decide, refuse, manage, afford, expect, tend, hope, plan, pretend, seem</td></tr>
<tr><td>+ sb + to do</td><td>allow, encourage, force, persuade, want, would like</td></tr>
<tr><td>после предлога</td><td>всегда -ing: <i>good at cooking, interested in learning, without saying</i></td></tr></table>
`},
{h:'Глаголы, меняющие смысл', lvl:'B2', html:`
<table><tr><th>Глагол</th><th>+ -ing</th><th>+ to do</th></tr>
<tr><td>remember / forget</td><td>помнить, что сделал</td><td>не забыть сделать</td></tr>
<tr><td>stop</td><td>перестать делать</td><td>остановиться, чтобы сделать</td></tr>
<tr><td>try</td><td>попробовать (как эксперимент)</td><td>постараться (трудно)</td></tr>
<tr><td>regret</td><td>сожалеть о сделанном</td><td>с сожалением сообщить</td></tr>
<tr><td>go on</td><td>продолжать то же</td><td>перейти к другому</td></tr>
<tr><td>mean</td><td>означать</td><td>намереваться</td></tr></table>
<div class="ex">
<div>I remember <mark>locking</mark> the door. · Remember <mark>to lock</mark> the door.</div>
<div>He stopped <mark>smoking</mark>. · He stopped <mark>to smoke</mark>.</div>
</div>
`},
{h:'to как предлог', lvl:'C1', c:true, html:`
<p>В этих выражениях <b>to</b>: предлог, поэтому после него -ing.</p>
<p><i>look forward to, object to, be used to, get used to, when it comes to, in addition to, prefer X to Y, be committed to, admit to</i></p>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ I look forward to hear from you.</span> → <span style="color:var(--ok)">✓ I look forward to hearing from you.</span></p></div></div>
`},
{h:'Перфектные и пассивные формы', lvl:'C1', c:true, html:`
<table><tr><th></th><th>Активный</th><th>Пассивный</th></tr>
<tr><td>Инфинитив</td><td>to do · to have done</td><td>to be done · to have been done</td></tr>
<tr><td>Герундий</td><td>doing · having done</td><td>being done · having been done</td></tr></table>
<div class="ex">
<div>He seems <mark>to have left</mark>. (кажется, уже ушёл)</div>
<div>I don’t remember <mark>being told</mark> about it.</div>
</div>
`},
{h:'Инфинитив без to', lvl:'C1', c:true, html:`
<div class="ex">
<div><b>make / let</b> sb do: <i>She made me wait.</i>: но в пассиве с to: <i>I was made <mark>to wait</mark>.</i></div>
<div><b>see / hear</b> sb do (всё действие) vs doing (часть): <i>I saw him cross the road.</i> · <i>I saw him crossing the road.</i></div>
</div>
`}
],
quiz:[
{t:'mc', q:'I’m looking forward to ___ you next week.', o:['see','seeing','to see','have seen'], a:1, e:'look forward to + -ing (to: предлог).', l:'B2'},
{t:'mc', q:'I remember ___ the door, but now it’s open!', o:['to lock','locking','lock','to have lock'], a:1, e:'remember + -ing = помню, что сделал.', l:'B2'},
{t:'mc', q:'Remember ___ the door when you leave.', o:['to lock','locking','lock','locked'], a:0, e:'remember + to do = не забудь сделать.', l:'B2'},
{t:'mc', q:'On his way home, he stopped ___ to an old friend.', o:['to talk','talking','talk','talked'], a:0, e:'stop + to do = остановился, чтобы сделать.', l:'C1'},
{t:'gap', q:'I regret ___ (inform) you that your application has been rejected.', a:['to inform'], e:'regret + to do = с сожалением сообщаю.', l:'C1'},
{t:'mc', q:'She seems ___ her keys again.', o:['to lose','to have lost','losing','having lose'], a:1, e:'Действие уже произошло → перфектный инфинитив to have lost.', l:'C1'},
{t:'mc', q:'We were made ___ for two hours.', o:['wait','to wait','waiting','waited'], a:1, e:'make sb do, но в пассиве: be made to do.', l:'C1'},
{t:'mc', q:'I saw him ___ the street, but I didn’t see where he went.', o:['crossing','to cross','crossed','crosses'], a:0, e:'Видел часть действия (процесс) → see sb doing.', l:'C1'},
{t:'gap', q:'Have you tried ___ (restart) the computer?', a:['restarting'], e:'try + -ing = попробовать в качестве эксперимента.', l:'B2'},
{t:'mc', q:'I object to ___ like a child.', o:['be treated','being treated','treat','to be treated'], a:1, e:'object to + -ing; смысл пассивный → being treated.', l:'C2'}
]
},

/* ---------------- RELATIVE ---------------- */
{
id:'relative', title:'Relative Clauses', ru:'Относительные придаточные', levels:['B2','C1','C2'],
lead:'Русское «который» в английском превращается в who, which, that, whose, whom, where. Важно различать определительные и описательные придаточные: от этого зависят запятые и выбор слова.',
sections:[
{h:'Defining и non-defining', lvl:'B2', html:`
<table><tr><th>Defining (нужно для смысла)</th><th>Non-defining (доп. информация)</th></tr>
<tr><td>Без запятых</td><td>С запятыми</td></tr>
<tr><td>Можно that</td><td>that нельзя</td></tr>
<tr><td>Можно опустить местоимение-дополнение: <i>the book (that) I read</i></td><td>Опустить нельзя</td></tr>
<tr><td>The man who lives next door is a pilot.</td><td>My brother, who lives in Berlin, is a doctor.</td></tr></table>
`},
{h:'Предлоги и whom', lvl:'C1', c:true, html:`
<div class="ex">
<div>The man <mark>to whom</mark> I spoke… (формально)</div>
<div>The man <mark>(who) I spoke to</mark>… (нейтрально)</div>
<div class="no">✗ The man to who I spoke… · ✗ The man to that I spoke…</div>
<div>The year <mark>in which</mark> he was born… · <mark>by which time</mark> it was too late.</div>
</div>
`},
{h:'which о всём предложении', lvl:'C1', c:true, html:`
<div class="ex">
<div>He passed the exam, <mark>which</mark> surprised everyone. (удивило то, что он сдал)</div>
<div class="no">✗ He passed the exam, what surprised everyone.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p>«Всё, что он сказал» → <span style="color:var(--ok)">✓ Everything (that) he said</span>, а не <span style="color:var(--bad)">✗ everything what he said</span>. <i>What</i> = «то, что» и стоит без слова перед ним: <i>What he said was true.</i></p></div></div>
`},
{h:'Квантификатор + of which / whom', lvl:'C1', c:true, html:`
<div class="ex">
<div>I have three sisters, <mark>all of whom</mark> are teachers.</div>
<div>He wrote two novels, <mark>neither of which</mark> was published.</div>
<div>She gave several reasons, <mark>the most important of which</mark> was cost.</div>
</div>
`},
{h:'Сокращённые и особые формы', lvl:'C2', c:true, html:`
<ul class="use">
<li>Сокращение: <i>the man <b>sitting</b> there</i> · <i>the money <b>stolen</b> yesterday</i></li>
<li>После first, last, only, превосходной степени: инфинитив: <i>She was the first <b>to notice</b>.</i></li>
<li><b>whereby</b> = посредством которого: <i>a system whereby staff share profits</i></li>
<li><b>the extent to which</b>, <b>the way in which</b>, <b>the reason why</b></li>
</ul>
`}
],

/* ---------------- ARTICLES ---------------- */
{
id:'articles', title:'Articles', ru:'Артикли', levels:['B1','B2','C1','C2'],
lead:'Самая коварная тема для русскоговорящих на любом уровне, потому что в русском артиклей нет. Полезный вопрос: «какой-то, один из» (a), «тот самый, понятно какой» (the) или «вообще, в целом» (без артикля)?',
sections:[
{h:'Обобщение', lvl:'B2', html:`
<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td>Множ. ч. без артикля</td><td>в целом (самое частое)</td><td>Tigers are dangerous.</td></tr>
<tr><td>a + ед. ч.</td><td>любой представитель</td><td>A tiger is a big cat.</td></tr>
<tr><td>the + ед. ч.</td><td>вид как класс (научно)</td><td>The tiger is endangered.</td></tr>
<tr><td>Абстрактное без артикля</td><td>понятие вообще</td><td>Life is short. · Love is blind.</td></tr>
<tr><td>the + абстрактное</td><td>конкретизированное</td><td>the life of Mozart</td></tr></table>
`},
{h:'Учреждения и устойчивые фразы', lvl:'B2', html:`
<p>Без артикля, если речь о назначении: <i>go to school / university / hospital / prison / church / bed / work</i>. С <b>the</b>: если о здании: <i>I went to <b>the</b> school to see the teacher.</i></p>
<p>Также без артикля: <i>by car, at night, at home, have lunch, in time, on foot</i>.</p>
`},
{h:'Географические названия', lvl:'B2', html:`
<table><tr><th>Без артикля</th><th>С the</th></tr>
<tr><td>страны, города, улицы: Russia, Paris, Oxford Street</td><td>реки, моря, океаны: the Volga, the Black Sea</td></tr>
<tr><td>озёра: Lake Baikal</td><td>горные цепи, пустыни: the Alps, the Sahara</td></tr>
<tr><td>отдельные горы: Everest</td><td>группы островов: the Maldives</td></tr>
<tr><td>континенты: Europe</td><td>страны-союзы и во множ. ч.: the UK, the USA, the Netherlands</td></tr></table>
`},
{h:'the + прилагательное, уникальное', lvl:'C1', c:true, html:`
<ul class="use">
<li>Группы людей: <i>the rich, the unemployed, the elderly, the British</i> (+ глагол во множ. ч.)</li>
<li>Единственное в своём роде: <i>the sun, the internet, the media, the environment</i></li>
<li>Превосходная степень и порядковые: <i>the best, the first, the same, the only</i></li>
<li><i>The more</i> you practise, <i>the better</i> you get.</li>
</ul>
`},
{h:'Ловушки', lvl:'C1', c:true, html:`
<div class="ex">
<div>Профессии: She’s <mark>an</mark> engineer. (<span class="no">✗ She’s engineer</span>)</div>
<div>Восклицания: What <mark>a</mark> day! · What awful weather! (неисчисляемое: без a)</div>
<div>Неисчисляемое + прилагательное: <mark>a</mark> good knowledge of Spanish, <mark>a</mark> sense of humour</div>
<div>Первое и повторное упоминание: I saw <mark>a</mark> film. <mark>The</mark> film was boring.</div>
</div>
`}
],
quiz:[

{t:'mc', q:'She’s ___ engineer at a big company.', o:['(без артикля)','the','an','a'], a:2, e:'Профессия → a/an; engineer начинается с гласного звука → an.', l:'B1'},
{t:'mc', q:'He was taken to ___ hospital after the accident. (BrE)', o:['a','the','(без артикля)'], a:2, e:'Как пациент (назначение учреждения) → без артикля в британском английском.', l:'B2'},
{t:'mc', q:'We sailed down ___ Danube to ___ Black Sea.', o:['Ø / the','the / the','the / Ø','Ø / Ø'], a:1, e:'Реки и моря: с the.', l:'B2'},
{t:'mc', q:'___ should pay higher taxes.', o:['Rich','The rich','A rich','Riches'], a:1, e:'the + прилагательное = группа людей.', l:'C1'},
{t:'mc', q:'What ___ terrible weather!', o:['a','the','(без артикля)'], a:2, e:'weather: неисчисляемое, поэтому в восклицании без a.', l:'C1'},
{t:'mc', q:'She has ___ excellent knowledge of Spanish.', o:['(без артикля)','the','an','a'], a:2, e:'knowledge обычно неисчисляемое, но с прилагательным получает a/an: an excellent knowledge.', l:'C1'},
{t:'mc', q:'___ more you practise, ___ better you get.', o:['The / the','A / a','Ø / Ø','More / better'], a:0, e:'Конструкция the + сравнительная степень, the + сравнительная степень.', l:'B2'},
{t:'mc', q:'I went to ___ school to talk to my son’s teacher.', o:['(без артикля)','the','a'], a:1, e:'Пришёл в здание не как ученик → the school.', l:'C1'},
{t:'mc', q:'___ Netherlands is famous for its tulips.', o:['(без артикля)','The','A'], a:1, e:'Названия во множественном числе → the Netherlands.', l:'B2'}
]
},

/* ---------------- ELLIPSIS ---------------- */
{
id:'ellipsis', title:'Ellipsis & Substitution', ru:'Эллипсис и замещение', levels:['B2','C1'],
lead:'Носители избегают повторов: заменяют фразы словами so, do, one или просто опускают их. Без этого речь звучит тяжело и «по-учебному».',
sections:[
{h:'so и not', lvl:'B2', html:`
<div class="ex">
<div>A: Will she come? B: I think <mark>so</mark>. / I hope <mark>so</mark>. / I’m afraid <mark>so</mark>.</div>
<div>A: Will it rain? B: I hope <mark>not</mark>. / I’m afraid <mark>not</mark>. / I don’t think <mark>so</mark>.</div>
</div>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ I don’t hope so.</span> → <span style="color:var(--ok)">✓ I hope not.</span> · «Боюсь, что да» → <i>I’m afraid so</i>, без that и it.</p></div></div>
`},
{h:'Вспомогательные глаголы', lvl:'B2', html:`
<div class="ex">
<div>I’d help you if I <mark>could</mark>.</div>
<div>She hasn’t finished, but I <mark>have</mark>.</div>
<div>A: I loved the film.: <mark>Did you?</mark> I didn’t.</div>
<div>She can speak French, and so <mark>can</mark> her brother.</div>
</div>
`},
{h:'do so, one / ones, that of', lvl:'C1', c:true, html:`
<div class="ex">
<div>He promised to call, but he didn’t <mark>do so</mark>. (формально)</div>
<div>I don’t like these shoes, can I see the black <mark>ones</mark>?</div>
<div>The population of Tokyo is larger than <mark>that of</mark> London. · Her results were better than <mark>those of</mark> her classmates.</div>
</div>
`},
{h:'Опущение слов', lvl:'C1', c:true, html:`
<ul class="use">
<li>После to: <i>A: Will you come? B: I’d love <b>to</b>.</i> · <i>You can leave if you want <b>to</b>.</i></li>
<li>Краткие формулы: <i>if so, if not, if necessary, when possible, where appropriate</i></li>
<li>Разговорная речь: <i>Sounds good. · Want some coffee? · Never mind.</i></li>
</ul>
`}
],
quiz:[
{t:'mc', q:'A: Will it rain tomorrow? B: I hope ___.', o:['not','no','don’t','so not'], a:0, e:'Отрицательный ответ с hope → I hope not.', l:'B2'},
{t:'mc', q:'A: Is she coming? B: I’m afraid ___.', o:['it','so','that','yes'], a:1, e:'I’m afraid so = боюсь, что да.', l:'B2'},
{t:'gap', q:'I’d help you if I ___. (одно слово)', a:['could'], e:'Опускаем повтор: if I could (help you).', l:'B2'},
{t:'mc', q:'A: Would you like to join us? B: I’d love ___.', o:['it','to','so','(ничего)'], a:1, e:'После love / want / like остаётся to.', l:'B2'},
{t:'mc', q:'The climate here is milder than ___ of the north.', o:['this','that','one','it'], a:1, e:'Замещение неисчисляемого или единственного числа → that of.', l:'C1'},
{t:'mc', q:'I don’t like these shoes, can I see the black ___?', o:['one','ones','them','those ones'], a:1, e:'Множественное число → ones.', l:'B2'},
{t:'mc', q:'He was asked to leave, but refused to do ___.', o:['it','that','so','this'], a:2, e:'do so заменяет действие (формально).', l:'C1'},
{t:'mc', q:'Is the report ready? If ___, please send it to me.', o:['it','so','yes','that'], a:1, e:'if so = если да.', l:'C1'},
{t:'mc', q:'She can speak French, and so ___ her brother.', o:['does','can','is','has'], a:1, e:'Повторяем тот же вспомогательный глагол: can.', l:'B2'},
{t:'gap', q:'I haven’t seen the film, but my wife ___. (одно слово)', a:['has'], e:'Present Perfect → вспомогательный has.', l:'B2'}
]
}
);

{
id:'quantifiers', title:'Quantifiers & Determiners', ru:'Квантификаторы', levels:['B1','B2','C1'],

sections:[

<table><tr><th></th><th>Исчисляемые</th><th>Неисчисляемые</th></tr>
<tr><td>немного, но достаточно (+)</td><td>a few friends</td><td>a little money</td></tr>

`},
{h:'each, every, both, either, neither', lvl:'B2', html:`
<ul class="use">
<li><b>every</b> + ед. ч., без of: <i>every student</i> · но <i>every one of them</i></li>

</ul>
`},
{h:'all, whole, no, none', lvl:'B2', html:`
<div class="ex">
<div><mark>all day</mark> = <mark>the whole day</mark> · <mark>all the money</mark> (не ✗ the whole money: whole только с исчисляемыми)</div>

</div>
`},
{h:'number, amount, deal', lvl:'C1', c:true, html:`

<tr><td>a large amount of</td><td>неисчисляемые</td><td>ед. ч.: A large amount of money <b>was</b>…</td></tr>
<tr><td>a great deal of</td><td>неисчисляемые</td><td>ед. ч.</td></tr></table>
`}
],

/* ---------------- LINKING ---------------- */
{
id:'linking', title:'Linking Words', ru:'Связки и дискурсивные маркеры', levels:['B2','C1','C2'],
lead:'Связки делают текст логичным, и именно за них экзаменаторы ставят баллы за coherence. Главная трудность в грамматике: после одних идёт предложение, после других: существительное.',
sections:[
{h:'Противопоставление', lvl:'B2', html:`
<table><tr><th>После связки</th><th>Связки</th><th>Пример</th></tr>
<tr><td>предложение</td><td>although, though, even though, whereas, while</td><td>Although it rained, we went out.</td></tr>
<tr><td>сущ. / -ing</td><td>despite, in spite of</td><td>Despite the rain, we went out.</td></tr>
<tr><td>новое предложение + запятая</td><td>However, Nevertheless, Nonetheless</td><td>It rained. However, we went out.</td></tr>
<tr><td>прил. / сущ.</td><td>albeit (C2)</td><td>a positive, albeit small, change</td></tr></table>
<div class="ru"><span class="tag">RU</span><div><p><span style="color:var(--bad)">✗ Despite it was raining…</span> · <span style="color:var(--bad)">✗ Despite of the rain…</span></p><p><span style="color:var(--ok)">✓ Despite the rain… / Despite the fact that it was raining…</span></p></div></div>
`},
{h:'Причина и следствие', lvl:'B2', html:`
<ul class="use">
<li>+ предложение: <i>because, as, since</i></li>
<li>+ существительное: <i>because of, due to, owing to</i>: <i>The flight was delayed due to fog.</i></li>
<li>Следствие: <i>so, therefore, consequently, as a result, hence (C1), thus (C1)</i></li>
</ul>
`},
{h:'Добавление и цель', lvl:'B2', html:`
<ul class="use">
<li>Добавление: <i>moreover, furthermore, in addition, besides, what is more</i></li>
<li>Цель: <i>to, in order to, so as to, so as not to, so that + can/could</i></li>
<li><b>in case</b> = на случай, если (мера предосторожности) ≠ if: <i>Take a map in case you get lost.</i></li>
</ul>
`},
{h:'Дискурсивные маркеры', lvl:'C1', c:true, html:`
<table><tr><th>Маркер</th><th>Значение</th></tr>
<tr><td>That said / Having said that</td><td>тем не менее (уступка после сказанного)</td></tr>
<tr><td>Admittedly</td><td>надо признать</td></tr>
<tr><td>After all</td><td>в конце концов (ведь)</td></tr>
<tr><td>On the whole / By and large</td><td>в целом</td></tr>
<tr><td>Notwithstanding (C2)</td><td>несмотря на (формально)</td></tr>
<tr><td>Insofar as (C2)</td><td>в той мере, в какой</td></tr></table>
`}
],
quiz:[

{t:'mc', q:'My sister loves sport, ___ I prefer reading.', o:['whereas','despite','therefore','moreover'], a:0, e:'Сравнение двух фактов → whereas.', l:'B2'},

/* ---------------- HEDGING ---------------- */
{
id:'hedging', title:'Hedging', ru:'Смягчение и осторожные формулировки', levels:['B2','C1','C2'],
lead:'Русский академический и деловой стиль часто категоричен: «это доказывает», «вы не правы». В английском так звучит грубо или ненаучно. Хеджирование: способ говорить осторожно и вежливо.',
sections:[
{h:'Зачем', lvl:'C1', c:true, html:`
<div class="ex">
<div class="no">✗ This proves that social media causes depression.</div>
<div class="yes">✓ This suggests that social media may contribute to depression.</div>
</div>
<p>В эссе IELTS/CAE и научных статьях категоричные утверждения без доказательств снижают оценку.</p>
`},
{h:'Глаголы и фразы', lvl:'C1', c:true, html:`
<ul class="use">
<li><i>seem to / appear to</i>: The results <b>seem to</b> indicate…</li>
<li><i>tend to</i>: Young people <b>tend to</b> spend more time online.</li>
<li><i>suggest, indicate</i> вместо prove, show</li>
<li><i>It would appear that… · It could be argued that… · There is some evidence that…</i></li>
</ul>
`},
{h:'Наречия и ограничители', lvl:'C1', c:true, html:`
<p><i>arguably, possibly, probably, relatively, somewhat, largely, to some extent, in most cases</i></p>
<p>Вместо all/always: <i>most, many, a majority of, often, generally</i></p>
`},
{h:'Смягчение в разговоре', lvl:'B2', html:`
<table><tr><th>Прямо</th><th>Мягче</th></tr>
<tr><td>You’re wrong.</td><td>I’m not sure that’s quite right.</td></tr>
<tr><td>It’s bad.</td><td>It’s not very good. / It isn’t quite there yet.</td></tr>
<tr><td>Do it again.</td><td>It might be worth having another look.</td></tr>
<tr><td>I want…</td><td>I was wondering if…</td></tr></table>
`}
],
quiz:[

{h:'Одно слово: несколько переводов', lvl:'C1', c:true, html:`
